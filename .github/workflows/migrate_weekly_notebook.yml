name: Migrate Weekly Notebook

on:
  push:
    branches: [main]
    paths:
      - tools/migrate_weekly_notebook.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch and validate existing notebook in place
        run: python tools/migrate_weekly_notebook.py

      - name: Commit migrated notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FPL_VORTEX_WEEKLY.ipynb
          if git diff --cached --quiet; then
            echo 'Notebook already migrated.'
          else
            git commit -m 'Make weekly notebook GitHub Actions compatible'
            git push origin HEAD:main
          fi
