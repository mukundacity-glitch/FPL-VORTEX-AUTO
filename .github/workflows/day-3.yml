          )
          
          _new_fixture_logic = '''    if key=="00_intro":
                  # Day 3_3 opens with the Video 2 recap; no legacy pre-agenda fixture board.
                  fixture_grid_window=None
          '''
          runtime_source_text = _day3_replace_range_in_cell(
              runtime_source_text,
              _anim_cell,
              '    if key=="00_intro":\n        _fixture_event=',
              '            raise RuntimeError(f"Invalid intro fixture window:',
              _new_fixture_logic,
              "Remove stale Day 1 intro fixture-window logic",
