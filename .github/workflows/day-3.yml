          )
          
          _new_prints = '''print("✅ Intro sequence: left Video 2 recap first → right Video 3/3 agenda second")
          print("✅ All 12 agenda cards pop exactly on Ryan WordBoundary timing")
          print("✅ Right side stays blank until Ryan begins the Video 3/3 agenda")'''
          runtime_source_text = _day3_replace_range_in_cell(
              runtime_source_text,
              _anim_cell,
              'print("✅ Intro sequence: blank centre → centered fixtures → agenda 01–04 one by one")',
              'print("✅ Intro fixture board is fully removed before agenda 01")',
