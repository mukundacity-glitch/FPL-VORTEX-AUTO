                    for _def_ids in _d3_itertools.combinations(_groups_force["DEF"],_d):
                        for _mid_ids in _d3_itertools.combinations(_groups_force["MID"],_m):
                            for _fwd_ids in _d3_itertools.combinations(_groups_force["FWD"],_f):
                                _ids = tuple(_gk_ids+_def_ids+_mid_ids+_fwd_ids)
                                if _d3_tc_requested not in _ids:
                                    continue
                                _score = sum(float(_score_map_force.get(pid,0.0)) for pid in _ids)
                                if _score > _best_force_score:
                                    _best_force_score = _score
                                    _best_force = _ids
            if not _best_force:
                raise RuntimeError("Unable to build a legal XI containing the manual Triple Captain")
            _d3_xi = _d3_squad.loc[
                _d3_squad["player_id"].astype(int).isin(set(_best_force))
            ].copy()
            _d3_bench = _d3_squad.loc[
                ~_d3_squad["player_id"].astype(int).isin(set(_best_force))
            ].copy()
            _gk_bench = _d3_bench.loc[
                _d3_bench["position"].astype(str).str.upper().replace({"GKP":"GK"}).eq("GK")
            ].copy()
            _out_bench = _d3_bench.loc[
                ~_d3_bench["player_id"].isin(_gk_bench["player_id"])
            ].sort_values("final_gameweek_xpts",ascending=False).copy()
            _out_bench["bench_order"] = np.arange(1,len(_out_bench)+1)
            if not _gk_bench.empty:
                _gk_bench["bench_order"] = 4
            _d3_bench = pd.concat([_out_bench,_gk_bench],ignore_index=True)
