name: Day 3_3

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: "Day 3 render mode"
        required: true
        default: DRAFT
        type: choice
        options:
          - DRAFT
          - FINAL

permissions:
  contents: read

concurrency:
  group: fpl-vortex-day-3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DAY3_RENDER_MODE: ${{ inputs.render_mode }}
  DAY3_RUNTIME_SOURCE: 3_final_day3.py
  DAY3_STUDIO_SCRIPT: vortex/day3_youtube_studio.py
  DAY3_UPLOAD_SCRIPT: vortex/day3_youtube_private_upload.py
  DAY3_OUTPUT_ROOT: /content/drive/MyDrive/FPL_VORTEX/Day_3_3
  DAY3_DRIVE_PATH: FPL_VORTEX/Day_3_3
  DAY1_ASSET_FOLDER_ID: 1h3Loznr5RnsMyh-kUd-zMxEgOf98uFSt
  DAY1_ASSET_DIR: /content/drive/MyDrive/FPL_VORTEX/Assets
  DAY3_CHIP_ASSET_DIR: /content/FPL_VORTEX_DAY3_CHIP_ASSETS
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  run-day-3:
    name: Run isolated Day 3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Verify standalone Day 3 runtime
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Locked file changed: $path ($actual != $expected)" >&2
              exit 1
            fi
          }
          verify_blob "1_final_day1.py" "27ced793bb6934faada3a098815378512bac11c0"
          verify_blob ".github/workflows/day-1.yml" "240ba9024f11f894e98fad2f3199db041083a904"
          verify_blob ".github/workflows/day-2.yml" "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          verify_blob "vortex/day1_media.py" "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"
          echo "Locked Day 1/Day 2 files: PASS"

          python - <<'PY'
          import ast
          import collections
          import hashlib
          import os
          import re
          from pathlib import Path

          source_path = Path(os.environ["DAY3_RUNTIME_SOURCE"]).resolve()
          source_bytes = source_path.read_bytes()
          source = source_bytes.decode("utf-8")

          forbidden = (
              "_day3_replace_in_cell",
              "_day3_replace_range_in_cell",
              "replace_exact(",
              "DAY3_BASE_SOURCE",
              "1_final_day1.py",
              "FPL_VORTEX_FIRST_DAY_WORK",
              "_DAY3_OLD_",
              "day1_video_clone",
              "SUBSCRIBE FOR DAY 2",
              "TOMORROW VIDEO",
          )
          stale = [marker for marker in forbidden if marker in source]
          if stale:
              raise SystemExit(
                  "Standalone Day 3 contains migration/Day 1 remnants: "
                  + " | ".join(stale)
              )

          required = (
              'data-vx-day3="intro-agenda-v3"',
              '"03_projected_goals"',
              '"03_defcon"',
              '"04_final_shortlists"',
              '"05_transfer_decision_desk"',
              '"05a_my_plan_roll"',
              '"05b_my_plan_transfer"',
              '"05c_my_plan_free_hit"',
              '"05d_my_plan_wildcard"',
              '"05e_my_plan_roll_bb"',
              '"05f_my_plan_roll_tc"',
              '"05g_my_plan_transfer_bb"',
              '"05h_my_plan_transfer_tc"',
              '# SLIDE 6 — BENCHING DILEMMA',
              'DAY 3_3 — SLIDE 7 • CHIP STRATEGY',
              'data-vx-day3="elite-outro-v1"',
              'VOICE = "en-GB-RyanNeural"',
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(
                  "Standalone Day 3 is missing required content: "
                  + " | ".join(missing)
              )
          if source.count('VOICE = "en-GB-RyanNeural"') != 1:
              raise SystemExit("Day 3 must define Ryan narration exactly once")

          tree = ast.parse(source, filename=str(source_path))
          compile(
              source,
              str(source_path),
              "exec",
              flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
              dont_inherit=True,
          )

          definitions = collections.defaultdict(list)
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  definitions[node.name].append(node.lineno)
              if isinstance(node, ast.Dict):
                  keys = [
                      key.value
                      for key in node.keys
                      if isinstance(key, ast.Constant)
                      and isinstance(key.value, (str, int, float, bytes))
                  ]
                  duplicates = [
                      key for key, count in collections.Counter(keys).items()
                      if count > 1
                  ]
                  if duplicates:
                      raise SystemExit(
                          f"Duplicate literal dictionary keys near line {node.lineno}: "
                          f"{duplicates}"
                      )
          duplicate_definitions = {
              name: locations
              for name, locations in definitions.items()
              if len(locations) > 1
          }
          if duplicate_definitions:
              raise SystemExit(
                  "Duplicate Day 3 definitions: " + repr(duplicate_definitions)
              )

          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 standalone Day 3 cell blocks, found {len(cells)}"
              )
          for index, cell in enumerate(cells, 1):
              compile(
                  cell,
                  f"{source_path.name}::cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  dont_inherit=True,
              )

          for helper in (
              Path(os.environ["DAY3_STUDIO_SCRIPT"]),
              Path(os.environ["DAY3_UPLOAD_SCRIPT"]),
          ):
              helper_source = helper.read_text(encoding="utf-8")
              ast.parse(helper_source, filename=str(helper))
              compile(helper_source, str(helper), "exec")

          runtime_hash = hashlib.sha256(source_bytes).hexdigest()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"DAY3_SOURCE_SHA256={runtime_hash}\n")
          print("Standalone Day 3 AST/cell/duplicate-key validation: PASS")
          PY

      - name: Verify private YouTube upload configuration
        if: ${{ inputs.render_mode == 'FINAL' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          client_id = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_ID")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_ID")
              or ""
          ).strip()
          client_secret = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_SECRET")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET")
              or ""
          ).strip()
          refresh_token = (os.environ.get("YOUTUBE_OAUTH_REFRESH_TOKEN") or "").strip()
          channel_id = (os.environ.get("YOUTUBE_CHANNEL_ID") or "").strip()

          missing = []
          if not client_id:
              missing.append("YOUTUBE_OAUTH_CLIENT_ID or GOOGLE_OAUTH_CLIENT_ID")
          if not client_secret:
              missing.append(
                  "YOUTUBE_OAUTH_CLIENT_SECRET or GOOGLE_OAUTH_CLIENT_SECRET"
              )
          if not refresh_token:
              missing.append("YOUTUBE_OAUTH_REFRESH_TOKEN")
          if not channel_id:
              missing.append("YOUTUBE_CHANNEL_ID")
          if missing:
              raise SystemExit(
                  "Missing required private YouTube upload secret(s): "
                  + ", ".join(missing)
              )
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("YouTube OAuth client ID has an invalid format")
          if not re.fullmatch(r"UC[A-Za-z0-9_-]{22}", channel_id):
              raise SystemExit("YOUTUBE_CHANNEL_ID has an invalid format")
          print("Private YouTube upload configuration: PASS")
          print("Automatic Public/Unlisted/scheduled publishing: DISABLED")
          PY

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<3" \
            "pyarrow>=17,<20" \
            "Pillow>=10.4,<12" \
            "scipy>=1.14,<2" \
            "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" \
            "playwright>=1.46,<2" \
            "edge-tts>=6.1,<8" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"

      - name: Install Chromium runtime
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Configure private Google Drive connection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          secret_names = (
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
          )
          secrets = {
              name: (os.environ.get(name) or "").strip()
              for name in secret_names
          }
          missing = [name for name, value in secrets.items() if not value]
          if missing:
              raise SystemExit(
                  "Missing required GitHub secret(s): " + ", ".join(missing)
              )
          if not secrets["GOOGLE_OAUTH_CLIENT_ID"].endswith(
              ".apps.googleusercontent.com"
          ):
              raise SystemExit("GOOGLE_OAUTH_CLIENT_ID has an invalid format")

          request_data = urllib.parse.urlencode(
              {
                  "client_id": secrets["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": secrets["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=request_data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              refreshed = json.loads(response.read().decode("utf-8"))

          expires_in = int(refreshed.get("expires_in", 3600))
          token = {
              "access_token": refreshed["access_token"],
              "token_type": refreshed.get("token_type", "Bearer"),
              "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
              "expiry": (
                  datetime.now(timezone.utc)
                  + timedelta(seconds=max(60, expires_in - 60))
              ).isoformat().replace("+00:00", "Z"),
          }

          config_dir = Path(os.environ["RUNNER_TEMP"]) / "rclone"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_path = config_dir / "rclone.conf"
          token_json = json.dumps(token, separators=(",", ":"))
          config_path.write_text(
              "\n".join(
                  (
                      "[vortex-drive]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      "",
                      "[day1-assets]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      f"root_folder_id = {os.environ['DAY1_ASSET_FOLDER_ID']}",
                      "",
                  )
              ),
              encoding="utf-8",
          )
          config_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"RCLONE_CONFIG={config_path}\n")
          print("Google Drive OAuth connection: PASS")
          PY

      - name: Restore required Google Drive state
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content

          restore_optional() {
            local remote_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if rclone lsf "vortex-drive:${remote_path}" --max-depth 1 >/dev/null 2>&1; then
              mkdir -p "${local_path}"
              rclone copy "vortex-drive:${remote_path}" "${local_path}" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Restored My Drive/${remote_path}"
            else
              echo "Optional Drive path not present: My Drive/${remote_path}"
            fi
          }

          required_path="FPL_VORTEX_DATA/00_SOURCE_ARCHIVE/FPL_CORE/data"
          if ! rclone lsf "vortex-drive:${required_path}" --max-depth 1 >/dev/null; then
            echo "Required Drive path is missing: My Drive/${required_path}" >&2
            exit 1
          fi

          restore_optional "${DAY3_DRIVE_PATH}"
          restore_optional "FPL_VORTEX/MODEL_INPUTS"
          restore_optional "FPL_VORTEX/DECISION_ENGINE"
          restore_optional "FPL_VORTEX/RAW_DATA"
          restore_optional "FPL_VORTEX/MODEL_HISTORY"
          restore_optional "FPL_VORTEX/elements"
          restore_optional "elements"
          restore_optional "${required_path}"
          restore_optional "FPL_VORTEX_DATA/03_ELITE_MANAGERS"
          restore_optional "FPL_VORTEX_DATA/04_MASTER"
          restore_optional "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          restore_optional "FPL_VORTEX_DATA/06_SNAPSHOTS"
          restore_optional "FPL_VORTEX_DATA/07_LOGS"

          mkdir -p "${DAY1_ASSET_DIR}"
          rclone copy "day1-assets:" "${DAY1_ASSET_DIR}" \
            --filter "+ /opening.mp4" \
            --filter "+ /Background_music.mp3" \
            --filter "+ /outro.mp3" \
            --filter "- **" \
            --transfers 4 --checkers 6
          for asset_name in opening.mp4 Background_music.mp3 outro.mp3; do
            if [[ ! -s "${DAY1_ASSET_DIR}/${asset_name}" ]]; then
              echo "Required Day 1 asset is missing: ${asset_name}" >&2
              exit 1
            fi
          done
          echo "Restored opening and audio assets by confirmed Drive folder ID"


          rm -rf "${DAY3_CHIP_ASSET_DIR}"
          mkdir -p "${DAY3_CHIP_ASSET_DIR}"
          rclone copy "day1-assets:" "${DAY3_CHIP_ASSET_DIR}" \
            --filter "+ /WC.png" \
            --filter "+ /TC.png" \
            --filter "+ /FH.png" \
            --filter "+ /BB.png" \
            --filter "- **" \
            --transfers 4 --checkers 6
          for chip_asset in WC.png TC.png FH.png BB.png; do
            if [[ ! -s "${DAY3_CHIP_ASSET_DIR}/${chip_asset}" ]]; then
              echo "Required Day 3 chip artwork is missing: ${chip_asset}" >&2
              exit 1
            fi
          done
          echo "Restored Day 3 Slide 7 chip artwork: WC.png • TC.png • FH.png • BB.png"

      - name: Reset only previous Day 3 outputs locally
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          output_root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if output_root != expected:
              raise SystemExit(f"Unsafe Day 3 output reset target: {output_root}")

          output_root.mkdir(parents=True, exist_ok=True)
          for name in ("MP4", "MP3", "SLIDE", "DATA"):
              folder = output_root / name
              folder.mkdir(parents=True, exist_ok=True)
              for child in folder.iterdir():
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

          print("Previous Day 3 outputs cleared; four-folder structure preserved")
          PY

      - name: Prepare Colab compatibility layer
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          compat_root = Path(os.environ["RUNNER_TEMP"]) / "colab-compat"
          package = compat_root / "google" / "colab"
          package.mkdir(parents=True, exist_ok=True)
          (compat_root / "google" / "__init__.py").write_text(
              "from pkgutil import extend_path\n"
              "__path__ = extend_path(__path__, __name__)\n",
              encoding="utf-8",
          )
          (package / "__init__.py").write_text(
              "from . import drive, output, userdata\n",
              encoding="utf-8",
          )
          (package / "drive.py").write_text(
              "from pathlib import Path\n\n"
              "def mount(mountpoint, **kwargs):\n"
              "    root = Path(mountpoint)\n"
              "    (root / 'MyDrive').mkdir(parents=True, exist_ok=True)\n"
              "    return None\n\n"
              "def flush_and_unmount():\n"
              "    return None\n",
              encoding="utf-8",
          )
          (package / "userdata.py").write_text(
              "import os\n\n"
              "def get(name):\n"
              "    return os.environ.get(str(name))\n",
              encoding="utf-8",
          )
          (package / "output.py").write_text(
              "def serve_kernel_port_as_iframe(*args, **kwargs):\n"
              "    print('Colab iframe preview skipped in GitHub Actions')\n\n"
              "def serve_kernel_port_as_window(*args, **kwargs):\n"
              "    print('Colab window preview skipped in GitHub Actions')\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PYTHONPATH={compat_root}\n")
          print("Colab compatibility layer: PASS")
          PY


      - name: Execute clean Day 3 runtime
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/day-3.log"
          import hashlib
          import os
          import re
          from pathlib import Path

          from IPython.core.interactiveshell import InteractiveShell

          source_path = Path(os.environ["DAY3_RUNTIME_SOURCE"]).resolve()
          source_bytes = source_path.read_bytes()
          actual_hash = hashlib.sha256(source_bytes).hexdigest()
          expected_hash = os.environ["DAY3_SOURCE_SHA256"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Day 3 runtime source changed: {actual_hash} != {expected_hash}"
              )

          source = source_bytes.decode("utf-8")
          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 Day 3 runtime cell blocks, found {len(cells)}"
              )

          shell = InteractiveShell.instance()
          shell.autoawait = True
          shell.user_ns["__name__"] = "__main__"

          for index, cell in enumerate(cells, 1):
              label = next(
                  (
                      line.removeprefix("# ").strip()
                      for line in cell.splitlines()
                      if re.search(r"\bCELL\s+\d+[A-Za-z]?\b", line)
                  ),
                  "Notebook metadata",
              )
              print(
                  f"::group::Day 3 block {index:02d}/33 — {label}",
                  flush=True,
              )
              try:
                  result = shell.run_cell(cell, store_history=False, silent=False)
                  if not result.success:
                      raise RuntimeError(f"Day 3 block {index} failed: {label}")
              finally:
                  print("::endgroup::", flush=True)

          print("Day 3 runtime executed: PASS")
          PY


      - name: Add shared opening and confirmed music mix
        shell: bash
        run: |
          python -m vortex.day1_media \
            --output-root "${DAY3_OUTPUT_ROOT}" \
            --asset-dir "${DAY1_ASSET_DIR}"


      - name: Build private YouTube Video 3/3 metadata
        shell: bash
        run: |
          python "${DAY3_STUDIO_SCRIPT}" \
            --output-root "${DAY3_OUTPUT_ROOT}"


      - name: Validate isolated Day 3 output and private Video 3/3 package
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected_root = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if root != expected_root:
              raise SystemExit(f"Unsafe Day 3 output root: {root}")

          expected_dirs = {"MP4", "MP3", "SLIDE", "DATA"}
          if not root.is_dir():
              raise SystemExit(f"Output root is missing: {root}")
          actual_dirs = {path.name for path in root.iterdir() if path.is_dir()}
          root_files = [path.name for path in root.iterdir() if path.is_file()]
          if actual_dirs != expected_dirs or root_files:
              raise SystemExit(
                  f"Day 3 output structure invalid: dirs={sorted(actual_dirs)}, "
                  f"root_files={root_files}"
              )
          for name in sorted(expected_dirs):
              folder = root / name
              if not any(path.is_file() for path in folder.rglob("*")):
                  raise SystemExit(f"Expected output directory is empty: {folder}")

          qa_path = root / "DATA" / "final_video_qa.json"
          if not qa_path.is_file():
              raise SystemExit(f"Final QA file is missing: {qa_path}")
          qa = json.loads(qa_path.read_text(encoding="utf-8"))
          if (
              qa.get("passed") is not True
              or qa.get("output_contract", {}).get("passed") is not True
          ):
              raise SystemExit("Final video QA did not pass")


          intro_slide = root / "SLIDE" / "intro_scene_4k.png"
          intro_mp3 = root / "MP3" / "00_intro.mp3"
          intro_mp4 = root / "MP4" / "00_intro.mp4"
          narration_path = root / "DATA" / "other_scenes_narration.json"
          animation_path = root / "DATA" / "other_scenes_animation.json"
          for required_path in (
              intro_slide, intro_mp3, intro_mp4, narration_path, animation_path
          ):
              if not required_path.is_file() or required_path.stat().st_size <= 0:
                  raise SystemExit(f"Day 3_3 Slide 0 output is missing: {required_path}")

          narration = json.loads(narration_path.read_text(encoding="utf-8"))
          intro_script = str((narration.get("00_intro") or {}).get("script") or "")
          intro_script_lower = intro_script.lower()
          agenda_anchors = [
              "expected minutes",
              "ownership pressure",
              "rank gain or loss",
              "differentials",
              "player traps",
              "video 3 of 3",
              "projected goals plus clean sheet odds",
              "final shortlists",
              "transfer decision desk",
              "my gameweek plan",
              "benching dilemma",
              "chip strategy",
              "vortex captain",
          ]
          anchor_positions = []
          for agenda_anchor in agenda_anchors:
              if intro_script_lower.count(agenda_anchor) != 1:
