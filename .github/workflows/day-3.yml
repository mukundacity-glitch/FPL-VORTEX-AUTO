First: {_d3_defcon_reason(DAY3_DEFCON_TARGETS,0)} High team contribution volume plus a strong individual DEFCON probability gives us two independent reasons to care.

Second: {_d3_defcon_reason(DAY3_DEFCON_TARGETS,1)} The rolling team signal says defensive work is consistently available, while the player signal tells us who is most likely to convert that workload into Fantasy points.

Third: {_d3_defcon_reason(DAY3_DEFCON_TARGETS,2)} This is another team where the contribution floor matters. DEFCON gives defenders and midfielders another route to points even when clean-sheet odds are only average.

Fourth: {_d3_defcon_reason(DAY3_DEFCON_TARGETS,3)} They complete the target group. Minutes still come first, because probability without minutes is not a usable Fantasy pick.

The three teams to avoid on DEFCON are {str(DAY3_DEFCON_AVOIDS.iloc[0]['team'])}, {str(DAY3_DEFCON_AVOIDS.iloc[1]['team'])}, and {str(DAY3_DEFCON_AVOIDS.iloc[2]['team'])}.

{_d3_defcon_reason(DAY3_DEFCON_AVOIDS,0)} The rolling contribution volume is the weakest of the group, so DEFCON alone is not a reason to buy.

{_d3_defcon_reason(DAY3_DEFCON_AVOIDS,1)} A single high-workload player cannot fully compensate for a weak team contribution environment when minutes or role are uncertain.

{_d3_defcon_reason(DAY3_DEFCON_AVOIDS,2)} They are the final avoid team. I would only go there when another part of the model, such as clean-sheet probability, attacking threat, or overall expected points, provides the stronger case.

Use DEFCON as an additional floor, not as a replacement for the rest of the model. The best picks are where minutes, team defensive workload, individual DEFCON probability, and the next fixture all agree.

""".strip(),

"04_final_shortlists":
f"""
Now we move from team environments to the final player decision pool.

Step one is expected minutes. Every player already has availability, start probability, and expected minutes from the current VORTEX pipeline. For this shortlist I keep only model-ready players with at least {DAY3_SHORTLIST_MIN_XMINS:.0f} expected minutes. That removes most injury doubts, bench-only options, and players whose rotation risk is too high for a starting-eleven decision.

Step two is expected points. The model builds the total from the existing components: appearance points, goal and assist expectation, clean-sheet and save expectation where relevant, defensive-contribution points, and bonus expectation. Those components are already adjusted by role, expected minutes, availability, and the Gameweek fixture model. That total is the xPts number on the slide.

The leading goalkeeper is {_d3_short_narr("GK",0)}. At goalkeeper I care about secure minutes first, then clean-sheet probability, saves, penalty-save upside, price, and value.

The leading defenders are {_d3_short_narr("DEF",0)}, {_d3_short_narr("DEF",1)}, and {_d3_short_narr("DEF",2)}. For defenders the model combines clean-sheet probability, attacking involvement, DEFCON, minutes, and bonus. A cheaper defender with several routes to points can outrank a more famous player.

The leading midfielders are {_d3_short_narr("MID",0)}, {_d3_short_narr("MID",1)}, and {_d3_short_narr("MID",2)}. Here the attacking share matters more, but the same minutes filter still applies. A good fixture does not help a player who is likely to play only a short cameo.

The leading forwards are {_d3_short_narr("FWD",0)}, {_d3_short_narr("FWD",1)}, and {_d3_short_narr("FWD",2)}. I want the strongest combination of expected minutes, team goal environment, individual goal involvement, bonus, and price efficiency.

Step three is ranking. Inside each position the slide sorts validated players by next-Gameweek xPts, then value, then minutes. That gives us a clean goalkeeper, defender, midfielder, and forward pool instead of one mixed list that ignores formation rules.

Step four is squad optimisation. The decision engine can maximise those expected points under the real FPL constraints: the budget, two goalkeepers, five defenders, five midfielders, three forwards, and no more than three players from one club. From the legal fifteen, the starting eleven is the highest-xPts legal formation, the other four form the bench, and captaincy starts with the highest expected-points player before we consider ceiling and risk.

Step five is chip context. Free Hit or Wildcard can rebuild from the current numbers. Bench Boost raises the importance of every bench player's minutes and fixture. Triple Captain concentrates the decision on the strongest captaincy ceiling. Normal transfers compare the current squad with the legal moves that improve the Gameweek and future horizon.

The shortlist refreshes from the same pipeline after injuries, press conferences, prices, and role information update. No player name on this slide is hard-coded. If the data changes, the decision pool changes with it.

This is the final shortlist: validated minutes, model xPts, price and value, organised by position. From here we move to the transfer decision desk and turn the pool into actual buys, holds, sells, and avoids.

""".strip(),


"05_transfer_decision_desk":
f"""
Welcome to the Transfer Decision Desk. Nine players, three clear actions: buy, hold, sell. The action labels are our editorial calls; every fixture, price, expected-minute estimate, xPts number, availability figure, ownership percentage and transfer signal comes from the current VORTEX pipeline.

First up — the buys.

{_d3_desk_narr("BUY",0)}

A buy has to improve the squad, not just follow the crowd. Minutes and expected points come first.

{_d3_desk_narr("BUY",1)}

Value matters too. A cheaper player can create a second upgrade elsewhere, so price is part of the decision.

{_d3_desk_narr("BUY",2)}

That completes the buy lane. Three names, but one rule: use a transfer only when the expected upgrade is meaningful.

Now the holds.

{_d3_desk_narr("HOLD",0)}

One difficult fixture is not an automatic sell. Strong minutes and ceiling can make patience the better move.

{_d3_desk_narr("HOLD",1)}

For a hold, I compare the player with the replacement pool. If the gain is small, save the transfer.

{_d3_desk_narr("HOLD",2)}

That is the hold lane. We keep these players because the current model still supports them, not because of reputation.

Finally — the sells.

{_d3_desk_narr("SELL",0)}

A sell gets stronger when minutes, availability, fixture quality or value weaken together.

{_d3_desk_narr("SELL",1)}

One blank is never enough by itself. The replacement has to offer a better expected-points use of the squad slot.

{_d3_desk_narr("SELL",2)}

That completes the sell lane. We are moving on because the opportunity cost of holding is now higher.

That is the desk. Three buys, three holds, three sells. Use the information, trust the model, and compare every move with what it costs. Refresh after the final press conferences because minutes and availability can change. Your move. Make it count.

""".strip(),

