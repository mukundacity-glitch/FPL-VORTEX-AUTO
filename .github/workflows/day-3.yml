          _day3_plan5a_block = r'''
# ============================================================
# DAY 3_3 — SLIDE 5A • MY PLAN • ROLL
# Exact GW Review visual/player-card/timeline copy.
# Original GW Review HTML/PNG/narration/MP4 remain untouched.
# ============================================================

if globals().get("SLIDE_SELECTION", {}).get("05a_my_plan_roll", False):
