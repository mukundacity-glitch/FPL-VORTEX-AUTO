    if raw_opp in (None,"","—"):
        return "an opponent still to be confirmed"
    return str(vx_narration_team(raw_opp))


def vx_review_short_name(player_id):
    try:
        spoken=str(vx_narration_player(int(player_id)) or "").strip()
        if spoken:
            return spoken
    except Exception:
        pass
    element=review_elements.get(int(player_id),{})
