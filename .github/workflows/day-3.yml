name: Day 3_3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-vortex-day-3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_FILE: 1_final_day1.py
  DAY3_OUTPUT_ROOT: /content/drive/MyDrive/FPL_VORTEX/Day_3_3
  DAY3_DRIVE_PATH: FPL_VORTEX/Day_3_3
  DAY1_ASSET_FOLDER_ID: 1h3Loznr5RnsMyh-kUd-zMxEgOf98uFSt
  DAY1_ASSET_DIR: /content/drive/MyDrive/FPL_VORTEX/Assets
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  run-day-3:
    name: Run isolated Day 3 — exact Day 1 video clone
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Prepare isolated Day 3 runtime without changing Day 1 or Day 2
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            "${SOURCE_FILE}" \
            .github/workflows/day-1.yml \
            .github/workflows/day-2.yml \
            vortex/day1_media.py \
            vortex/youtube_studio_package.py \
            vortex/youtube_private_upload.py
          python - <<'PY'
          import ast
          import hashlib
          import os
          import re
          from pathlib import Path

          output_root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected_root = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if output_root != expected_root:
              raise SystemExit(
                  f"Unsafe Day 3 output root: {output_root} != {expected_root}"
              )
          folder_name = output_root.name

          runtime_dir = Path(os.environ["RUNNER_TEMP"]) / "day3-runtime"
          runtime_dir.mkdir(parents=True, exist_ok=True)

          def replace_exact(text, old, new, expected_count, label):
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"{label}: expected {expected_count} occurrence(s) of "
                      f"{old!r}, found {actual_count}"
                  )
              return text.replace(old, new)

          source_path = Path(os.environ["SOURCE_FILE"]).resolve()
          source_text = source_path.read_text(encoding="utf-8")
          runtime_source_text = replace_exact(
              source_text,
              "FIRST VIDEO",
              folder_name,
              9,
              "Day 1 output-path isolation",
          )
          runtime_source = runtime_dir / "day1_video_clone_for_video_3_of_3.py"
          runtime_source.write_text(runtime_source_text, encoding="utf-8")

          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(runtime_source_text) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 cloned Day 1 cell blocks, found {len(cells)}"
              )
          for index, cell in enumerate(cells, 1):
              compile(
                  cell,
                  f"{runtime_source.name}::cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  dont_inherit=True,
              )

          studio_source = Path("vortex/youtube_studio_package.py")
          studio_text = studio_source.read_text(encoding="utf-8")
          studio_text = replace_exact(
              studio_text, "FIRST VIDEO", folder_name, 1, "Studio output path"
          )
          studio_text = replace_exact(
              studio_text,
              "YT_VIDEO_PART = 1",
              "YT_VIDEO_PART = 3",
              1,
              "Studio video part",
          )
          studio_text = replace_exact(
              studio_text, "1_of_3", "3_of_3", 1, "Studio package filename"
          )
          studio_text = replace_exact(
              studio_text, "1/3", "3/3", 3, "Studio visible series labels"
          )
          studio_script = runtime_dir / "youtube_studio_video_3_of_3.py"
          compile(studio_text, str(studio_script), "exec")
          studio_script.write_text(studio_text, encoding="utf-8")

          upload_source = Path("vortex/youtube_private_upload.py")
          upload_text = upload_source.read_text(encoding="utf-8")
          upload_text = replace_exact(
              upload_text, "FIRST VIDEO", folder_name, 1, "Uploader output path"
          )
          upload_text = replace_exact(
              upload_text, "1_of_3", "3_of_3", 1, "Uploader package filename"
          )
          upload_text = replace_exact(
              upload_text, "1-of-3", "3-of-3", 1, "Uploader unique marker"
          )
          upload_text = replace_exact(
              upload_text,
              '"part": 1',
              '"part": 3',
              1,
              "Uploader series validation",
          )
          upload_text = replace_exact(
              upload_text, "1/3", "3/3", 2, "Uploader visible series labels"
          )
          upload_script = runtime_dir / "youtube_private_video_3_of_3.py"
          compile(upload_text, str(upload_script), "exec")
          upload_script.write_text(upload_text, encoding="utf-8")

          runtime_hash = hashlib.sha256(runtime_source.read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"DAY3_RUNTIME_SOURCE={runtime_source}\n")
              env_file.write(f"DAY3_SOURCE_SHA256={runtime_hash}\n")
              env_file.write(f"DAY3_STUDIO_SCRIPT={studio_script}\n")
              env_file.write(f"DAY3_UPLOAD_SCRIPT={upload_script}\n")

          print("Day 1 repository source and both existing workflows: untouched")
          print("Isolated Day 3 runtime clone and Video 3/3 tools: PASS")
          PY

      - name: Verify private YouTube upload configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          client_id = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_ID")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_ID")
              or ""
          ).strip()
          client_secret = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_SECRET")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET")
              or ""
          ).strip()
          refresh_token = (os.environ.get("YOUTUBE_OAUTH_REFRESH_TOKEN") or "").strip()
          channel_id = (os.environ.get("YOUTUBE_CHANNEL_ID") or "").strip()

          missing = []
          if not client_id:
              missing.append("YOUTUBE_OAUTH_CLIENT_ID or GOOGLE_OAUTH_CLIENT_ID")
          if not client_secret:
              missing.append(
                  "YOUTUBE_OAUTH_CLIENT_SECRET or GOOGLE_OAUTH_CLIENT_SECRET"
              )
          if not refresh_token:
              missing.append("YOUTUBE_OAUTH_REFRESH_TOKEN")
          if not channel_id:
              missing.append("YOUTUBE_CHANNEL_ID")
          if missing:
              raise SystemExit(
                  "Missing required private YouTube upload secret(s): "
                  + ", ".join(missing)
              )
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("YouTube OAuth client ID has an invalid format")
          if not re.fullmatch(r"UC[A-Za-z0-9_-]{22}", channel_id):
              raise SystemExit("YOUTUBE_CHANNEL_ID has an invalid format")
          print("Private YouTube upload configuration: PASS")
          print("Automatic Public/Unlisted/scheduled publishing: DISABLED")
          PY

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<3" \
            "pyarrow>=17,<20" \
            "Pillow>=10.4,<12" \
            "scipy>=1.14,<2" \
            "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" \
            "playwright>=1.46,<2" \
            "edge-tts>=6.1,<8" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"

      - name: Install Chromium runtime
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Configure private Google Drive connection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          secret_names = (
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
          )
          secrets = {
              name: (os.environ.get(name) or "").strip()
              for name in secret_names
          }
          missing = [name for name, value in secrets.items() if not value]
          if missing:
              raise SystemExit(
                  "Missing required GitHub secret(s): " + ", ".join(missing)
              )
          if not secrets["GOOGLE_OAUTH_CLIENT_ID"].endswith(
              ".apps.googleusercontent.com"
          ):
              raise SystemExit("GOOGLE_OAUTH_CLIENT_ID has an invalid format")

          request_data = urllib.parse.urlencode(
              {
                  "client_id": secrets["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": secrets["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=request_data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              refreshed = json.loads(response.read().decode("utf-8"))

          expires_in = int(refreshed.get("expires_in", 3600))
          token = {
              "access_token": refreshed["access_token"],
              "token_type": refreshed.get("token_type", "Bearer"),
              "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
              "expiry": (
                  datetime.now(timezone.utc)
                  + timedelta(seconds=max(60, expires_in - 60))
              ).isoformat().replace("+00:00", "Z"),
          }

          config_dir = Path(os.environ["RUNNER_TEMP"]) / "rclone"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_path = config_dir / "rclone.conf"
          token_json = json.dumps(token, separators=(",", ":"))
          config_path.write_text(
              "\n".join(
                  (
                      "[vortex-drive]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      "",
                      "[day1-assets]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      f"root_folder_id = {os.environ['DAY1_ASSET_FOLDER_ID']}",
                      "",
                  )
              ),
              encoding="utf-8",
          )
          config_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"RCLONE_CONFIG={config_path}\n")
          print("Google Drive OAuth connection: PASS")
          PY

      - name: Restore required Google Drive state
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content

          restore_optional() {
            local remote_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if rclone lsf "vortex-drive:${remote_path}" --max-depth 1 >/dev/null 2>&1; then
              mkdir -p "${local_path}"
              rclone copy "vortex-drive:${remote_path}" "${local_path}" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Restored My Drive/${remote_path}"
            else
              echo "Optional Drive path not present: My Drive/${remote_path}"
            fi
          }

          required_path="FPL_VORTEX_DATA/00_SOURCE_ARCHIVE/FPL_CORE/data"
          if ! rclone lsf "vortex-drive:${required_path}" --max-depth 1 >/dev/null; then
            echo "Required Drive path is missing: My Drive/${required_path}" >&2
            exit 1
          fi

          restore_optional "${DAY3_DRIVE_PATH}"
          restore_optional "FPL_VORTEX/MODEL_INPUTS"
          restore_optional "FPL_VORTEX/DECISION_ENGINE"
          restore_optional "FPL_VORTEX/RAW_DATA"
          restore_optional "FPL_VORTEX/MODEL_HISTORY"
          restore_optional "FPL_VORTEX/elements"
          restore_optional "elements"
          restore_optional "${required_path}"
          restore_optional "FPL_VORTEX_DATA/03_ELITE_MANAGERS"
          restore_optional "FPL_VORTEX_DATA/04_MASTER"
          restore_optional "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          restore_optional "FPL_VORTEX_DATA/06_SNAPSHOTS"
          restore_optional "FPL_VORTEX_DATA/07_LOGS"

          mkdir -p "${DAY1_ASSET_DIR}"
          rclone copy "day1-assets:" "${DAY1_ASSET_DIR}" \
            --filter "+ /opening.mp4" \
            --filter "+ /Background_music.mp3" \
            --filter "+ /outro.mp3" \
            --filter "- **" \
            --transfers 3 --checkers 6
          for asset_name in opening.mp4 Background_music.mp3 outro.mp3; do
            if [[ ! -s "${DAY1_ASSET_DIR}/${asset_name}" ]]; then
              echo "Required Day 1 asset is missing: ${asset_name}" >&2
              exit 1
            fi
          done
          echo "Restored opening and audio assets by confirmed Drive folder ID"


      - name: Reset only previous Day 3 outputs locally
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          output_root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if output_root != expected:
              raise SystemExit(f"Unsafe Day 3 output reset target: {output_root}")

          output_root.mkdir(parents=True, exist_ok=True)
          for name in ("MP4", "MP3", "SLIDE", "DATA"):
              folder = output_root / name
              folder.mkdir(parents=True, exist_ok=True)
              for child in folder.iterdir():
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

          print("Previous Day 3 outputs cleared; four-folder structure preserved")
          PY

      - name: Prepare Colab compatibility layer
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          compat_root = Path(os.environ["RUNNER_TEMP"]) / "colab-compat"
          package = compat_root / "google" / "colab"
          package.mkdir(parents=True, exist_ok=True)
          (compat_root / "google" / "__init__.py").write_text(
              "from pkgutil import extend_path\n"
              "__path__ = extend_path(__path__, __name__)\n",
              encoding="utf-8",
          )
          (package / "__init__.py").write_text(
              "from . import drive, output, userdata\n",
              encoding="utf-8",
          )
          (package / "drive.py").write_text(
              "from pathlib import Path\n\n"
              "def mount(mountpoint, **kwargs):\n"
              "    root = Path(mountpoint)\n"
              "    (root / 'MyDrive').mkdir(parents=True, exist_ok=True)\n"
              "    return None\n\n"
              "def flush_and_unmount():\n"
              "    return None\n",
              encoding="utf-8",
          )
          (package / "userdata.py").write_text(
              "import os\n\n"
              "def get(name):\n"
              "    return os.environ.get(str(name))\n",
              encoding="utf-8",
          )
          (package / "output.py").write_text(
              "def serve_kernel_port_as_iframe(*args, **kwargs):\n"
              "    print('Colab iframe preview skipped in GitHub Actions')\n\n"
              "def serve_kernel_port_as_window(*args, **kwargs):\n"
              "    print('Colab window preview skipped in GitHub Actions')\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PYTHONPATH={compat_root}\n")
          print("Colab compatibility layer: PASS")
          PY


      - name: Execute the exact Day 1 video clone as Day 3
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/day-3.log"
          import hashlib
          import os
          import re
          from pathlib import Path

          from IPython.core.interactiveshell import InteractiveShell

          source_path = Path(os.environ["DAY3_RUNTIME_SOURCE"]).resolve()
          source_bytes = source_path.read_bytes()
          actual_hash = hashlib.sha256(source_bytes).hexdigest()
          expected_hash = os.environ["DAY3_SOURCE_SHA256"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Day 3 runtime source changed: {actual_hash} != {expected_hash}"
              )

          source = source_bytes.decode("utf-8")
          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 cloned Day 1 cell blocks, found {len(cells)}"
              )

          shell = InteractiveShell.instance()
          shell.autoawait = True
          shell.user_ns["__name__"] = "__main__"

          for index, cell in enumerate(cells, 1):
              label = next(
                  (
                      line.removeprefix("# ").strip()
                      for line in cell.splitlines()
                      if re.search(r"\bCELL\s+\d+[A-Za-z]?\b", line)
                  ),
                  "Notebook metadata",
              )
              print(
                  f"::group::Day 3 block {index:02d}/33 — {label}",
                  flush=True,
              )
              try:
                  result = shell.run_cell(cell, store_history=False, silent=False)
                  if not result.success:
                      raise RuntimeError(f"Day 3 block {index} failed: {label}")
              finally:
                  print("::endgroup::", flush=True)

          print("Exact Day 1 video clone executed as Day 3: PASS")
          PY


      - name: Add the same Day 1 opening and confirmed music mix
        shell: bash
        run: |
          python -m vortex.day1_media \
            --output-root "${DAY3_OUTPUT_ROOT}" \
            --asset-dir "${DAY1_ASSET_DIR}"


      - name: Build private YouTube Video 3/3 metadata
        shell: bash
        run: |
          python "${DAY3_STUDIO_SCRIPT}" \
            --output-root "${DAY3_OUTPUT_ROOT}"


      - name: Validate isolated Day 3 output and private Video 3/3 package
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected_root = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if root != expected_root:
              raise SystemExit(f"Unsafe Day 3 output root: {root}")

          expected_dirs = {"MP4", "MP3", "SLIDE", "DATA"}
          if not root.is_dir():
              raise SystemExit(f"Output root is missing: {root}")
          actual_dirs = {path.name for path in root.iterdir() if path.is_dir()}
          root_files = [path.name for path in root.iterdir() if path.is_file()]
          if actual_dirs != expected_dirs or root_files:
              raise SystemExit(
                  f"Day 3 output structure invalid: dirs={sorted(actual_dirs)}, "
                  f"root_files={root_files}"
              )
          for name in sorted(expected_dirs):
              folder = root / name
              if not any(path.is_file() for path in folder.rglob("*")):
                  raise SystemExit(f"Expected output directory is empty: {folder}")

          qa_path = root / "DATA" / "final_video_qa.json"
          if not qa_path.is_file():
              raise SystemExit(f"Final QA file is missing: {qa_path}")
          qa = json.loads(qa_path.read_text(encoding="utf-8"))
          if (
              qa.get("passed") is not True
              or qa.get("output_contract", {}).get("passed") is not True
          ):
              raise SystemExit("Final video QA did not pass")

          final_mp4s = [
              path for path in (root / "MP4").glob("*COMBINED*.mp4")
              if path.is_file()
          ]
          final_mp3s = [
              path for path in (root / "MP3").glob("*COMBINED*.mp3")
              if path.is_file()
          ]
          if len(final_mp4s) != 1 or len(final_mp3s) != 1:
              raise SystemExit(
                  "Expected exactly one combined final MP4 and MP3; "
                  f"found MP4={len(final_mp4s)}, MP3={len(final_mp3s)}"
              )

          package_path = root / "DATA" / "youtube_video_3_of_3_package.json"
          if not package_path.is_file():
              raise SystemExit(f"Video 3/3 package is missing: {package_path}")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if (
              package.get("manual_upload_only") is not False
              or package.get("youtube_api_upload_enabled") is not True
              or package.get("automatic_publication_enabled") is not False
          ):
              raise SystemExit(
                  "YouTube Video 3/3 package is not enabled for private API upload"
              )

          expected_policy = {
              "privacy_status": "private",
              "notify_subscribers": False,
              "automatic_publish": False,
              "automatic_schedule": False,
              "manual_publication_required": True,
          }
          if package.get("upload_policy") != expected_policy:
              raise SystemExit("YouTube private-upload safety policy is invalid")

          metadata = package.get("metadata") or {}
          if metadata.get("series") != {"part": 3, "total": 3}:
              raise SystemExit("YouTube package is not marked as Video 3/3")
          title = str(metadata.get("title") or "")
          description = str(metadata.get("description") or "")
          if "(3/3)" not in title or "VIDEO 3/3" not in description.upper():
              raise SystemExit(
                  "YouTube title/description is not visibly marked as Video 3/3"
              )
          if metadata.get("recommended_visibility") != "Private":
              raise SystemExit("YouTube visibility is not Private")

          preview_gw = int(metadata.get("preview_gw") or 0)
          review_gw = int(metadata.get("review_gw") or 0)
          if not 1 <= preview_gw <= 38 or not 1 <= review_gw <= 38:
              raise SystemExit(f"Invalid dynamic GWs: {preview_gw}/{review_gw}")
          if f"FPL GW{preview_gw}" not in title:
              raise SystemExit("YouTube title has the wrong Gameweek")

          print(f"Day 3 output folder: {root}")
          print("Four output folders and private YouTube Video 3/3 package: PASS")
          PY


      - name: Save only Day 3 outputs to the separate Drive folder
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${DAY3_OUTPUT_ROOT}" ]]; then
            echo "Day 3 output folder is missing: ${DAY3_OUTPUT_ROOT}" >&2
            exit 1
          fi
          rclone sync \
            "${DAY3_OUTPUT_ROOT}" \
            "vortex-drive:${DAY3_DRIVE_PATH}" \
            --create-empty-src-dirs --transfers 4 --checkers 8
          echo "Saved only Day 3 outputs to My Drive/${DAY3_DRIVE_PATH}"


      - name: Upload Video 3/3 privately to YouTube
        shell: bash
        run: |
          python "${DAY3_UPLOAD_SCRIPT}" \
            --output-root "${DAY3_OUTPUT_ROOT}"
          echo "Video 3/3 upload completed and verified as Private"


      - name: Save Video 3/3 private-upload receipt to its Drive folder
        if: always()
        shell: bash
        run: |
          receipt="${DAY3_OUTPUT_ROOT}/DATA/youtube_private_upload.json"
          if [[ -s "${receipt}" ]]; then
            rclone copyto \
              "${receipt}" \
              "vortex-drive:${DAY3_DRIVE_PATH}/DATA/youtube_private_upload.json"
            echo "Saved Video 3/3 private-upload receipt in the Day 3 folder"
          else
            echo "No YouTube private-upload receipt was created"
          fi

      - name: Upload Day 3 output artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-3-output-${{ github.run_number }}
          path: ${{ env.DAY3_OUTPUT_ROOT }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload Day 3 log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-3-log-${{ github.run_number }}
          path: ${{ runner.temp }}/day-3.log
          if-no-files-found: warn
          retention-days: 14
