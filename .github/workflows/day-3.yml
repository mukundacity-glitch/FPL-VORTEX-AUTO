)

def _d3_desk_norm(value):
    import unicodedata
    value = unicodedata.normalize("NFKD", str(value or ""))
    value = "".join(ch for ch in value if not unicodedata.combining(ch))
    return re.sub(r"[^a-z0-9]+", " ", value.lower().replace("’", "'")).strip()

def _d3_desk_num(value, default=0.0):
    value = pd.to_numeric(value, errors="coerce")
    return float(value) if pd.notna(value) else float(default)

def _d3_desk_find_player(requested_name):
    target = _d3_desk_norm(requested_name)
    matches = []
    for _, row in players.iterrows():
        first = str(row.get("first_name", "") or "")
        second = str(row.get("second_name", "") or "")
        web = str(row.get("web_name", "") or "")
        aliases = {
            _d3_desk_norm(f"{first} {second}".strip()),
            _d3_desk_norm(web),
            _d3_desk_norm(f"{first} {web}".strip()),
        }
        if target in aliases:
            matches.append(row)
    if len(matches) != 1:
        raise RuntimeError(
            f"Day 3_3 Transfer Desk expected one FPL match for {requested_name!r}, "
            f"found {len(matches)}"
        )
    return matches[0]

_d3_desk_model = _d3_short_agg.drop_duplicates("player_id", keep="last").copy()
_d3_desk_model["player_id"] = pd.to_numeric(_d3_desk_model["player_id"], errors="coerce")
_d3_desk_model = _d3_desk_model.dropna(subset=["player_id"]).copy()
_d3_desk_model["player_id"] = _d3_desk_model["player_id"].astype(int)
_d3_desk_model = _d3_desk_model.set_index("player_id", drop=False)

_d3_desk_rank = (
    _d3_short_agg.sort_values(
        ["xpts", "xmins", "player_name"],
        ascending=[False, False, True],
        na_position="last",
    )
    .reset_index(drop=True)
)
_d3_desk_rank_map = {
    int(pid): int(rank)
    for rank, pid in enumerate(_d3_desk_rank["player_id"].tolist(), 1)
}

def _d3_desk_flow(value):
    value = int(round(float(value)))
    if value > 0:
        return f"+{value:,}"
    if value < 0:
        return f"-{abs(value):,}"
    return "0"

DAY3_TRANSFER_DESK = {"BUY": [], "HOLD": [], "SELL": []}
DAY3_TRANSFER_DESK_ORDER = []

for _desk_i, (_action, _requested_name) in enumerate(_D3_DESK_EDITORIAL):
    _p = _d3_desk_find_player(_requested_name)
    _pid = int(_p["id"])
    if _pid not in _d3_desk_model.index:
        raise RuntimeError(
            f"Day 3_3 Transfer Desk has no READY Phase-10 row for {_requested_name}"
        )
    _m = _d3_desk_model.loc[_pid]
    _team_id = int(_p["team"])
    _meta = team_meta_by_id.get(_team_id, {})
    _proj = _d3_proj_by_id.loc[_team_id] if _team_id in _d3_proj_by_id.index else {}
    _opponent = str(
        _proj.get("gw1_opponent", "TBD") if hasattr(_proj, "get") else "TBD"
    ).upper()
    _tin = _d3_desk_num(_p.get("transfers_in_event"))
    _tout = _d3_desk_num(_p.get("transfers_out_event"))
    _record = {
        "index": int(_desk_i),
        "action": str(_action),
        "name": str(_requested_name),
        "player_id": _pid,
        "team_id": _team_id,
        "team": str(_meta.get("short", _p.get("team_short", "")) or "").upper(),
        "position": str(_p.get("position", "") or "").upper(),
        "price": _d3_desk_num(_p.get("price")),
        "photo": str(resolve_player_photo(_p) or ""),
        "badge": str(_meta.get("badge", "") or ""),
        "opponent": _opponent,
        "xpts": _d3_desk_num(_m.get("xpts")),
        "xmins": _d3_desk_num(_m.get("xmins")),
        "availability": 100.0 * _d3_desk_num(_m.get("availability_probability")),
        "start_probability": 100.0 * _d3_desk_num(_m.get("start_probability")),
        "ownership": _d3_desk_num(_p.get("selected_by_percent")),
        "transfers_in": _tin,
