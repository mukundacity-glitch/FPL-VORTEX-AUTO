def _d3_spark(values):
    vals = [float(v) for v in values if pd.notna(v)]
    if not vals:
        return '<svg class="d3Spark" viewBox="0 0 120 30"></svg>'
    vals = vals[-10:]
    lo, hi = min(vals), max(vals)
    span = max(hi - lo, 1e-9)
    pts = []
    for i, v in enumerate(vals):
        x = 4 + (112 * i / max(1, len(vals) - 1))
        y = 26 - (22 * (v - lo) / span)
        pts.append(f"{x:.1f},{y:.1f}")
    return (
        '<svg class="d3Spark" viewBox="0 0 120 30">'
        f'<polyline points="{" ".join(pts)}" fill="none" stroke="currentColor" '
        'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    )

_d3_def_rows = []
for _, _team_row in _d3_proj.sort_values("team_short").iterrows():
    _tid = int(_team_row["team_id"])
    _hist = _d3_team_match.loc[_d3_team_match["team_id"].eq(_tid)].tail(38).copy()
    if _hist.empty:
        _last_hits = _last_dc = _avg_hits = _avg_dc = 0.0
        _trend = []
    else:
        _last = _hist.iloc[-1]
        _last_hits = float(_last["hits"])
        _last_dc = float(_last["dc"])
        _avg_hits = float(_hist["hits"].mean())
        _avg_dc = float(_hist["dc"].mean())
        _trend = _hist["dc"].tail(10).tolist()

    _opp_ids = _team_row.get("gw1_opponent_ids", [])
    _opp_id = int(_opp_ids[0]) if isinstance(_opp_ids, list) and _opp_ids else None
    _d3_def_rows.append({
        "team_id": _tid,
        "team": str(_team_row["team"]),
        "team_short": str(_team_row["team_short"]),
        "badge": str(_team_row.get("badge","") or ""),
        "last_hits": _last_hits,
        "last_dc": _last_dc,
        "avg_hits": _avg_hits,
        "avg_dc": _avg_dc,
        "trend": _trend,
        "opp_id": _opp_id,
        "next_fixture": str(_team_row.get("gw1_opponent","TBD")),
        "top_player": _d3_def_player_by_team.get(_tid,{}).get("name","NO READY PLAYER"),
        "top_player_prob": float(_d3_def_player_by_team.get(_tid,{}).get("prob",0.0)),
    })

