        _classes.append("d3BenchTop")
    if _is_bottom5:
        _classes.append("d3BenchAvoid")
    _rank_label = (
        f"#{int(row.get('overall_rank', index + 1)):02d}"
        if bucket != "avoid"
        else f"SIT {index + 1}"
    )
    return (
        f'<article class="{" ".join(_classes)}">'
        f'<span class="d3BenchRank">{_rank_label}</span>'
        f'<div class="d3BenchPhotoBox">{_d3_bench_photo(_pid, "d3BenchPhoto")}'
        f'{_d3_bench_badge(row["team_id"], "d3BenchBadge")}</div>'
