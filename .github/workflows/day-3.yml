          <div class="agendaList day2List">
          <div class="agenda-card v2-1"><div class="agendaNum">01</div><div><div class="agenda-title">EXPECTED MINUTES</div><div class="agenda-sub">STARTING SECURITY • 4-PLAYER COMPARISON</div></div></div>
          <div class="agenda-card v2-2"><div class="agendaNum">02</div><div><div class="agenda-title">OWNERSHIP PRESSURE</div><div class="agenda-sub">TOP 1K EO WHEN AVAILABLE • LIVE OWNERSHIP FALLBACK</div></div></div>
