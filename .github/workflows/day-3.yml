            if isinstance(globals().get("GW_REVIEW"), dict)
            else None
        )
        if isinstance(_d3_boot, dict):
            _d3_boot_elements = {
                int(row["id"]): row for row in _d3_boot.get("elements", [])
            }
            _d3_boot_teams = {
                int(row["id"]): row for row in _d3_boot.get("teams", [])
            }
    if not _d3_boot_elements or not _d3_boot_teams:
        raise RuntimeError(
            "MY PLAN 5A requires the same official bootstrap metadata used by GW Review"
        )

    _d3_next_fixtures = fixtures_raw.loc[
        pd.to_numeric(fixtures_raw["event"], errors="coerce").eq(int(NEXT_GW))
    ].copy()

    def _d3_plan_fixture(team_id):
        team_id = int(team_id)
        rows = _d3_next_fixtures.loc[
            _d3_next_fixtures["team_h"].eq(team_id)
            | _d3_next_fixtures["team_a"].eq(team_id)
        ]
        if rows.empty:
            return {"opp":"BLANK", "ha":"", "score":"", "state":"PENDING"}
        row = rows.iloc[0]
        home = int(row["team_h"]) == team_id
        opp_id = int(row["team_a"] if home else row["team_h"])
        opp = str((_d3_boot_teams.get(opp_id) or {}).get("short_name", "TBD"))
        return {
            "opp": opp,
            "ha": "H" if home else "A",
            "score": "",
            "state": "PENDING",
        }

    def _d3_plan_number(value, default=0.0):
        value = pd.to_numeric(value, errors="coerce")
        return float(value) if pd.notna(value) else float(default)

    def _d3_plan_player(pid, *, bench, bench_order=0):
        pid = int(pid)
        if pid not in _d3_pool_by_id.index:
            raise RuntimeError(f"MY PLAN 5A player {pid} is missing Phase-11 data")
        if pid not in _d3_boot_elements:
            raise RuntimeError(f"MY PLAN 5A player {pid} is missing official FPL metadata")

        row = _d3_pool_by_id.loc[pid]
        e = _d3_boot_elements[pid]
        team_id = int(e["team"])
        team = _d3_boot_teams.get(team_id) or {}
        pos = str(row.get("position") or "").upper().replace("GKP", "GK")
        xpts = _d3_plan_number(row.get("final_gameweek_xpts"))
        xmins = _d3_plan_number(row.get("current_gw_expected_minutes"))
        if xmins <= 0:
            xmins = _d3_plan_number(row.get("expected_minutes"), 0.0)
        next3 = _d3_plan_number(row.get("next_3_xpts"))
        next5 = _d3_plan_number(row.get("next_5_xpts"))
        fixture = _d3_plan_fixture(team_id)
        team_short = str(team.get("short_name", row.get("team_name", "TEAM"))).upper()
        team_name = str(team.get("name", row.get("team_name", team_short)))
        team_code = int(team.get("code") or e.get("team_code") or 0)
        price = _d3_plan_number(e.get("now_cost")) / 10.0
        ownership = _d3_plan_number(e.get("selected_by_percent"))
        captain = pid == _d3_cap_id
        vice = pid == _d3_vice_id
        multiplier = 0 if bench else (2 if captain else 1)
        photo = str(resolve_player_photo(e) or "")
        badge = str((team_meta_by_short.get(team_short, {}) or {}).get("badge", "") or "")

        first = str(e.get("first_name", "") or "")
        second = str(e.get("second_name", "") or "")
        web_name = str(e.get("web_name", row.get("player_name", f"PLAYER {pid}")) or "")
        full_name = f"{first} {second}".strip() or web_name
        position_label = _POSITION_LABEL.get(pos, pos or "PLAYER")

        display_stats = [
            {"icon":"spark", "label":"PROJECTED xPTS", "value":f"{xpts:.1f}"},
            {"icon":"target", "label":"EXPECTED MINUTES", "value":f"{xmins:.0f}"},
            {"icon":"ball", "label":"NEXT 3 xPTS", "value":f"{next3:.1f}"},
            {"icon":"boot", "label":"NEXT 5 xPTS", "value":f"{next5:.1f}"},
            {"icon":"target", "label":"OWNERSHIP", "value":f"{ownership:.1f}%"},
        ]
        duty = "BENCH" if bench else "STARTER"
        leadership = "CAPTAIN" if captain else "VICE CAPTAIN" if vice else "MY PLAN"
        card = {
            "id": pid,
            "name": web_name,
            "full_name": full_name,
            "first_name": first or full_name.split(" ")[0],
            "surname": second or " ".join(full_name.split(" ")[1:]) or web_name,
            "position": pos,
            "position_label": position_label,
            "club": team_name,
            "club_short": team_short,
            "club_badge": badge,
            "player_image": photo,
            "asset_label": f"GW {int(NEXT_GW)} MY PLAN",
            "price": f"£{price:.1f}m",
            "total_points": int(e.get("total_points", 0) or 0),
            "form": str(e.get("form", "—")),
            "ownership": f"{ownership:.1f}%",
            "avg_minutes_per_start": f"{xmins:.0f}",
            "captain": bool(captain),
            "vice": bool(vice),
            "display_stats": display_stats,
            "stats_heading": f"GW {int(NEXT_GW)} • {position_label} MODEL",
            "fixtures": _pc_fixture_pack(team_short, pos, pid),
            "verdict_main": "MY PLAN • START" if not bench else "MY PLAN • BENCH",
            "verdict_sub": (
                f"{xpts:.1f} xPTS  |  {xmins:.0f} xMINS  |  "
                f"{fixture['opp']} {fixture['ha']}"
            ),
            "tags": [
                position_label,
                duty,
                leadership,
                f"{xpts:.1f} xPTS",
                f"{xmins:.0f} xMINS",
            ],
            "season_label": "MY PLAN",
        }

        type_map = {"GK":1, "DEF":2, "MID":3, "FWD":4}
        return {
            "id": pid,
            "name": web_name,
            "first_name": first,
            "second_name": second,
            "full_name": full_name,
            "team": team_short,
            "team_name": team_name,
            "team_code": team_code,
            "type": int(type_map.get(pos, 3)),
            "pos": pos,
            "code": int(e.get("code") or 0),
            "price": price,
            "ownership": ownership,
            "photo": photo,
            "fixture": fixture,
            "fixture_label": f"{fixture['opp']} ({fixture['ha']})".strip(),
            "bench": bool(bench),
            "bench_order": int(bench_order),
            "captain": bool(captain),
            "vice": bool(vice),
            "multiplier": int(multiplier),
            "points": round(xpts, 1),
            "appliedPoints": round(
                xpts * (2 if captain and not bench else 1), 1
            ),
            "xpts": xpts,
            "xmins": xmins,
            "next3_xpts": next3,
            "next5_xpts": next5,
            "card": card,
        }

    _d3_plan_starters = [
        _d3_plan_player(pid, bench=False)
        for pid in _d3_xi_ids
    ]
    _d3_plan_bench = [
        _d3_plan_player(pid, bench=True, bench_order=index + 1)
        for index, pid in enumerate(_d3_bench_ids)
    ]

    _d3_pos_order = {"GK":0, "DEF":1, "MID":2, "FWD":3}
    _d3_plan_starters = sorted(
        _d3_plan_starters,
        key=lambda p: (_d3_pos_order.get(p["pos"], 9), -float(p["xpts"]), p["name"]),
    )

    _d3_groups = {
        pos:[p for p in _d3_plan_starters if p["pos"] == pos]
        for pos in ("GK","DEF","MID","FWD")
    }
    _d3_ys = {"GK":13.5, "DEF":35.5, "MID":58.2, "FWD":82.0}
    for _pos, _arr in _d3_groups.items():
        _span = 0 if _pos == "GK" else 47 if _pos == "FWD" else 56
        for _i, _p in enumerate(_arr):
            _p["pitch_x"] = (
                50 if len(_arr) == 1
                else 50 - _span / 2 + _span * (_i / (len(_arr) - 1))
            )
            _p["pitch_y"] = _d3_ys[_pos]

    _d3_cap = next(p for p in _d3_plan_starters if p["id"] == _d3_cap_id)
    _d3_vice = next(p for p in _d3_plan_starters if p["id"] == _d3_vice_id)
    _d3_xi_xpts = sum(float(p["xpts"]) for p in _d3_plan_starters)
    _d3_projected_score = _d3_xi_xpts + float(_d3_cap["xpts"])
    _d3_bench_xpts = sum(float(p["xpts"]) for p in _d3_plan_bench)
    _d3_formation = "-".join(
        str(len(_d3_groups[pos])) for pos in ("DEF","MID","FWD")
    )
    _d3_ft = globals().get("PHASE11_FREE_TRANSFERS")
    _d3_ft_text = "—" if _d3_ft is None else str(int(_d3_ft))
    _d3_bank = _d3_plan_number(globals().get("PHASE11_BANK"), 0.0)
    _d3_state = str(globals().get("PHASE11_SQUAD_STATE_STATUS", "UNKNOWN"))

    def _d3_plan_spoken_fixture(p):
        fx = p.get("fixture") or {}
        opp = str(fx.get("opp") or "the next opponent")
        side = str(fx.get("ha") or "")
        return (
            f"{opp} at home" if side == "H"
            else f"{opp} away" if side == "A"
            else opp
        )

    def _d3_plan_player_text(p, bench=False, first_goalkeeper=False):
        name = vx_narration_player(int(p["id"]))
        if first_goalkeeper:
            return (
                f"{name}. I start him in goal. VORTEX projects {p['xpts']:.1f} points "
                f"from {p['xmins']:.0f} expected minutes against {_d3_plan_spoken_fixture(p)}. "
                "In Scenario A I roll the transfer, so he keeps the goalkeeper slot."
            )
        if bench:
            return (
                f"{name}. He stays in the fifteen but starts on my bench. VORTEX projects "
                f"{p['xpts']:.1f} points from {p['xmins']:.0f} expected minutes against "
                f"{_d3_plan_spoken_fixture(p)}. Rolling the transfer means I keep this squad depth, "
                "while the higher projected starters take the active places. He remains useful autosub cover."
            )
        captain_note = (
            " He is also my model captain, so his expected return is counted twice in the projected team score."
            if p["captain"] else
            " He is my vice captain, giving the plan a secure fallback."
            if p["vice"] else ""
        )
        return (
            f"{name}. He starts in my {p['pos']} line. The model projects {p['xpts']:.1f} expected points "
            f"from {p['xmins']:.0f} expected minutes against {_d3_plan_spoken_fixture(p)}. "
            "With no transfer used, this place is earned by the current squad's own expected value, "
            f"minutes security and fixture rather than by forcing a move.{captain_note}"
        )

    _d3_plan_segments = [{
        "id":"headline",
        "text":(
            "This is my plan. Scenario A: roll the transfer. "
            "No move and no chip; optimize the current fifteen."
        ),
    }]

    for _i, _p in enumerate(_d3_plan_starters):
        _d3_plan_segments.append({
            "id":f"plan_player_{_p['id']}",
            "player_id":int(_p["id"]),
            "name":vx_narration_player(int(_p["id"])),
            "kind":"starter",
            "text":_d3_plan_player_text(
                _p,
                bench=False,
                first_goalkeeper=(_i == 0 and _p["pos"] == "GK"),
            ),
        })

    _d3_plan_segments.append({
        "id":"bench_intro",
        "text":(
            "Now the substitutes. I am not selling any of them in Scenario A; "
            "the question is simply how the model orders the four bench places behind the optimized eleven."
        ),
    })
    for _p in _d3_plan_bench:
        _d3_plan_segments.append({
            "id":f"plan_player_{_p['id']}",
            "player_id":int(_p["id"]),
            "name":vx_narration_player(int(_p["id"])),
            "kind":"bench",
            "text":_d3_plan_player_text(_p, bench=True),
        })

    _d3_plan_segments += [
        {
            "id":"metrics_intro",
            "text":(
                "With the full fifteen placed, here is the decision board for my roll scenario. "
                "These numbers describe the optimized team without inventing a transfer."
            ),
        },
        {
            "id":"metric_points",
            "text":(
                f"The optimized starting eleven projects for {_d3_projected_score:.1f} points "
                "after applying the captain multiplier."
            ),
        },
        {
            "id":"metric_orank",
            "text":(
                f"The legal formation is {_d3_formation}. It is chosen from the current fifteen "
                "only, with the FPL formation rules enforced."
            ),
        },
        {
            "id":"metric_gwrank",
            "text":(
                f"I carry {_d3_ft_text} free transfers into this decision. Scenario A uses zero, "
                "so every available transfer rolls forward under the current FPL rules."
            ),
        },
        {
            "id":"metric_captain",
            "text":(
                f"The model captain is {vx_narration_player(_d3_cap_id)}, projected for "
                f"{_d3_cap['xpts']:.1f} raw points. "
                f"{vx_narration_player(_d3_vice_id)} is the vice captain."
            ),
        },
        {
            "id":"metric_bench",
            "text":(
                f"The four substitutes carry {_d3_bench_xpts:.1f} combined expected points. "
                "That gives the roll plan usable autosub depth without spending a move."
            ),
        },
        {
            "id":"metric_hit",
            "text":(
                f"Transfer cost is zero and the bank is {_d3_bank:.1f} million. "
                "This scenario deliberately preserves both the squad and the transfer resource."
            ),
        },
        {
            "id":"review_close",
            "text":(
                "That is Scenario A: roll. Keep the current fifteen, start the mathematically strongest "
                "legal eleven, order the bench by expected points, and protect the transfer for a later "
                "Gameweek. This is one scenario, not an automatic instruction; the other plan branches "
                "will be compared as we build them."
            ),
        },
    ]

    _d3_plan_audio_dir = Path(
        globals().get("AUDIO_WORK_DIR", "/content/FPL_VORTEX_FIRST_DAY_WORK/audio")
    ) / "my_plan_5a_roll_segments"
    _d3_plan_audio_dir.mkdir(parents=True, exist_ok=True)

    def _d3_plan_boundary_key(value):
        value = _d3_unicodedata.normalize("NFKD", str(value or "").casefold())
        value = "".join(ch for ch in value if not _d3_unicodedata.combining(ch))
        return "".join(ch for ch in value if ch.isalnum())

    def _d3_plan_rate(profile, speed_factor):
        raw = str(profile.get("rate", "+0%")).strip().replace("%", "")
        try:
            base_pct = float(raw)
        except Exception:
            base_pct = 0.0
        base_speed = max(0.20, 1.0 + base_pct / 100.0)
        new_speed = max(0.65, min(1.45, base_speed * float(speed_factor)))
        pct = (new_speed - 1.0) * 100.0
        return f"{pct:+.0f}%"

    def _d3_plan_mood(seg):
        sid = str(seg.get("id", ""))
        if sid == "headline":
            return "intro"
        if sid.startswith("metric_") or sid == "metrics_intro":
            return "key_stat"
        if sid == "review_close":
            return "outro"
        return "analysis"

    async def _d3_plan_synth(seg, speed_factor=1.0):
        mood = _d3_plan_mood(seg)
        profile = vx_tts_profile(mood)
        if abs(float(speed_factor) - 1.0) > 1e-6:
            profile["rate"] = _d3_plan_rate(profile, speed_factor)

        seg["text"] = vx_full_word_narration(
            seg["text"], context=f"MY PLAN 5A {seg['id']}"
        )
        seg["display_text"] = vx_full_word_display(
            seg["text"], context=f"MY PLAN 5A display {seg['id']}"
        )
        audio_bytes, words = await vx_edge_tts_stream(seg["text"], profile)
        path = _d3_plan_audio_dir / f"{seg['id']}.mp3"
        path.write_bytes(audio_bytes)
        seg["audio"] = str(path)
        seg["duration"] = float(vx_media_duration(path))
        seg["words"] = words
        seg["tts_mood"] = mood
        seg["tts_profile"] = profile
        seg["name_time"] = 0.0

        if seg.get("player_id") is not None:
            canonical = str(vx_narration_player(int(seg["player_id"]))).strip()
            seg["name"] = canonical
            target = _d3_plan_boundary_key(canonical)
            keys = [_d3_plan_boundary_key(w.get("text", "")) for w in words]
            found = None
            for j in range(len(keys)):
                combined = ""
                for k in range(j, min(len(keys), j + 8)):
                    if not keys[k]:
                        continue
                    combined += keys[k]
                    if combined == target:
                        found = float(words[j]["start"])
                        seg["name_boundary_span"] = [int(j), int(k)]
                        break
                    if len(combined) >= len(target):
                        break
                if found is not None:
                    break
            if found is None:
                raise RuntimeError(
                    f"MY PLAN 5A Ryan boundary missing for {canonical!r}"
                )
            seg["name_time"] = found

    for _seg in _d3_plan_segments:
        await _d3_plan_synth(_seg)

    _d3_plan_pkg = {
        "gw":int(NEXT_GW),
        "scenario":"A_ROLL",
        "players":_d3_plan_starters + _d3_plan_bench,
        "starters":_d3_plan_starters,
        "bench":_d3_plan_bench,
        "segments":_d3_plan_segments,
        "summary":{
            "projected_score":round(_d3_projected_score, 2),
            "formation":_d3_formation,
            "free_transfers":_d3_ft_text,
            "transfers_used":0,
            "transfer_cost":0,
            "chip":"NONE",
            "bench_xpts":round(_d3_bench_xpts, 2),
            "bank":round(_d3_bank, 2),
            "captain_id":int(_d3_cap_id),
            "vice_id":int(_d3_vice_id),
            "squad_state":_d3_state,
            "team_source":str(globals().get("MY_PLAN_TEAM_SOURCE_KEY", "MODEL_INPUT_FILE")),
            "current_squad_ids":sorted(
                int(pid) for pid in _d3_squad["player_id"].astype(int).tolist()
            ),
        },
    }

    _d3_plan_timing = dict(GW_REVIEW_ANIMATION_TIMING)
    _d3_plan_timing["final_hold"] = 3.0

    def _d3_rebuild_plan_timeline():
        return _vx_build_review_timeline(_d3_plan_pkg, _d3_plan_timing)

    _d3_plan_timeline = _d3_rebuild_plan_timeline()
    _d3_plan_target = 270.0
    _d3_speed_factor = 1.0
    for _attempt in range(2):
        _d3_total = float(_d3_plan_timeline["total"])
        if 265.0 <= _d3_total <= 275.0:
            break
        _gate = (
            float(_d3_plan_timing["goalkeeper_card_out"])
            + float(_d3_plan_timing["hero_fade_out"])
        )
        _target_rest = max(
            1.0,
            _d3_plan_target - _gate - float(_d3_plan_timing["final_hold"]),
        )
        _rest_segments = _d3_plan_segments[2:]
        _current_rest = sum(float(seg["duration"]) for seg in _rest_segments)
        _d3_speed_factor = max(
            0.72,
            min(1.35, _d3_speed_factor * (_current_rest / _target_rest)),
        )
        for _seg in _rest_segments:
            await _d3_plan_synth(_seg, speed_factor=_d3_speed_factor)
        _d3_plan_timeline = _d3_rebuild_plan_timeline()

    _d3_plan_total = float(_d3_plan_timeline["total"])
    if not 265.0 <= _d3_plan_total <= 275.0:
        raise RuntimeError(
            f"MY PLAN 5A narration must stay within 4:25–4:35; got {_d3_plan_total:.2f}s"
        )

    _d3_plan_narr_end = float(_d3_plan_timeline["narration_end"])
    _d3_plan_mp3 = Path(
        globals().get("MP3_DIR", "/content/FPL_VORTEX_FIRST_DAY_WORK/mp3")
    ) / "05a_my_plan_roll.mp3"
    _d3_audio_inputs = []
    _d3_audio_filters = []
    _d3_audio_labels = []
    for _idx, _seg in enumerate(_d3_plan_segments):
        _d3_audio_inputs += ["-i", str(_seg["audio"])]
        _delay = max(0, int(round(float(_seg["t0"]) * 1000.0)))
        _label = f"plan5a{_idx}"
        _d3_audio_filters.append(
            f"[{_idx}:a]aresample=48000,adelay=delays={_delay}:all=1[{_label}]"
        )
        _d3_audio_labels.append(f"[{_label}]")
    _d3_audio_filters.append(
        "".join(_d3_audio_labels)
        + f"amix=inputs={len(_d3_audio_labels)}:duration=longest:normalize=0,"
          f"apad=pad_dur={float(_d3_plan_timing['final_hold']):.6f},"
          f"atrim=start=0:end={_d3_plan_total:.6f}[planmaster]"
    )
    _d3_subprocess.run(
        [
            "ffmpeg","-y","-v","error",
            *_d3_audio_inputs,
            "-filter_complex",";".join(_d3_audio_filters),
            "-map","[planmaster]",
            "-c:a","libmp3lame","-b:a","192k","-ar","48000",
            str(_d3_plan_mp3),
        ],
        check=True,
    )
    _d3_master_duration = float(vx_media_duration(_d3_plan_mp3))
    if abs(_d3_master_duration - _d3_plan_total) > 0.12:
        raise RuntimeError(
            f"MY PLAN 5A MP3/timeline drift: "
            f"audio={_d3_master_duration:.3f}, timeline={_d3_plan_total:.3f}"
        )

    _d3_metric_ids = {
        "points":"metric_points",
        "orank":"metric_orank",
        "gwrank":"metric_gwrank",
        "captain":"metric_captain",
        "bench":"metric_bench",
        "hit":"metric_hit",
    }
    _d3_metric_map = {}
    for _key, _sid in _d3_metric_ids.items():
        _seg = next(seg for seg in _d3_plan_segments if seg["id"] == _sid)
        _d3_metric_map[_key] = [float(_seg["t0"]), float(_seg["t1"])]

    _d3_bench_intro = next(
        seg for seg in _d3_plan_segments if seg["id"] == "bench_intro"
    )
    _d3_metrics_intro = next(
        seg for seg in _d3_plan_segments if seg["id"] == "metrics_intro"
    )

    _d3_plan_js = {
        "gw":int(NEXT_GW),
        "starters":_d3_plan_starters,
        "bench":_d3_plan_bench,
        "segments":_d3_plan_segments,
        "total":_d3_plan_total,
        "narration_end":_d3_plan_narr_end,
        "timeline":_d3_plan_timing,
        "bench_t":float(_d3_bench_intro["t0"]),
        "metrics_t":float(_d3_metrics_intro["t0"]),
        "metric_times":_d3_metric_map,
        "plan_summary":_d3_plan_pkg["summary"],
    }

    _d3_plan_anim_html = Path(HTML) / "my_plan_5a_roll_scene_4k_animated.html"
    _d3_plan_static_html = Path(HTML) / "my_plan_5a_roll_scene_4k.html"
    _d3_plan_png = Path(globals().get("SLIDE_DIR")) / "my_plan_5a_roll_scene_4k.png"

    _d3_review_anim_source = Path(ANIM_HTML)
    if not _d3_review_anim_source.is_file():
