                  raise SystemExit(
                      f"{expected_label} projected score is missing/non-positive"
                  )

              plan_duration = float(plan_manifest.get("duration") or 0.0)
              if plan_duration <= 0.0:
                  raise SystemExit(
                      f"{expected_label} narration duration is invalid, "
                      f"found {plan_duration:.2f}s"
                  )
              if int(plan_manifest.get("starting_xi") or 0) != 11:
                  raise SystemExit(f"{expected_label} manifest lost its starting XI")
              if int(plan_manifest.get("bench") or 0) != 4:
                  raise SystemExit(f"{expected_label} manifest lost its four substitutes")
              if float(plan_manifest.get("final_hold_seconds") or 0.0) < 3.0:
                  raise SystemExit(
                      f"{expected_label} final composition hold is under three seconds"
                  )
              if plan_render.get("passed") is not True:
                  raise SystemExit(f"{expected_label} renderer QA did not pass")
              if plan_render.get("visual_source") != "COPIED_GW_REVIEW_ANIMATED_DOM_HTML":
                  raise SystemExit(
                      f"{expected_label} is not using the copied GW Review visual source"
                  )
              if plan_render.get("original_gw_review_preserved") is not True:
                  raise SystemExit(
                      f"{expected_label} renderer did not assert GW Review preservation"
                  )

          elite_outro_info = section_narr.get("05_outro") or {}
          elite_outro_duration = float(elite_outro_info.get("duration") or 0.0)
          if elite_outro_duration <= 0.0:
              raise SystemExit(
                  f"Elite Day 3 outro narration duration is invalid: {elite_outro_duration:.2f}s"
              )
          elite_outro_files = (
              root / "SLIDE" / "outro_scene_4k.png",
              root / "MP3" / "05_outro.mp3",
              root / "MP4" / "05_outro.mp4",
          )
          for elite_outro_file in elite_outro_files:
              if not elite_outro_file.is_file() or elite_outro_file.stat().st_size <= 0:
                  raise SystemExit(f"Elite Day 3 outro output is missing: {elite_outro_file}")
          elite_script = str(elite_outro_info.get("script") or "").lower()
          for elite_phrase in (
              "final takeaways", "the bigger lesson", "before you go",
              "subscribe", "comment", "share", "follow", "thank you for watching",
          ):
              if elite_phrase not in elite_script:
                  raise SystemExit(f"Elite outro narration missing CTA/takeaway phrase: {elite_phrase}")
          print(f"Day 3_3 Elite natural outro PNG/MP3/MP4/narration contract: PASS ({elite_outro_duration:.2f}s)")

          day3_slide5_review_files = (
              root / "SLIDE" / "gw_review_scene_4k.png",
              root / "MP3" / "gw_review.mp3",
              root / "MP4" / "gw_review.mp4",
              root / "DATA" / "gw_review_animation_manifest.json",
          )
          for day3_slide5_review_file in day3_slide5_review_files:
              if not day3_slide5_review_file.is_file() or day3_slide5_review_file.stat().st_size <= 0:
                  raise SystemExit(
                      f"Day 3 Slide 5 Gameweek Review output is missing: {day3_slide5_review_file}"
                  )

          scene_keys = list(qa.get("scene_keys") or [])
          required_master_order = [
              "03_projected_goals",
              "03_defcon",
              "04_final_shortlists",
              "05_transfer_decision_desk",
              "gw_review",
              *selected_plan_keys,
              "02_fdr",
              "04_clean_sheets",
          ]
          positions = []
          for scene_key in required_master_order:
              if scene_key not in scene_keys:
                  raise SystemExit(
                      f"Day 3 combined master is missing required scene: {scene_key}"
                  )
              positions.append(scene_keys.index(scene_key))
          if positions != sorted(positions):
              raise SystemExit(
                  f"Day 3 combined master scene order is wrong: {positions}"
              )
          if not scene_keys or scene_keys[-1] != "05_outro":
              raise SystemExit(
                  f"Elite Day 3 outro must be the final combined-master scene: {scene_keys[-3:]}"
              )
          print(
              "Day 3_3 Projected Goals + DEFCON + Final Shortlists + Transfer Decision Desk + "
              "Slide 5 Gameweek Review + "
              + ", ".join(plan_specs[key]["label"] for key in selected_plan_keys)
              + " + Slide 6 Benching Dilemma + Slide 7 Chip Strategy + Slide 8 Elite Takeaways/CTA PNG/MP3/MP4/narration contract: PASS"
          )

          final_mp4s = [
              path for path in (root / "MP4").glob("*COMBINED*.mp4")
              if path.is_file()
          ]
          final_mp3s = [
              path for path in (root / "MP3").glob("*COMBINED*.mp3")
              if path.is_file()
          ]
          if len(final_mp4s) != 1 or len(final_mp3s) != 1:
              raise SystemExit(
                  "Expected exactly one combined final MP4 and MP3; "
                  f"found MP4={len(final_mp4s)}, MP3={len(final_mp3s)}"
              )

          render_mode = str(os.environ.get("DAY3_RENDER_MODE") or "").strip().upper()
          if render_mode not in {"DRAFT","FINAL"}:
              raise SystemExit(f"Invalid DAY3_RENDER_MODE during QA: {render_mode!r}")
          probe = json.loads(subprocess.check_output(
              [
                  "ffprobe","-v","error","-select_streams","v:0",
                  "-show_entries","stream=width,height,avg_frame_rate",
                  "-of","json",str(final_mp4s[0]),
              ],
              text=True,
          ))
          stream = (probe.get("streams") or [{}])[0]
          width, height = int(stream.get("width") or 0), int(stream.get("height") or 0)
          fps_num, fps_den = str(stream.get("avg_frame_rate") or "0/1").split("/",1)
          fps = float(fps_num) / max(1.0,float(fps_den))
          expected = {"DRAFT":(854,480,5.0),"FINAL":(3840,2160,24.0)}[render_mode]
          if (width,height) != expected[:2] or abs(fps-expected[2]) > 0.05:
              raise SystemExit(
                  f"{render_mode} combined video has wrong render contract: "
                  f"{width}x{height} @{fps:.3f}fps vs {expected}"
              )
          print(f"Day 3 render mode QA: {render_mode} • {width}x{height} @ {fps:.0f}fps")

          package_path = root / "DATA" / "youtube_video_3_of_3_package.json"
          if not package_path.is_file():
              raise SystemExit(f"Video 3/3 package is missing: {package_path}")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if (
              package.get("manual_upload_only") is not False
              or package.get("youtube_api_upload_enabled") is not True
              or package.get("automatic_publication_enabled") is not False
          ):
              raise SystemExit(
                  "YouTube Video 3/3 package is not enabled for private API upload"
              )

          expected_policy = {
              "privacy_status": "private",
              "notify_subscribers": False,
              "automatic_publish": False,
              "automatic_schedule": False,
              "manual_publication_required": True,
          }
          if package.get("upload_policy") != expected_policy:
              raise SystemExit("YouTube private-upload safety policy is invalid")

          metadata = package.get("metadata") or {}
          if metadata.get("series") != {"part": 3, "total": 3}:
              raise SystemExit("YouTube package is not marked as Video 3/3")
          title = str(metadata.get("title") or "")
          description = str(metadata.get("description") or "")
          if "(3/3)" not in title or "VIDEO 3/3" not in description.upper():
              raise SystemExit(
                  "YouTube title/description is not visibly marked as Video 3/3"
              )
          if metadata.get("recommended_visibility") != "Private":
              raise SystemExit("YouTube visibility is not Private")

          preview_gw = int(metadata.get("preview_gw") or 0)
          review_gw = int(metadata.get("review_gw") or 0)
          if not 1 <= preview_gw <= 38 or not 1 <= review_gw <= 38:
              raise SystemExit(f"Invalid dynamic GWs: {preview_gw}/{review_gw}")
          if f"FPL GW{preview_gw}" not in title:
              raise SystemExit("YouTube title has the wrong Gameweek")

          print(f"Day 3 output folder: {root}")
          print("Four output folders and private YouTube Video 3/3 package: PASS")
          PY


      - name: Save only Day 3 outputs to the separate Drive folder
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${DAY3_OUTPUT_ROOT}" ]]; then
            echo "Day 3 output folder is missing: ${DAY3_OUTPUT_ROOT}" >&2
            exit 1
          fi
          rclone sync \
            "${DAY3_OUTPUT_ROOT}" \
            "vortex-drive:${DAY3_DRIVE_PATH}" \
            --create-empty-src-dirs --transfers 4 --checkers 8
          echo "Saved only Day 3 outputs to My Drive/${DAY3_DRIVE_PATH}"


      - name: Upload Final Video 3/3 privately to YouTube
        if: ${{ inputs.render_mode == 'FINAL' }}
        shell: bash
        run: |
          python "${DAY3_UPLOAD_SCRIPT}" \
            --output-root "${DAY3_OUTPUT_ROOT}"
          echo "Video 3/3 upload completed and verified as Private"


      - name: Save Video 3/3 private-upload receipt to its Drive folder
        if: ${{ always() && inputs.render_mode == 'FINAL' }}
        shell: bash
        run: |
          receipt="${DAY3_OUTPUT_ROOT}/DATA/youtube_private_upload.json"
          if [[ -s "${receipt}" ]]; then
            rclone copyto \
              "${receipt}" \
              "vortex-drive:${DAY3_DRIVE_PATH}/DATA/youtube_private_upload.json"
            echo "Saved Video 3/3 private-upload receipt in the Day 3 folder"
          else
            echo "No YouTube private-upload receipt was created"
          fi

      - name: Upload Day 3 output artifact
        if: ${{ always() && inputs.render_mode == 'FINAL' }}
        uses: actions/upload-artifact@v7
        with:
          name: day-3-output-${{ github.run_number }}
          path: ${{ env.DAY3_OUTPUT_ROOT }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload Day 3 log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-3-log-${{ github.run_number }}
          path: ${{ runner.temp }}/day-3.log
          if-no-files-found: warn
          retention-days: 14
