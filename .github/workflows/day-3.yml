def _d3_bench_reason(row, *, avoid=False):
    _fdr = float(row["fdr"])
    _xpts = float(row["xpts"])
    _xmins = float(row["xmins"])
    _start = float(row["start_probability"])
    _form = float(row["form"])
    _set_piece = float(row["set_piece_signal"]) > 0
    if avoid:
        if _xmins < 45 or _start < 0.50:
            return "minutes risk is too high"
        if _fdr >= 3.8:
            return "the next fixture is too difficult"
        if _xpts <= float(_d3_bench_pool["xpts"].median()):
            return "the projected ceiling is too low"
        return "stronger start options rate above him"
    if _fdr <= 2.3 and _start >= 0.80:
        return "soft fixture plus secure minutes"
    if _set_piece and _xpts >= float(_d3_bench_pool["xpts"].quantile(0.75)):
        return "set-piece role plus strong xPts"
    if _form >= float(_d3_bench_pool["form"].quantile(0.75)):
        return "form and underlying numbers agree"
    if _xmins >= 80 and _start >= 0.80:
        return "elite minutes security"
    return "fixture, minutes and xPts all align"

