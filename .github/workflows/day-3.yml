    def _d3_plan_boundary_key(value):
        value = _d3_unicodedata.normalize("NFKD", str(value or "").casefold())
        value = "".join(ch for ch in value if not _d3_unicodedata.combining(ch))
        return "".join(ch for ch in value if ch.isalnum())

    def _d3_plan_rate(profile, speed_factor):
        raw = str(profile.get("rate", "+0%")).strip().replace("%", "")
        try:
            base_pct = float(raw)
        except Exception:
            base_pct = 0.0
        base_speed = max(0.20, 1.0 + base_pct / 100.0)
        new_speed = max(0.65, min(1.45, base_speed * float(speed_factor)))
        pct = (new_speed - 1.0) * 100.0
        return f"{pct:+.0f}%"

    def _d3_plan_mood(seg):
        sid = str(seg.get("id", ""))
        if sid == "headline":
            return "intro"
        if sid.startswith("metric_") or sid == "metrics_intro":
            return "key_stat"
        if sid == "review_close":
            return "outro"
        return "analysis"

    async def _d3_plan_synth(seg, speed_factor=1.0):
        mood = _d3_plan_mood(seg)
        profile = vx_tts_profile(mood)
        if abs(float(speed_factor) - 1.0) > 1e-6:
            profile["rate"] = _d3_plan_rate(profile, speed_factor)

        seg["text"] = vx_full_word_narration(
            seg["text"], context=f"MY PLAN 5A {seg['id']}"
        )
        seg["display_text"] = vx_full_word_display(
            seg["text"], context=f"MY PLAN 5A display {seg['id']}"
        )
        audio_bytes, words = await vx_edge_tts_stream(seg["text"], profile)
        path = _d3_plan_audio_dir / f"{seg['id']}.mp3"
        path.write_bytes(audio_bytes)
        seg["audio"] = str(path)
        seg["duration"] = float(vx_media_duration(path))
        seg["words"] = words
        seg["tts_mood"] = mood
        seg["tts_profile"] = profile
        seg["name_time"] = 0.0

        if seg.get("player_id") is not None:
            canonical = str(vx_narration_player(int(seg["player_id"]))).strip()
            seg["name"] = canonical
            target = _d3_plan_boundary_key(canonical)
            keys = [_d3_plan_boundary_key(w.get("text", "")) for w in words]
            found = None
            for j in range(len(keys)):
                combined = ""
                for k in range(j, min(len(keys), j + 8)):
                    if not keys[k]:
                        continue
                    combined += keys[k]
                    if combined == target:
                        found = float(words[j]["start"])
                        seg["name_boundary_span"] = [int(j), int(k)]
                        break
                    if len(combined) >= len(target):
                        break
                if found is not None:
                    break
            if found is None:
                raise RuntimeError(
                    f"MY PLAN 5A Ryan boundary missing for {canonical!r}"
                )
            seg["name_time"] = found

    for _seg in _d3_plan_segments:
        await _d3_plan_synth(_seg)

