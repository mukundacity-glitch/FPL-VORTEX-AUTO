def _d3_bench_norm(series):
    _s = pd.to_numeric(series, errors="coerce").fillna(0.0)
    _lo = float(_s.min())
    _hi = float(_s.max())
    if not np.isfinite(_lo) or not np.isfinite(_hi) or _hi - _lo <= 1e-12:
        return pd.Series(0.5, index=_s.index, dtype=float)
    return ((_s - _lo) / (_hi - _lo)).clip(0.0, 1.0)

