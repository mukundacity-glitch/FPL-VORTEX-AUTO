def _d3_rank_rows(frame, metric):
    rows = []
    maximum = float(pd.to_numeric(
        frame["gw1_xg" if metric == "xg" else "gw1_cs"], errors="coerce"
    ).max())
    for _idx, _row in frame.reset_index(drop=True).iterrows():
        _tid = int(_row["team_id"])
        _value = float(_row["gw1_xg"] if metric == "xg" else _row["gw1_cs"])
        _width = 100.0 * _value / maximum if maximum > 0 else 0.0
        _is_target = _idx < 4
        _is_avoid = _idx >= len(frame) - 3
        _cls = " d3Target" if _is_target else (" d3Avoid" if _is_avoid else "")
        _display = f"{_value:.2f}" if metric == "xg" else f"{_value:.0f}%"
        _opp = _d3_escape(str(_row.get("gw1_opponent", "TBD")).upper())
        _player = _d3_player_by_team.get(_tid, {})
        _player_text = (
            f'{_d3_escape(str(_player.get("name", "")))} • {float(_player.get("xpts", 0)):.1f}'
            if _player else "NO READY xPTS"
        )
        rows.append(
            f'<div class="d3RankRow{_cls}" data-team="{_d3_escape(str(_row["team_short"]).upper())}">'
            f'<span class="d3RankNo">{_idx + 1:02d}</span>'
            f'{_d3_team_badge(_row, "d3RankBadge")}'
            '<div class="d3RankIdentity">'
            f'<span class="d3RankTeam">{_d3_escape(str(_row["team_short"]).upper())}</span>'
            f'<small>{_opp} • {_player_text}</small>'
            '</div>'
            f'<div class="d3RankBar"><i style="width:{_width:.1f}%"></i></div>'
            f'<strong>{_display}</strong>'
            '</div>'
        )
    return "".join(rows)

