    if(VX.key==="04_clean_sheets" && VX.chip_motion){
        const cm=VX.chip_motion;
        const clamp01=v=>Math.max(0,Math.min(1,v));
        const phase=(at,span)=>ease(clamp01((t-at)/Math.max(.001,span)));

        document.querySelectorAll(".d3ChipParticle").forEach((el,i)=>{
            const drift=Math.sin(t*.34+i*1.77)*18;
            const lift=Math.cos(t*.27+i*.91)*11;
            el.style.transform="translate("+drift+"px,"+lift+"px)";
            el.style.opacity=String(.10+.11*(.5+.5*Math.sin(t*.22+i)));
        });

        const times=Array.isArray(cm.usage_times)?cm.usage_times:[];
        document.querySelectorAll(".d3ChipUsageCard").forEach((card,i)=>{
            const at=Number(times[i]??cm.usage_at??0);
            const p=phase(at,.82);
            card.style.opacity=String(p);
            card.style.transform="perspective(1100px) translateY("+((1-p)*34)+"px) rotateY("+(-82*(1-p))+"deg) scale("+(0.94+0.06*p)+")";
            const target=parseFloat(card.dataset.targetPct||"0");
            const pct=card.querySelector(".d3ChipPct");
            if(pct) pct.textContent=(target*p).toFixed(1)+"%";
            const fill=card.querySelector(".d3ChipProgressFill");
            if(fill) fill.style.transform="scaleX("+Math.min(1,(target/100)*p)+")";
        });

        const high=document.querySelector(".d3ChipHighestNumber");
        if(high){
            const raw=String(high.dataset.targetScore||"");
            const target=parseInt(raw,10);
            if(Number.isFinite(target)){
                const p=phase(Number(cm.highest_at||0),1.05);
                const small=high.querySelector("small");
                high.childNodes[0].nodeValue=String(Math.round(target*p));
                if(small) small.style.opacity=String(p);
            }
        }

        document.querySelectorAll(".d3ChipRemainCard").forEach((card,i)=>{
            const p=phase(Number(cm.remaining_at||0)+i*.12,.52);
            card.style.opacity=String(p);
            card.style.transform="translateY("+((1-p)*20)+"px) scale("+(0.90+0.10*p)+")";
        });

        document.querySelectorAll(".d3ChipUnderline").forEach((line,i)=>{
            const p=phase(Number(cm.strategy_at||0)+i*.15,.55);
            line.style.transform="scaleX("+p+")";
            line.style.opacity=String(p);
        });
    }

