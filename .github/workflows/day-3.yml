_d3_proj["gw1_xg"] = pd.to_numeric(_d3_proj["gw1_xg"], errors="coerce")
_d3_proj["gw1_cs"] = pd.to_numeric(_d3_proj["gw1_cs"], errors="coerce")
_d3_proj = _d3_proj.dropna(subset=["team_id", "gw1_xg", "gw1_cs"]).copy()
_d3_proj["team_id"] = _d3_proj["team_id"].astype(int)
if _d3_proj["team_id"].duplicated().any():
    raise RuntimeError("Day 3_3 projection slide has duplicate team IDs")
if len(_d3_proj) != 20:
    raise RuntimeError(f"Day 3_3 projection slide requires 20 teams, found {len(_d3_proj)}")

