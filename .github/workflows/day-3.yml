        _delay = max(0, int(round(float(_seg["t0"]) * 1000.0)))
        _label = f"plan5a{_idx}"
        _d3_audio_filters.append(
            f"[{_idx}:a]aresample=48000,adelay=delays={_delay}:all=1[{_label}]"
        )
        _d3_audio_labels.append(f"[{_label}]")
    _d3_audio_filters.append(
        "".join(_d3_audio_labels)
        + f"amix=inputs={len(_d3_audio_labels)}:duration=longest:normalize=0,"
          f"apad=pad_dur={float(_d3_plan_timing['final_hold']):.6f},"
