name: Day 3_3 — SELECT STANDALONE BRANCH

run-name: Day 3_3 • MAIN BLOCKED • select codex/day3-standalone-runtime

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: "IMPORTANT: first choose Use workflow from = codex/day3-standalone-runtime"
        required: true
        default: DRAFT
        type: choice
        options:
          - DRAFT
          - FINAL

permissions:
  contents: read

jobs:
  wrong-branch:
    name: STOP — select codex/day3-standalone-runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Main branch guard
        shell: bash
        run: |
          echo "::error::Day 3 is intentionally disabled on main while standalone validation is in progress."
          echo "::error::Open Run workflow, set 'Use workflow from' to 'codex/day3-standalone-runtime', choose DRAFT, then run."
          echo "No Day 3 runtime or Drive output was executed from main."
          exit 1
