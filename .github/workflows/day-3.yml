permissions:
  contents: read

concurrency:
  group: fpl-vortex-day-3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FPL_ENTRY_ID: "145784"
  DAY3_PLAN_SELECTION: ${{ inputs.plan }}
  DAY3_OUT_1: ${{ inputs.player_out_1 }}
  DAY3_IN_1: ${{ inputs.player_in_1 }}
  DAY3_OUT_2: ${{ inputs.player_out_2 }}
  DAY3_IN_2: ${{ inputs.player_in_2 }}
  DAY3_OUT_3: ${{ inputs.player_out_3 }}
  DAY3_IN_3: ${{ inputs.player_in_3 }}
  DAY3_OUT_4: ${{ inputs.player_out_4 }}
  DAY3_IN_4: ${{ inputs.player_in_4 }}
  DAY3_OUT_5: ${{ inputs.player_out_5 }}
  DAY3_IN_5: ${{ inputs.player_in_5 }}
  DAY3_NOTEBOOK_ID: "1zKWruOYPPstyyr42y6q-MKwE3-6qTh0s"
  DAY3_NOTEBOOK_PATH: "/tmp/fpl-vortex-day3-final.ipynb"
  DAY3_OUTPUT_ROOT: "/content/drive/MyDrive/FPL_VORTEX/Day_3_3"
  DAY3_DRIVE_PATH: "FPL_VORTEX/Day_3_3"
  DAY1_ASSET_FOLDER_ID: "1h3Loznr5RnsMyh-kUd-zMxEgOf98uFSt"
  DAY1_ASSET_DIR: "/content/drive/MyDrive/FPL_VORTEX/Assets"
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  run-day-3:
    name: Run final Day 3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The production notebook uses Python 3.12+ f-string grammar (PEP 701).
          python-version: "3.12"

      - name: Validate requested plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          selection = os.environ["DAY3_PLAN_SELECTION"].strip().upper()
          mapping = {
              "ROLL": ("ROLL", "AUTO"),
              "TRANSFER — AUTO": ("TRANSFER", "AUTO"),
              "TRANSFER — MANUAL": ("TRANSFER", "MANUAL"),
              "NEITHER": ("NEITHER", "AUTO"),
          }
          if selection not in mapping:
              raise SystemExit(f"Invalid Day 3 plan: {selection!r}")

          plan, transfer_mode = mapping[selection]
          selected_pairs = []
          found_gap = False

          for index in range(1, 6):
              out_value = os.environ.get(f"DAY3_OUT_{index}", "NONE").strip()
              in_value = os.environ.get(f"DAY3_IN_{index}", "NONE").strip()
              empty_out = out_value == "NONE"
              empty_in = in_value == "NONE"

              if transfer_mode != "MANUAL":
                  continue

              if empty_out and empty_in:
                  found_gap = True
                  continue
              if empty_out != empty_in:
                  raise SystemExit(
                      f"Manual pair {index} is incomplete. Select both OUT {index} and IN {index}."
                  )
              if found_gap:
                  raise SystemExit(
                      "Manual transfer pairs must be selected in order without gaps."
                  )
              selected_pairs.append((out_value, in_value))

          if transfer_mode == "MANUAL" and not selected_pairs:
              raise SystemExit(
                  "TRANSFER — MANUAL requires at least Player OUT 1 and Player IN 1."
              )

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"DAY3_PLAN={plan}\n")
              env_file.write(f"DAY3_TRANSFER_MODE={transfer_mode}\n")

          print(f"Day 3 plan: {selection}")
          if transfer_mode == "MANUAL":
              print(f"Manual transfer pairs selected: {len(selected_pairs)}")
              for index, (out_value, in_value) in enumerate(selected_pairs, 1):
                  print(f"{index}. OUT {out_value} -> IN {in_value}")
          else:
              print("Player OUT/IN dropdowns are ignored for this plan.")
          print("FINAL render + FULL VIDEO + Private YouTube upload are automatic.")
          PY

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<3" \
            "pyarrow>=17,<21" \
            "Pillow>=10.4,<12" \
            "scipy>=1.14,<2" \
            "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" \
            "ipywidgets>=8.1,<9" \
            "playwright>=1.46,<2" \
            "edge-tts>=6.1,<8" \
            "beautifulsoup4>=4.12,<5" \
            "opencv-python-headless>=4.10,<5" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"

      - name: Install Chromium runtime
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Configure Drive and download final Day 3 notebook
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          client_id = (os.environ.get("GOOGLE_OAUTH_CLIENT_ID") or "").strip()
          client_secret = (os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET") or "").strip()
          refresh_token = (os.environ.get("GOOGLE_OAUTH_REFRESH_TOKEN") or "").strip()
          missing = [
              name
              for name, value in (
                  ("GOOGLE_OAUTH_CLIENT_ID", client_id),
                  ("GOOGLE_OAUTH_CLIENT_SECRET", client_secret),
                  ("GOOGLE_OAUTH_REFRESH_TOKEN", refresh_token),
              )
              if not value
          ]
          if missing:
              raise SystemExit("Missing required Drive secret(s): " + ", ".join(missing))

          body = urllib.parse.urlencode(
              {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token,
                  "grant_type": "refresh_token",
              }
          ).encode("utf-8")
          token_request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(token_request, timeout=30) as response:
              refreshed = json.loads(response.read().decode("utf-8"))

          access_token = refreshed["access_token"]
          expires_in = int(refreshed.get("expires_in", 3600))
          token = {
              "access_token": access_token,
              "token_type": refreshed.get("token_type", "Bearer"),
              "refresh_token": refresh_token,
              "expiry": (
                  datetime.now(timezone.utc)
                  + timedelta(seconds=max(60, expires_in - 60))
              ).isoformat().replace("+00:00", "Z"),
          }

          config_dir = Path(os.environ["RUNNER_TEMP"]) / "rclone"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_path = config_dir / "rclone.conf"
          token_json = json.dumps(token, separators=(",", ":"))
          config_path.write_text(
              "\n".join(
                  (
                      "[vortex-drive]",
                      "type = drive",
                      f"client_id = {client_id}",
                      f"client_secret = {client_secret}",
                      "scope = drive",
                      f"token = {token_json}",
                      "",
                      "[day1-assets]",
                      "type = drive",
                      f"client_id = {client_id}",
                      f"client_secret = {client_secret}",
                      "scope = drive",
                      f"token = {token_json}",
                      f"root_folder_id = {os.environ['DAY1_ASSET_FOLDER_ID']}",
                      "",
                  )
              ),
              encoding="utf-8",
          )
          config_path.chmod(0o600)

          notebook_url = (
              "https://www.googleapis.com/drive/v3/files/"
              + os.environ["DAY3_NOTEBOOK_ID"]
              + "?alt=media"
          )
          notebook_request = urllib.request.Request(
              notebook_url,
              headers={"Authorization": f"Bearer {access_token}"},
          )
          with urllib.request.urlopen(notebook_request, timeout=120) as response:
              notebook_bytes = response.read()

          notebook_path = Path(os.environ["DAY3_NOTEBOOK_PATH"])
          notebook_path.parent.mkdir(parents=True, exist_ok=True)
          notebook_path.write_bytes(notebook_bytes)
          parsed = json.loads(notebook_bytes.decode("utf-8"))
          if not isinstance(parsed.get("cells"), list) or len(parsed["cells"]) < 30:
              raise SystemExit("Downloaded Drive file is not the expected final Day 3 notebook.")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"RCLONE_CONFIG={config_path}\n")
          print(f"Final Day 3 notebook downloaded: {len(parsed['cells'])} cells")
          PY

      - name: Restore Day 3 model state and production assets
        shell: bash
        run: |
          set -euo pipefail

          restore_optional() {
            local remote_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if rclone lsf "vortex-drive:$remote_path" --max-depth 1 >/dev/null 2>&1; then
              mkdir -p "$local_path"
              rclone copy "vortex-drive:$remote_path" "$local_path" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Restored My Drive/$remote_path"
            else
              echo "Optional Drive path not present: My Drive/$remote_path"
            fi
          }

          required_path="FPL_VORTEX_DATA/00_SOURCE_ARCHIVE/FPL_CORE/data"
          if ! rclone lsf "vortex-drive:$required_path" --max-depth 1 >/dev/null 2>&1; then
            echo "Required Drive path is missing: My Drive/$required_path" >&2
            exit 1
          fi

          restore_optional "FPL_VORTEX/MODEL_INPUTS"
          restore_optional "FPL_VORTEX/DECISION_ENGINE"
          restore_optional "FPL_VORTEX/RAW_DATA"
          restore_optional "FPL_VORTEX/MODEL_HISTORY"
          restore_optional "FPL_VORTEX/elements"
          restore_optional "elements"
          restore_optional "$required_path"
          restore_optional "FPL_VORTEX_DATA/03_ELITE_MANAGERS"
          restore_optional "FPL_VORTEX_DATA/04_MASTER"
          restore_optional "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          restore_optional "FPL_VORTEX_DATA/06_SNAPSHOTS"
          restore_optional "FPL_VORTEX_DATA/07_LOGS"

          mkdir -p "$DAY1_ASSET_DIR"
          # This Drive folder is dedicated to production assets. Restore it whole so
          # notebook asset additions cannot be silently omitted by a stale allowlist.
          rclone copy "day1-assets:" "$DAY1_ASSET_DIR" \
            --create-empty-src-dirs --transfers 4 --checkers 8

          for asset_name in opening.mp4 outro.mp4 popup.mp4 trans.mp4 Background_music.mp3 1.png 2.png 3.png 4.png 5.png 6.png 7.png 8.png 9.png 10.png; do
            if [[ ! -s "$DAY1_ASSET_DIR/$asset_name" ]]; then
              echo "Required production asset is missing: $asset_name" >&2
              exit 1
            fi
          done
          echo "Day 3 production assets restored"

      - name: Reset only previous Day 3 render outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected = Path("/content/drive/MyDrive/FPL_VORTEX/Day_3_3").resolve()
          if root != expected:
              raise SystemExit(f"Unsafe Day 3 output path: {root}")

          for name in ("MP4", "MP3", "SLIDE", "DATA"):
              folder = root / name
              folder.mkdir(parents=True, exist_ok=True)
              for child in list(folder.iterdir()):
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
          print("Previous Day 3 render outputs cleared")
          PY

      - name: Run final Day 3 notebook
        shell: bash
        run: |
          set -o pipefail
          python day3/run_notebook.py "$DAY3_NOTEBOOK_PATH" \
            2>&1 | tee "$RUNNER_TEMP/day-3.log"

      - name: Upload one private YouTube draft with matching thumbnail
        shell: bash
        run: |
          python day3/publish_private.py \
            --output-root "$DAY3_OUTPUT_ROOT" \
            --plan "$DAY3_PLAN" \
            --transfer-mode "$DAY3_TRANSFER_MODE"

      - name: Sync Day 3 output and persistent model state back to Drive
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          sync_if_present() {
            local remote_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if [[ -d "$local_path" ]]; then
              rclone sync "$local_path" "vortex-drive:$remote_path" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Synced My Drive/$remote_path"
            fi
          }

          sync_if_present "FPL_VORTEX/Day_3_3"
          sync_if_present "FPL_VORTEX/DECISION_ENGINE"
          sync_if_present "FPL_VORTEX/RAW_DATA"
          sync_if_present "FPL_VORTEX/MODEL_HISTORY"
          sync_if_present "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          sync_if_present "FPL_VORTEX_DATA/06_SNAPSHOTS"
          sync_if_present "FPL_VORTEX_DATA/07_LOGS"

      - name: Stage final downloadable files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/day3-artifact"
          mkdir -p "$RUNNER_TEMP/day3-artifact"

          final_video="$(find "$DAY3_OUTPUT_ROOT/MP4" -maxdepth 1 -type f -iname '*COMBINED*.mp4' -print -quit || true)"
          if [[ -n "$final_video" ]]; then
            cp "$final_video" "$RUNNER_TEMP/day3-artifact/"
          fi

          # The downloadable artifact contains one finished video only.
          # Thumbnail/report remain in Drive and the thumbnail is applied to YouTube.

      - name: Upload Day 3 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-3-final-${{ github.run_number }}
          path: ${{ runner.temp }}/day3-artifact
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
