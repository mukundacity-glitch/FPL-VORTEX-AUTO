          set -o pipefail
          python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/day-3.log"
          import hashlib
          import os
          import re
          from pathlib import Path

          from IPython.core.interactiveshell import InteractiveShell

          source_path = Path(os.environ["DAY3_RUNTIME_SOURCE"]).resolve()
          source_bytes = source_path.read_bytes()
          actual_hash = hashlib.sha256(source_bytes).hexdigest()
          expected_hash = os.environ["DAY3_SOURCE_SHA256"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Day 3 runtime source changed: {actual_hash} != {expected_hash}"
              )

          source = source_bytes.decode("utf-8")
          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 cloned Day 1 cell blocks, found {len(cells)}"
              )

          shell = InteractiveShell.instance()
          shell.autoawait = True
          shell.user_ns["__name__"] = "__main__"

          for index, cell in enumerate(cells, 1):
              label = next(
                  (
                      line.removeprefix("# ").strip()
                      for line in cell.splitlines()
                      if re.search(r"\bCELL\s+\d+[A-Za-z]?\b", line)
                  ),
                  "Notebook metadata",
              )
              print(
                  f"::group::Day 3 block {index:02d}/33 — {label}",
                  flush=True,
              )
              try:
                  result = shell.run_cell(cell, store_history=False, silent=False)
                  if not result.success:
                      raise RuntimeError(f"Day 3 block {index} failed: {label}")
              finally:
                  print("::endgroup::", flush=True)

          print("Exact Day 1 video clone executed as Day 3: PASS")
          PY


