.d3ChipTop{height:150px;display:flex;align-items:center;gap:22px}.d3ChipIconWrap{width:146px;height:146px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.05);overflow:hidden}.d3ChipIcon{width:138px;height:138px;object-fit:contain}.d3ChipName{font-size:35px;font-weight:1000;line-height:1.02;color:#fff}.d3ChipShort{margin-top:10px;font:1000 22px Arial;letter-spacing:5px;color:#F5C518}
.d3ChipCounter{margin-top:16px;display:flex;align-items:end;justify-content:space-between}.d3ChipPct{font-size:68px;line-height:.9;font-weight:1000;color:#00D4FF}.d3ChipCounter small{font:1000 16px Arial;letter-spacing:3px;color:#99adc6}.d3ChipManagers{margin-top:17px;font:1000 29px Arial;color:#fff}.d3ChipManagers span{font-size:17px;color:#95a9c1;text-transform:uppercase;letter-spacing:1.8px}
.d3ChipProgress{height:15px;border-radius:999px;margin-top:20px;background:rgba(255,255,255,.08);overflow:hidden}.d3ChipProgressFill{height:100%;width:100%;transform-origin:left center;transform:scaleX(var(--target));border-radius:999px;background:linear-gradient(90deg,#00D4FF,#F5C518)}
