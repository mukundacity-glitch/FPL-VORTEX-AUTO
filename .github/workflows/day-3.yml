_D3_DESK_EDITORIAL = (
    ("BUY",  "Cole Palmer"),
    ("BUY",  "Morgan Rogers"),
    ("BUY",  "Cody Gakpo"),
    ("HOLD", "Erling Haaland"),
    ("HOLD", "João Pedro"),
    ("HOLD", "Bryan Mbeumo"),
    ("SELL", "Bruno Fernandes"),
    ("SELL", "Dominik Szoboszlai"),
