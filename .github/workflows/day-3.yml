          <div class="agenda-card v3-4"><div class="agendaNum">04</div><div><div class="agenda-title">MY GAMEWEEK PLAN</div><div class="agenda-sub">TRANSFERS • STARTING ELEVEN • STRUCTURE</div></div></div>
          <div class="agenda-card v3-5"><div class="agendaNum">05</div><div><div class="agenda-title">BENCHING DILEMMA</div><div class="agenda-sub">WHO STARTS • WHO SITS • AUTOSUB RISK</div></div></div>
          <div class="agenda-card v3-6"><div class="agendaNum">06</div><div><div class="agenda-title">CHIP STRATEGY</div><div class="agenda-sub">FREE HIT • WILDCARD • TRIPLE CAPTAIN • BENCH BOOST</div></div></div>
          <div class="agenda-card v3-7"><div class="agendaNum">07</div><div><div class="agenda-title">VORTEX CAPTAIN</div><div class="agenda-sub">FINAL CAPTAINCY VERDICT</div></div></div>
          </div></section>
          </main>$results_strip<footer class="footer"><div class="footerLeft"><strong>FPL VORTEX</strong> &nbsp;|&nbsp; GAMEWEEK $gw</div><div class="footerSocial">$social</div><div class="footerRight"><span class="updated">UPDATED: $updated</span><span class="season">2026/27 SEASON</span></div></footer></div></body></html>''').substitute(style=STYLE,logo=vortex_logo_html,gw=int(NEXT_GW),social=SOCIAL,updated=str(VX_FOOTER_UPDATED_DATE),results_strip=LATEST_GW_REVIEW_STRIP)
          
          OUTRO = Template"""
