    + 0.08 * _d3_bench_norm(_d3_bench_pool["form"])
    + 0.07 * _d3_bench_norm(_d3_bench_pool["underlying"])
    + 0.05 * _d3_bench_pool["home_share"].clip(0.0, 1.0)
    + 0.04 * _d3_bench_pool["set_piece_signal"]
    + 0.04 * _d3_bench_pool["availability_probability"]
