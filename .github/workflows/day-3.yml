        _rest_segments = _d3_plan_segments[2:]
        _current_rest = sum(float(seg["duration"]) for seg in _rest_segments)
        _d3_speed_factor = max(
            0.72,
            min(1.35, _d3_speed_factor * (_current_rest / _target_rest)),
        )
        for _seg in _rest_segments:
            await _d3_plan_synth(_seg, speed_factor=_d3_speed_factor)
        _d3_plan_timeline = _d3_rebuild_plan_timeline()

