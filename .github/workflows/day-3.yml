          .agendaList{min-height:0;flex:1;display:flex;flex-direction:column}
          .day2List{gap:16px}.day3List{gap:12px}
          .agenda-card{min-width:0;border-radius:25px;display:grid;grid-template-columns:122px minmax(0,1fr);align-items:center;padding:16px 25px;background:linear-gradient(110deg,rgba(10,32,54,.985),rgba(4,17,31,.99));border:2px solid rgba(255,212,71,.34);box-shadow:0 16px 40px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden}
          .day2List .agenda-card{height:214px}.day3List .agenda-card{height:150px;border-color:rgba(53,230,255,.32)}
          .agenda-card:nth-child(even){border-color:rgba(53,230,255,.43)}.day3List .agenda-card:nth-child(even){border-color:rgba(255,212,71,.34)}
          .agendaNum{font-size:58px;line-height:1;font-weight:1000;color:#ffd447;opacity:.98;letter-spacing:-2px}
          .day3List .agendaNum{color:#35e6ff}
          .agenda-title{font-size:39px;line-height:1.02;font-weight:1000;letter-spacing:1.2px;color:#fff;white-space:normal}
          .day3List .agenda-title{font-size:35px}
          .agenda-sub{margin-top:10px;font-size:24px;line-height:1.12;font-weight:900;letter-spacing:1.15px;color:#9fc2d5;white-space:normal}
          .day3List .agenda-sub{margin-top:7px;font-size:21px}
          """
