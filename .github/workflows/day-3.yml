# ============================================================
# DAY 3_3 ONLY — PROJECTED GOALS + CLEAN SHEET ODDS / DEFCON
# Two full-page model slides. Existing VORTEX header/footer/template is reused.
# ============================================================

from html import escape as _d3_escape
from zoneinfo import ZoneInfo as _D3ZoneInfo

_D3_REQUIRED_PROJ = {
    "team_id", "team", "team_short", "badge",
    "gw1_opponent", "gw1_opponent_ids", "gw1_xg", "gw1_cs",
