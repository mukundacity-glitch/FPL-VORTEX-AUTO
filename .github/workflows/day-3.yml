          _day3_rebuild_engine = r'''
    # ------------------------------------------------------------
    # FULL-SQUAD REBUILD ENGINE — used by 5C FREE HIT / 5D WILDCARD
    # No player names or model values are hard-coded.
    # ------------------------------------------------------------
    if "_vx_phase11_best_lineup" not in globals():
        raise RuntimeError("MY PLAN rebuild requires the Phase-11 legal-lineup optimiser")

    _d3_rebuild_base = phase11_current_squad_state.copy()
    _d3_rebuild_pool = phase11_player_decision_pool.copy()
    if len(_d3_rebuild_base) != 15:
        raise RuntimeError(
            f"MY PLAN rebuild requires exactly 15 current players, found {len(_d3_rebuild_base)}"
        )

    def _d3_rebuild_num(value, default=0.0):
        value = pd.to_numeric(value, errors="coerce")
        return float(value) if pd.notna(value) else float(default)

    _required_rebuild_cols = {"player_id","team_id","position","price","final_gameweek_xpts"}
    _missing_rebuild_cols = sorted(_required_rebuild_cols - set(_d3_rebuild_pool.columns))
    if _missing_rebuild_cols:
        raise RuntimeError(
            "MY PLAN rebuild pool is missing: " + ", ".join(_missing_rebuild_cols)
        )

    for _frame in (_d3_rebuild_base, _d3_rebuild_pool):
        for _col in ("player_id","team_id","price","final_gameweek_xpts"):
            _frame[_col] = pd.to_numeric(_frame[_col], errors="coerce")
        if "phase11_weighted_horizon_xpts" not in _frame.columns:
            _frame["phase11_weighted_horizon_xpts"] = np.nan
        _frame["phase11_weighted_horizon_xpts"] = pd.to_numeric(
            _frame["phase11_weighted_horizon_xpts"], errors="coerce"
        )

    _d3_rebuild_base = _d3_rebuild_base.dropna(
        subset=["player_id","team_id","price","final_gameweek_xpts"]
    ).copy()
    _d3_rebuild_pool = _d3_rebuild_pool.dropna(
        subset=["player_id","team_id","price","final_gameweek_xpts"]
    ).copy()
    _d3_rebuild_base["player_id"] = _d3_rebuild_base["player_id"].astype(int)
    _d3_rebuild_base["team_id"] = _d3_rebuild_base["team_id"].astype(int)
    _d3_rebuild_pool["player_id"] = _d3_rebuild_pool["player_id"].astype(int)
    _d3_rebuild_pool["team_id"] = _d3_rebuild_pool["team_id"].astype(int)
    _d3_rebuild_base["position"] = (
        _d3_rebuild_base["position"].astype(str).str.upper().replace({"GKP":"GK"})
    )
    _d3_rebuild_pool["position"] = (
        _d3_rebuild_pool["position"].astype(str).str.upper().replace({"GKP":"GK"})
    )
    _d3_rebuild_pool = _d3_rebuild_pool.drop_duplicates("player_id").copy()

    if "selling_price" not in _d3_rebuild_base.columns:
        _d3_rebuild_base["selling_price"] = _d3_rebuild_base["price"]
    _d3_rebuild_base["selling_price"] = pd.to_numeric(
        _d3_rebuild_base["selling_price"], errors="coerce"
    ).fillna(_d3_rebuild_base["price"])
    _d3_rebuild_bank = _d3_rebuild_num(globals().get("PHASE11_BANK"), 0.0)
    _d3_rebuild_budget = (
        float(_d3_rebuild_base["selling_price"].sum()) + float(_d3_rebuild_bank)
    )

    _d3_rebuild_mode = "__REBUILD_MODE__"
    _d3_rebuild_weight_sum = (
        float(sum(float(v) for v in globals().get("_gw_weights", {}).values()))
        if isinstance(globals().get("_gw_weights"), dict) and globals().get("_gw_weights")
        else 1.0
    )
    _d3_rebuild_pool["_horizon_avg"] = (
        pd.to_numeric(
            _d3_rebuild_pool["phase11_weighted_horizon_xpts"], errors="coerce"
        ) / max(1e-9, _d3_rebuild_weight_sum)
    )
    _d3_rebuild_pool["_horizon_avg"] = _d3_rebuild_pool["_horizon_avg"].fillna(
        _d3_rebuild_pool["final_gameweek_xpts"]
    )
    if _d3_rebuild_mode == "GW":
        _d3_rebuild_pool["_plan_utility"] = (
            0.92 * _d3_rebuild_pool["final_gameweek_xpts"]
            + 0.08 * _d3_rebuild_pool["_horizon_avg"]
        )
    else:
        _d3_rebuild_pool["_plan_utility"] = (
            0.25 * _d3_rebuild_pool["final_gameweek_xpts"]
            + 0.75 * _d3_rebuild_pool["_horizon_avg"]
        )

    _d3_rebuild_pool = _d3_rebuild_pool.loc[
        _d3_rebuild_pool["position"].isin(["GK","DEF","MID","FWD"])
    ].copy()
    if "decision_pool_ready" in _d3_rebuild_pool.columns:
        _ready_mask = _d3_rebuild_pool["decision_pool_ready"].fillna(False).astype(bool)
        _current_mask = _d3_rebuild_pool["player_id"].isin(
            set(_d3_rebuild_base["player_id"].astype(int))
        )
        _d3_rebuild_pool = _d3_rebuild_pool.loc[
            _ready_mask | _current_mask
        ].copy()

    _rebuild_market = players[[
        "id","transfers_in_event","transfers_out_event"
    ]].copy() if {
        "id","transfers_in_event","transfers_out_event"
    }.issubset(players.columns) else pd.DataFrame()
    _rebuild_market_net = {}
    if not _rebuild_market.empty:
        _rebuild_market["id"] = pd.to_numeric(_rebuild_market["id"], errors="coerce")
        _rebuild_market = _rebuild_market.dropna(subset=["id"]).copy()
        _rebuild_market["id"] = _rebuild_market["id"].astype(int)
        _rebuild_market["net_transfers"] = (
            pd.to_numeric(_rebuild_market["transfers_in_event"], errors="coerce").fillna(0)
            - pd.to_numeric(_rebuild_market["transfers_out_event"], errors="coerce").fillna(0)
        )
        _rebuild_market_net = _rebuild_market.set_index("id")["net_transfers"].to_dict()
    _d3_rebuild_pool["net_transfers"] = _d3_rebuild_pool["player_id"].map(
        lambda pid: float(_rebuild_market_net.get(int(pid),0.0))
    )

    _rebuild_caps = {"GK":10,"DEF":24,"MID":24,"FWD":16}
    _rebuild_candidates = {}
    _rebuild_candidate_rows = []
    for _pos,_cap in _rebuild_caps.items():
        _grp = _d3_rebuild_pool.loc[
            _d3_rebuild_pool["position"].eq(_pos)
        ].sort_values(
            ["_plan_utility","final_gameweek_xpts","net_transfers","player_name"],
            ascending=[False,False,False,True],
            na_position="last",
        ).head(int(_cap)).reset_index(drop=True)
        if len(_grp) < {"GK":2,"DEF":5,"MID":5,"FWD":3}[_pos]:
            raise RuntimeError(
                f"MY PLAN rebuild has too few {_pos} candidates: {len(_grp)}"
            )
        _rebuild_candidates[_pos] = _grp
        for _,_row in _grp.iterrows():
            _rebuild_candidate_rows.append({
                "position":_pos,
                "player_id":int(_row["player_id"]),
                "player_name":str(_row.get("player_name") or ""),
                "price":round(float(_row["price"]),2),
                "xpts":round(float(_row["final_gameweek_xpts"]),3),
                "horizon":round(float(_row["_horizon_avg"]),3),
                "net_transfers":int(round(float(_row.get("net_transfers",0) or 0))),
            })
    (Path(TIMING) / "__REBUILD_PREFIX___candidates.json").write_text(
        _d3_json.dumps(_rebuild_candidate_rows, indent=2, ensure_ascii=False),
        encoding="utf-8",
    )

    def _d3_rebuild_validate(frame):
        if len(frame) != 15 or frame["player_id"].duplicated().any():
            return False
        counts = frame["position"].value_counts().to_dict()
        if counts != {"GK":2,"DEF":5,"MID":5,"FWD":3}:
            return False
        club_counts = frame.groupby("team_id").size()
        if not club_counts.empty and int(club_counts.max()) > 3:
            return False
        if float(frame["price"].sum()) > float(_d3_rebuild_budget) + 1e-8:
            return False
        return True

    def _d3_rebuild_exact(frame):
        if not _d3_rebuild_validate(frame):
            return None
        xi,bench = _vx_phase11_best_lineup(frame, "final_gameweek_xpts")
        if len(xi) != 11 or len(bench) != 4:
            return None
        cap_rank = xi.sort_values(
            ["final_gameweek_xpts","phase11_weighted_horizon_xpts"],
            ascending=[False,False],
            na_position="last",
        ).reset_index(drop=True)
        cap = cap_rank.iloc[0]
        gw_score = float(pd.to_numeric(
            xi["final_gameweek_xpts"], errors="coerce"
        ).fillna(0).sum()) + float(cap["final_gameweek_xpts"])
        bench_score = float(pd.to_numeric(
            bench["final_gameweek_xpts"], errors="coerce"
        ).fillna(0).sum())
        horizon_score = float(pd.to_numeric(
            frame["_plan_utility"], errors="coerce"
        ).fillna(0).sum())
        objective = (
            gw_score + 0.08 * bench_score
            if _d3_rebuild_mode == "GW"
            else horizon_score + 0.10 * gw_score
        )
        return {
            "squad":frame.copy(),
            "xi":xi.copy(),
            "bench":bench.copy(),
            "captain_id":int(cap["player_id"]),
            "vice_id":int(cap_rank.iloc[1]["player_id"]),
            "gw_score":float(gw_score),
            "bench_score":float(bench_score),
            "objective":float(objective),
        }

    _rebuild_selection = str(
        globals().get("MY_PLAN_REBUILD_SELECTION","AUTO MODEL")
    ).upper()
    if _rebuild_selection.startswith("MANUAL"):
        _parts = [
            part for part in re.split(
                r"[,;\s]+",
                str(globals().get("MY_PLAN_REBUILD_PLAYER_IDS","") or "").strip()
            )
            if part
        ]
        try:
            _manual_ids = [int(part) for part in _parts]
        except Exception as exc:
            raise ValueError("MY_PLAN_REBUILD_PLAYER_IDS contains a non-integer ID") from exc
        if len(_manual_ids) != 15 or len(set(_manual_ids)) != 15:
            raise ValueError(
                "MY_PLAN_REBUILD_PLAYER_IDS must contain exactly 15 unique official FPL IDs"
            )
        _manual_frame = _d3_rebuild_pool.loc[
            _d3_rebuild_pool["player_id"].isin(_manual_ids)
        ].copy()
        if set(_manual_frame["player_id"].astype(int)) != set(_manual_ids):
            missing = sorted(set(_manual_ids)-set(_manual_frame["player_id"].astype(int)))
            raise ValueError(f"MY PLAN rebuild manual IDs are not model-ready: {missing}")
        _chosen_rebuild = _d3_rebuild_exact(_manual_frame)
        if _chosen_rebuild is None:
            raise ValueError(
                "MY PLAN rebuild manual final fifteen is illegal for budget/position/club rules"
            )
    else:
        _sequence = ["GK","GK"] + ["DEF"]*5 + ["MID"]*5 + ["FWD"]*3
        _beam = [{
            "ids":tuple(),
            "rows":[],
            "cost":0.0,
            "utility":0.0,
            "clubs":{},
            "last":{"GK":-1,"DEF":-1,"MID":-1,"FWD":-1},
        }]
        _beam_width = 700
        for _pos in _sequence:
            _generated = {}
            _grp = _rebuild_candidates[_pos]
            for _state in _beam:
                for _rank,_row in _grp.iterrows():
                    _rank = int(_rank)
                    if _rank <= int(_state["last"][_pos]):
                        continue
                    _pid = int(_row["player_id"])
                    if _pid in _state["ids"]:
                        continue
                    _tid = int(_row["team_id"])
                    if int(_state["clubs"].get(_tid,0)) >= 3:
                        continue
                    _cost = float(_state["cost"]) + float(_row["price"])
                    if _cost > float(_d3_rebuild_budget) + 1e-8:
                        continue
                    _clubs = dict(_state["clubs"])
                    _clubs[_tid] = int(_clubs.get(_tid,0)) + 1
                    _last = dict(_state["last"])
                    _last[_pos] = _rank
                    _ids = tuple(sorted(_state["ids"] + (_pid,)))
                    _next = {
                        "ids":_ids,
                        "rows":_state["rows"]+[_row.copy()],
                        "cost":_cost,
                        "utility":float(_state["utility"])+float(_row["_plan_utility"]),
                        "clubs":_clubs,
                        "last":_last,
                    }
                    _old = _generated.get(_ids)
                    if _old is None or _next["utility"] > _old["utility"]:
                        _generated[_ids] = _next
            if not _generated:
                raise RuntimeError(
                    f"MY PLAN rebuild search exhausted while selecting {_pos}"
                )
