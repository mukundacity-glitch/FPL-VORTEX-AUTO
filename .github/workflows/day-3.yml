        name for name in _d3_plan5a_required if name not in globals()
    ]
    if _d3_plan5a_missing:
        raise RuntimeError(
            "Day 3_3 MY PLAN 5A missing upstream objects: "
            + ", ".join(_d3_plan5a_missing)
        )

    _d3_squad = phase11_current_squad_state.copy()
    _d3_xi = phase11_recommended_lineup.copy()
    _d3_bench = phase11_bench_order.copy()
    _d3_pool = phase11_player_decision_pool.copy()

    if len(_d3_squad) != 15:
        raise RuntimeError(
            f"MY PLAN 5A requires exactly 15 current players, found {len(_d3_squad)}. "
            "Use MY_PLAN_TEAM_SOURCE and supply the current squad before rendering."
        )
    if len(_d3_xi) != 11 or len(_d3_bench) != 4:
        raise RuntimeError(
            f"MY PLAN 5A requires an optimized 11 + 4 bench; "
            f"found XI={len(_d3_xi)}, bench={len(_d3_bench)}"
        )
    if _d3_squad["player_id"].duplicated().any():
        raise RuntimeError("MY PLAN 5A current squad contains duplicate player IDs")

    _d3_pool["player_id"] = pd.to_numeric(
        _d3_pool["player_id"], errors="coerce"
    )
    _d3_pool = _d3_pool.dropna(subset=["player_id"]).copy()
    _d3_pool["player_id"] = _d3_pool["player_id"].astype(int)
    _d3_pool_by_id = _d3_pool.drop_duplicates("player_id").set_index("player_id")

    _d3_xi_ids = [int(x) for x in _d3_xi["player_id"].tolist()]
    _d3_bench = _d3_bench.sort_values(
        "bench_order" if "bench_order" in _d3_bench.columns else "player_id"
    ).reset_index(drop=True)
    _d3_bench_ids = [int(x) for x in _d3_bench["player_id"].tolist()]
    if set(_d3_xi_ids) | set(_d3_bench_ids) != set(
        _d3_squad["player_id"].astype(int).tolist()
    ):
        raise RuntimeError("MY PLAN 5A optimized XI/bench does not match the current 15")

    _d3_cap_raw = (
        (PHASE11_BEST_CAPTAIN or {}).get("player_id")
        if isinstance(PHASE11_BEST_CAPTAIN, dict) else 0
    )
    _d3_vice_raw = (
        (PHASE11_BEST_VICE or {}).get("player_id")
        if isinstance(PHASE11_BEST_VICE, dict) else 0
    )
    _d3_cap_id = int(_d3_cap_raw or 0)
    _d3_vice_id = int(_d3_vice_raw or 0)
    if _d3_cap_id not in _d3_xi_ids:
        _d3_cap_id = int(
            _d3_xi.sort_values(
                "final_gameweek_xpts", ascending=False
            ).iloc[0]["player_id"]
        )
    if _d3_vice_id not in _d3_xi_ids or _d3_vice_id == _d3_cap_id:
        _d3_vice_candidates = [
            pid for pid in _d3_xi.sort_values(
                "final_gameweek_xpts", ascending=False
            )["player_id"].astype(int).tolist()
            if pid != _d3_cap_id
        ]
        _d3_vice_id = int(_d3_vice_candidates[0])

    _d3_boot_elements = globals().get("review_elements") or {}
    _d3_boot_teams = globals().get("review_teams") or {}
    if not _d3_boot_elements or not _d3_boot_teams:
        _d3_boot = (
