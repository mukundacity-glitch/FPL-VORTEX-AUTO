        price = _d3_plan_number(e.get("now_cost")) / 10.0
        ownership = _d3_plan_number(e.get("selected_by_percent"))
        captain = pid == _d3_cap_id
        vice = pid == _d3_vice_id
        multiplier = 0 if bench else (2 if captain else 1)
        photo = str(resolve_player_photo(e) or "")
        badge = str((team_meta_by_short.get(team_short, {}) or {}).get("badge", "") or "")

        first = str(e.get("first_name", "") or "")
        second = str(e.get("second_name", "") or "")
        web_name = str(e.get("web_name", row.get("player_name", f"PLAYER {pid}")) or "")
        full_name = f"{first} {second}".strip() or web_name
        position_label = _POSITION_LABEL.get(pos, pos or "PLAYER")

        display_stats = [
