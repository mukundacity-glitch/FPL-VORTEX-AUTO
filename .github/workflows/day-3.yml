# -----------------------------
# SLIDE 4 — TRANSFER DECISION DESK
# Same Projected Goals scene_template/header/footer shell.
# BUY/HOLD/SELL names and facts are selected dynamically from VORTEX math + official FPL market data.
# -----------------------------
def _d3_desk_num(value, default=0.0):
    value = pd.to_numeric(value, errors="coerce")
    return float(value) if pd.notna(value) else float(default)

def _d3_desk_flow(value):
    value = int(round(float(value)))
    if value > 0:
        return f"+{value:,}"
    if value < 0:
        return f"-{abs(value):,}"
    return "0"

# Current-GW player model + official FPL market snapshot.
_d3_desk_model = _d3_short_agg.drop_duplicates("player_id", keep="last").copy()
_d3_desk_model["player_id"] = pd.to_numeric(
    _d3_desk_model["player_id"], errors="coerce"
)
_d3_desk_model = _d3_desk_model.dropna(subset=["player_id"]).copy()
_d3_desk_model["player_id"] = _d3_desk_model["player_id"].astype(int)

_d3_market_required = {
    "id", "team", "position", "price", "selected_by_percent",
    "transfers_in_event", "transfers_out_event",
}
_d3_market_missing = sorted(_d3_market_required - set(players.columns))
if _d3_market_missing:
    raise RuntimeError(
        f"Day 3_3 Transfer Desk missing official FPL market fields: {_d3_market_missing}"
    )

_d3_market = players[[
    "id", "team", "position", "price", "selected_by_percent",
    "transfers_in_event", "transfers_out_event",
]].copy().rename(columns={
    "id": "player_id",
    "team": "fpl_team_id",
    "position": "fpl_position",
    "price": "fpl_price",
})
_d3_market["player_id"] = pd.to_numeric(_d3_market["player_id"], errors="coerce")
_d3_market = _d3_market.dropna(subset=["player_id"]).copy()
_d3_market["player_id"] = _d3_market["player_id"].astype(int)
for _col in (
    "selected_by_percent", "transfers_in_event", "transfers_out_event",
    "fpl_price",
):
    _d3_market[_col] = pd.to_numeric(_d3_market[_col], errors="coerce").fillna(0.0)
_d3_market["net_transfers"] = (
    _d3_market["transfers_in_event"] - _d3_market["transfers_out_event"]
)
_d3_market["market_activity"] = (
    _d3_market["transfers_in_event"] + _d3_market["transfers_out_event"]
)
_d3_market["market_momentum"] = np.where(
    _d3_market["market_activity"].gt(0),
    _d3_market["net_transfers"] / _d3_market["market_activity"],
    0.0,
)

_d3_desk_model = _d3_desk_model.merge(
    _d3_market,
    on="player_id",
    how="left",
    validate="one_to_one",
)
for _col in (
    "selected_by_percent", "transfers_in_event", "transfers_out_event",
    "net_transfers", "market_activity", "market_momentum",
):
    _d3_desk_model[_col] = pd.to_numeric(
        _d3_desk_model[_col], errors="coerce"
    ).fillna(0.0)

# Pull the deeper Phase-11 horizon/model fields when available.
_d3_phase11_pool = globals().get("phase11_player_decision_pool")
if isinstance(_d3_phase11_pool, pd.DataFrame) and not _d3_phase11_pool.empty:
    _p11_cols = [
        col for col in (
            "player_id", "final_gameweek_xpts", "next_3_xpts", "next_5_xpts",
            "phase11_weighted_horizon_xpts", "player_model_confidence",
            "decision_available", "decision_pool_ready",
        )
        if col in _d3_phase11_pool.columns
    ]
    if "player_id" in _p11_cols:
        _p11 = _d3_phase11_pool[_p11_cols].drop_duplicates(
            "player_id", keep="last"
        ).copy()
        _p11["player_id"] = pd.to_numeric(_p11["player_id"], errors="coerce")
        _p11 = _p11.dropna(subset=["player_id"]).copy()
        _p11["player_id"] = _p11["player_id"].astype(int)
        _d3_desk_model = _d3_desk_model.merge(
            _p11, on="player_id", how="left", validate="one_to_one"
        )

for _col in (
    "final_gameweek_xpts", "next_3_xpts", "next_5_xpts",
    "phase11_weighted_horizon_xpts", "player_model_confidence",
):
    if _col not in _d3_desk_model.columns:
        _d3_desk_model[_col] = np.nan
    _d3_desk_model[_col] = pd.to_numeric(
        _d3_desk_model[_col], errors="coerce"
    )

_d3_desk_rank = (
    _d3_desk_model.sort_values(
        ["xpts", "xmins", "player_name"],
        ascending=[False, False, True],
        na_position="last",
    )
    .reset_index(drop=True)
)
_d3_desk_rank_map = {
    int(pid): int(rank)
    for rank, pid in enumerate(_d3_desk_rank["player_id"].tolist(), 1)
}

# Player metadata lookup for photos/badges.
_d3_players_by_id = players.drop_duplicates("id", keep="last").copy()
_d3_players_by_id["id"] = pd.to_numeric(
    _d3_players_by_id["id"], errors="coerce"
)
_d3_players_by_id = _d3_players_by_id.dropna(subset=["id"]).copy()
_d3_players_by_id["id"] = _d3_players_by_id["id"].astype(int)
_d3_players_by_id = _d3_players_by_id.set_index("id", drop=False)
_d3_desk_by_id = _d3_desk_model.set_index("player_id", drop=False)

# Current squad is used for HOLD/SELL whenever the approved Phase-11 state exists.
_d3_current_squad = globals().get("phase11_current_squad_state")
if not isinstance(_d3_current_squad, pd.DataFrame):
    _d3_current_squad = pd.DataFrame()
_d3_owned_ids = set()
if not _d3_current_squad.empty and "player_id" in _d3_current_squad.columns:
    _d3_owned_ids = set(
        pd.to_numeric(_d3_current_squad["player_id"], errors="coerce")
        .dropna().astype(int).tolist()
    )

def _d3_desk_unique_take(frame, count, used_ids):
    if not isinstance(frame, pd.DataFrame) or frame.empty:
        return []
    out = []
    for _, row in frame.iterrows():
        pid = int(row["player_id"])
        if pid in used_ids:
            continue
        out.append(row.to_dict())
        used_ids.add(pid)
        if len(out) >= int(count):
            break
    return out

# BUY: Phase-11 legal incoming-transfer utility first; FPL market trend breaks ties.
_d3_buy_pool = pd.DataFrame()
_p11_buy = globals().get("phase11_buy_candidates")
if isinstance(_p11_buy, pd.DataFrame) and not _p11_buy.empty:
    _d3_buy_pool = _p11_buy.copy()
    if "in_player_id" in _d3_buy_pool.columns:
        _d3_buy_pool["player_id"] = pd.to_numeric(
            _d3_buy_pool["in_player_id"], errors="coerce"
        )
    _d3_buy_pool = _d3_buy_pool.dropna(subset=["player_id"]).copy()
    _d3_buy_pool["player_id"] = _d3_buy_pool["player_id"].astype(int)
    _d3_buy_pool = _d3_buy_pool.merge(
        _d3_desk_model,
        on="player_id",
        how="inner",
        suffixes=("_p11", ""),
    )
    _d3_buy_pool["_buy_verdict"] = (
        _d3_buy_pool.get("verdict", "").astype(str).str.upper().eq("BUY")
        if "verdict" in _d3_buy_pool.columns else False
    )
    _d3_buy_pool["_actionable"] = (
        _d3_buy_pool.get("actionable", False).fillna(False).astype(bool)
        if "actionable" in _d3_buy_pool.columns else False
    )
    for _col in ("risk_adjusted_utility", "gain_next_5", "gain_next_gw"):
        if _col not in _d3_buy_pool.columns:
            _d3_buy_pool[_col] = np.nan
        _d3_buy_pool[_col] = pd.to_numeric(_d3_buy_pool[_col], errors="coerce")
    _d3_buy_pool = _d3_buy_pool.sort_values(
        [
            "_buy_verdict", "_actionable", "risk_adjusted_utility",
            "gain_next_5", "xpts", "net_transfers",
        ],
        ascending=[False, False, False, False, False, False],
        na_position="last",
    )

# Dynamic fallback: strongest model-ready non-owned players; market trend is final tie-break.
_d3_global_buy = _d3_desk_model.loc[
    ~_d3_desk_model["player_id"].isin(_d3_owned_ids)
].copy()
_d3_global_buy = _d3_global_buy.loc[
    pd.to_numeric(_d3_global_buy["xmins"], errors="coerce").ge(
        DAY3_SHORTLIST_MIN_XMINS
    )
    & pd.to_numeric(
        _d3_global_buy["availability_probability"], errors="coerce"
    ).fillna(0.0).ge(0.50)
].sort_values(
    [
        "xpts", "phase11_weighted_horizon_xpts", "next_5_xpts",
        "market_momentum", "net_transfers", "value",
    ],
    ascending=[False, False, False, False, False, False],
    na_position="last",
)

# SELL/HOLD: use the Phase-11 current-squad replacement verdicts/edge when available.
_d3_owned_decisions = pd.DataFrame()
_p11_sell = globals().get("phase11_sell_candidates")
if (
    isinstance(_p11_sell, pd.DataFrame)
    and not _p11_sell.empty
    and _d3_owned_ids
):
    _d3_owned_decisions = _p11_sell.copy()
    _d3_owned_decisions["player_id"] = pd.to_numeric(
        _d3_owned_decisions["player_id"], errors="coerce"
    )
    _d3_owned_decisions = _d3_owned_decisions.dropna(subset=["player_id"]).copy()
    _d3_owned_decisions["player_id"] = _d3_owned_decisions["player_id"].astype(int)
    _d3_owned_decisions = _d3_owned_decisions.merge(
        _d3_desk_model,
        on="player_id",
        how="inner",
        suffixes=("_p11", ""),
    )
    for _col in ("decision_utility", "gain_next_5"):
        if _col not in _d3_owned_decisions.columns:
            _d3_owned_decisions[_col] = np.nan
        _d3_owned_decisions[_col] = pd.to_numeric(
            _d3_owned_decisions[_col], errors="coerce"
        )
    _d3_owned_decisions["_is_sell"] = (
        _d3_owned_decisions.get("verdict", "").astype(str).str.upper().eq("SELL")
        if "verdict" in _d3_owned_decisions.columns else False
    )
    _d3_owned_decisions["_is_hold"] = (
        _d3_owned_decisions.get("verdict", "").astype(str).str.upper().eq("HOLD")
        if "verdict" in _d3_owned_decisions.columns else False
    )

# If no approved squad state exists, derive HOLD/SELL from the global pool without fixed names:
# established/high-ownership assets are classified by model strength + FPL market direction.
if _d3_owned_decisions.empty:
    _eligible = _d3_desk_model.loc[
        pd.to_numeric(_d3_desk_model["xmins"], errors="coerce").gt(0)
    ].copy()
    _ownership_cut = float(
        pd.to_numeric(_eligible["selected_by_percent"], errors="coerce")
        .dropna().quantile(0.60)
    ) if not _eligible.empty else 0.0
    _d3_owned_decisions = _eligible.loc[
        _eligible["selected_by_percent"].ge(_ownership_cut)
    ].copy()
    _d3_owned_decisions["decision_utility"] = np.nan
    _d3_owned_decisions["gain_next_5"] = np.nan
    _d3_owned_decisions["_is_sell"] = False
    _d3_owned_decisions["_is_hold"] = False
    DAY3_TRANSFER_DESK_SELECTION_MODE = "GLOBAL_MODEL_PLUS_FPL_MARKET"
else:
    DAY3_TRANSFER_DESK_SELECTION_MODE = (
        "PHASE11_CURRENT_SQUAD_PLUS_FPL_MARKET"
        if bool(globals().get("PHASE11_SQUAD_STATE_FRESH", False))
        else "PHASE11_VISIBLE_SQUAD_BASELINE_PLUS_FPL_MARKET"
    )

_d3_sell_pool = _d3_owned_decisions.sort_values(
    [
        "_is_sell", "decision_utility", "gain_next_5",
        "availability_probability", "xpts", "market_momentum", "net_transfers",
    ],
    ascending=[False, False, False, True, True, True, True],
    na_position="last",
)
_d3_hold_pool = _d3_owned_decisions.sort_values(
    [
        "_is_hold", "xpts", "phase11_weighted_horizon_xpts",
        "next_5_xpts", "availability_probability",
        "market_momentum", "net_transfers",
    ],
    ascending=[False, False, False, False, False, False, False],
    na_position="last",
)

_used_ids = set()
_d3_buy_rows = _d3_desk_unique_take(_d3_buy_pool, 3, _used_ids)
if len(_d3_buy_rows) < 3:
    _d3_buy_rows += _d3_desk_unique_take(
        _d3_global_buy, 3 - len(_d3_buy_rows), _used_ids
    )

_d3_sell_rows = _d3_desk_unique_take(_d3_sell_pool, 3, _used_ids)
_d3_hold_rows = _d3_desk_unique_take(_d3_hold_pool, 3, _used_ids)

# If HOLD/SELL were competing for the same owned player, refill from the remaining model pool.
if len(_d3_sell_rows) < 3:
    _d3_sell_rows += _d3_desk_unique_take(
        _d3_owned_decisions.sort_values(
            ["xpts", "xmins", "market_momentum", "net_transfers"],
            ascending=[True, True, True, True],
            na_position="last",
        ),
        3 - len(_d3_sell_rows),
        _used_ids,
    )
if len(_d3_hold_rows) < 3:
    _d3_hold_rows += _d3_desk_unique_take(
        _d3_owned_decisions.sort_values(
            [
                "xpts", "phase11_weighted_horizon_xpts",
                "availability_probability", "market_momentum",
            ],
            ascending=[False, False, False, False],
            na_position="last",
        ),
        3 - len(_d3_hold_rows),
        _used_ids,
    )

# Last-resort global refill remains model/market driven and never inserts a named player.
if len(_d3_sell_rows) < 3:
    _d3_sell_rows += _d3_desk_unique_take(
        _d3_desk_model.sort_values(
            ["xpts", "xmins", "availability_probability", "net_transfers"],
            ascending=[True, True, True, True],
            na_position="last",
        ),
        3 - len(_d3_sell_rows),
        _used_ids,
    )
if len(_d3_hold_rows) < 3:
    _d3_hold_rows += _d3_desk_unique_take(
        _d3_desk_model.sort_values(
            [
                "xpts", "phase11_weighted_horizon_xpts",
                "availability_probability", "selected_by_percent",
            ],
            ascending=[False, False, False, False],
            na_position="last",
        ),
        3 - len(_d3_hold_rows),
        _used_ids,
    )

if not all(len(rows) == 3 for rows in (_d3_buy_rows, _d3_hold_rows, _d3_sell_rows)):
    raise RuntimeError(
        "Day 3_3 Transfer Desk could not derive three unique BUY/HOLD/SELL players "
        "from the current model and FPL market snapshot"
    )

DAY3_TRANSFER_DESK = {"BUY": [], "HOLD": [], "SELL": []}
DAY3_TRANSFER_DESK_ORDER = []
DAY3_TRANSFER_DESK_SEQUENCE = []

def _d3_desk_record(action, row, index):
    pid = int(row["player_id"])
    if pid not in _d3_players_by_id.index or pid not in _d3_desk_by_id.index:
        raise RuntimeError(f"Transfer Desk player {pid} is missing metadata/model data")
    p = _d3_players_by_id.loc[pid]
    m = _d3_desk_by_id.loc[pid]
    team_id = int(p["team"])
    meta = team_meta_by_id.get(team_id, {})
    proj = _d3_proj_by_id.loc[team_id] if team_id in _d3_proj_by_id.index else {}
    opponent = str(
        proj.get("gw1_opponent", "TBD") if hasattr(proj, "get") else "TBD"
    ).upper()
    return {
        "index": int(index),
        "action": str(action),
        "name": str(m.get("player_name") or p.get("web_name") or f"PLAYER {pid}"),
        "player_id": pid,
        "team_id": team_id,
        "team": str(meta.get("short", p.get("team_short", "")) or "").upper(),
        "position": str(p.get("position", m.get("position", "")) or "").upper(),
        "price": _d3_desk_num(p.get("price", m.get("price"))),
        "photo": str(resolve_player_photo(p) or ""),
        "badge": str(meta.get("badge", "") or ""),
        "opponent": opponent,
        "xpts": _d3_desk_num(m.get("xpts")),
        "xmins": _d3_desk_num(m.get("xmins")),
        "availability": 100.0 * _d3_desk_num(m.get("availability_probability")),
        "start_probability": 100.0 * _d3_desk_num(m.get("start_probability")),
        "ownership": _d3_desk_num(m.get("selected_by_percent")),
        "transfers_in": _d3_desk_num(m.get("transfers_in_event")),
        "transfers_out": _d3_desk_num(m.get("transfers_out_event")),
        "net_transfers": _d3_desk_num(m.get("net_transfers")),
        "market_momentum": _d3_desk_num(m.get("market_momentum")),
        "next_5_xpts": _d3_desk_num(m.get("next_5_xpts")),
        "horizon_xpts": _d3_desk_num(m.get("phase11_weighted_horizon_xpts")),
        "decision_utility": _d3_desk_num(row.get("decision_utility", row.get("risk_adjusted_utility", 0.0))),
        "gain_next_5": _d3_desk_num(row.get("gain_next_5", 0.0)),
        "model_rank": int(_d3_desk_rank_map.get(pid, 0)),
        "selection_mode": DAY3_TRANSFER_DESK_SELECTION_MODE,
    }

_index = 0
for _action, _rows in (
    ("BUY", _d3_buy_rows),
    ("HOLD", _d3_hold_rows),
    ("SELL", _d3_sell_rows),
):
    for _row in _rows:
        _record = _d3_desk_record(_action, _row, _index)
        DAY3_TRANSFER_DESK[_action].append(_record)
        DAY3_TRANSFER_DESK_ORDER.append(_record["name"])
        DAY3_TRANSFER_DESK_SEQUENCE.append((_action, _record["name"]))
        _index += 1

if [len(DAY3_TRANSFER_DESK[x]) for x in ("BUY","HOLD","SELL")] != [3,3,3]:
    raise RuntimeError("Transfer Desk must contain exactly three BUY, three HOLD and three SELL players")
if len({r["player_id"] for g in DAY3_TRANSFER_DESK.values() for r in g}) != 9:
    raise RuntimeError("Transfer Desk contains duplicate players")

# Persist the exact dynamic selection so later QA checks narration/ordering without fixed names.
_d3_desk_manifest_path = Path(DATA_DIR) / "transfer_decision_desk.json"
_d3_desk_manifest_path.parent.mkdir(parents=True, exist_ok=True)
_d3_desk_manifest = {
    "gameweek": int(NEXT_GW),
    "selection_mode": DAY3_TRANSFER_DESK_SELECTION_MODE,
    "squad_state_status": str(globals().get("PHASE11_SQUAD_STATE_STATUS", "NOT_AVAILABLE")),
    "market_source": "OFFICIAL_FPL_BOOTSTRAP_STATIC",
    "model_source": "PHASE11_TRANSFER_MATH_WITH_PHASE10_CURRENT_GW_XPTS",
    "rules": {
        "buy": "Phase11 legal incoming utility first; xPts/horizon then FPL market momentum",
        "hold": "current-squad model strength first; FPL market momentum as supporting signal",
        "sell": "Phase11 replacement edge first; weak xPts/minutes and negative FPL market trend support the sell case",
    },
    "players": [
        {
            key: value for key, value in record.items()
            if key not in {"photo", "badge"}
        }
        for action in ("BUY","HOLD","SELL")
        for record in DAY3_TRANSFER_DESK[action]
    ],
}
_d3_desk_manifest_path.write_text(
    json.dumps(_d3_desk_manifest, indent=2, ensure_ascii=False),
    encoding="utf-8",
)

def _d3_desk_short_reason(r):
    if r["action"] == "BUY":
        return f'{r["xpts"]:.1f} xPTS • {r["xmins"]:.0f} xMINS • {r["opponent"]} NEXT'
    if r["action"] == "HOLD":
        return f'{r["availability"]:.0f}% AVAILABLE • {r["xpts"]:.1f} xPTS • HOLD VALUE'
    return f'{r["availability"]:.0f}% AVAILABLE • {r["xmins"]:.0f} xMINS • FLOW {_d3_desk_flow(r["net_transfers"])}'

def _d3_desk_narr(action, index):
    r = DAY3_TRANSFER_DESK[str(action)][int(index)]
    action_line = {
        "BUY": "That combination supports the buy call.",
        "HOLD": "That is enough to justify the hold call.",
        "SELL": "That makes the replacement case worth acting on.",
    }[str(action)]
    return (
        f'{r["name"]}. {r["team"]} face {r["opponent"]} next. '
        f'VORTEX projects {r["xpts"]:.1f} points from {r["xmins"]:.0f} expected minutes '
        f'at £{r["price"]:.1f} million, with {r["availability"]:.0f} percent availability. '
        f'Ownership is {r["ownership"]:.1f} percent and Gameweek transfer balance is '
        f'{_d3_desk_flow(r["net_transfers"])}. {action_line}'
    )

def _d3_desk_photo(r, css):
    src = _d3_escape(str(r.get("photo", "") or ""))
    if src:
        return f'<img class="{css}" src="{src}" alt="">'
    return f'<div class="{css} d3DeskPhotoFallback">{_d3_escape(r["position"])}</div>'

def _d3_desk_badge(r, css):
    src = _d3_escape(str(r.get("badge", "") or ""))
    if src:
        return f'<img class="{css}" src="{src}" alt="">'
    return f'<div class="{css} d3DeskBadgeFallback">{_d3_escape(r["team"][:3])}</div>'

def _d3_desk_popup(r):
    return (
        f'<article class="d3DeskPop {r["action"].lower()}" data-desk-i="{r["index"]}">'
        f'<div class="d3DeskChip">{r["action"]}</div>'
        '<div class="d3DeskPhotoBox">'
        f'{_d3_desk_photo(r, "d3DeskPhoto")}'
        f'{_d3_desk_badge(r, "d3DeskBigBadge")}'
        '</div><div class="d3DeskPopCopy">'
        f'<h2>{_d3_escape(r["name"])}</h2>'
        f'<div class="d3DeskMeta">{_d3_escape(r["team"])} • {_d3_escape(r["position"])} • £{r["price"]:.1f}m</div>'
        f'<div class="d3DeskReason">{_d3_escape(_d3_desk_short_reason(r))}</div>'
        '<div class="d3DeskStats">'
        f'<span><b>{r["xpts"]:.1f}</b>xPTS</span>'
        f'<span><b>{r["xmins"]:.0f}</b>xMINS</span>'
        f'<span><b>{r["ownership"]:.1f}%</b>OWN</span>'
        '</div></div></article>'
    )

def _d3_desk_slot(r):
    return (
        f'<div class="d3DeskSlot {r["action"].lower()}" data-desk-i="{r["index"]}">'
        f'{_d3_desk_photo(r, "d3DeskMiniPhoto")}'
        '<div class="d3DeskSlotCopy">'
        f'<strong>{_d3_escape(r["name"])}</strong>'
        f'<small>{_d3_escape(r["team"])} • {_d3_escape(r["position"])} • £{r["price"]:.1f}m</small>'
        f'<span>{r["xpts"]:.1f} xPTS • {r["xmins"]:.0f} xMINS</span>'
        '</div>'
        f'{_d3_desk_badge(r, "d3DeskMiniBadge")}'
        '</div>'
    )

_d3_desk_popups = "".join(
    _d3_desk_popup(r)
    for action in ("BUY","HOLD","SELL")
    for r in DAY3_TRANSFER_DESK[action]
)
_d3_desk_zones = []
for _action in ("BUY","HOLD","SELL"):
    _slots = "".join(_d3_desk_slot(r) for r in DAY3_TRANSFER_DESK[_action])
    _d3_desk_zones.append(
        f'<section class="d3DeskZone {_action.lower()}">'
        f'<div class="d3DeskZoneHead">{_action}</div>'
        f'<div class="d3DeskSlots">{_slots}</div></section>'
    )

_d3_desk_motion = "".join(
    f'<span class="d3DeskMotion" data-desk-i="{i}"></span>'
    for i in range(9)
)
_d3_desk_left = (
    '<section class="board d3DeskPitch d3DeskLeft">'
    '<div class="d3DeskOpen"><strong>NINE PLAYERS</strong>'
    '<span>THREE CLEAR ACTIONS • LIVE VORTEX DATA</span></div>'
    f'{_d3_desk_popups}{_d3_desk_motion}'
    '<div class="d3DeskClose"><strong>YOUR MOVE.</strong><span>MAKE IT COUNT.</span></div>'
    '</section>'
)
_d3_desk_right = (
    '<section class="board d3DeskPitch d3DeskRight">'
    f'{"".join(_d3_desk_zones)}'
    '</section>'
)

