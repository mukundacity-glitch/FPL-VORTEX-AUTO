        _rebuild_exact_states = []
        for _state in _beam[:350]:
            _frame = pd.DataFrame(_state["rows"]).copy()
            _exact = _d3_rebuild_exact(_frame)
            if _exact is not None:
                _rebuild_exact_states.append(_exact)
        if not _rebuild_exact_states:
            raise RuntimeError("MY PLAN rebuild produced no legal 15-player squad")
