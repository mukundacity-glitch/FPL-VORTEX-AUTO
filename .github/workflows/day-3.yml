              "03_projected_goals": ("four teams to target", "three teams to avoid", "DEFCON"),
          }.items():
              script = str((section_narr.get(key) or {}).get("script") or "")
              lowered = script.lower()
              missing = [phrase for phrase in required_phrases if phrase.lower() not in lowered]
              if missing:
                  raise SystemExit(f"{key} Day 3_3 narration missing: {missing}")
          if "04_clean_sheets" in section_narr:
              raise SystemExit("Duplicate standalone clean-sheet narration survived in Day 3_3")
