    _d3_plan_bench = [
        _d3_plan_player(pid, bench=True, bench_order=index + 1)
        for index, pid in enumerate(_d3_bench_ids)
    ]

    _d3_pos_order = {"GK":0, "DEF":1, "MID":2, "FWD":3}
    _d3_plan_starters = sorted(
        _d3_plan_starters,
        key=lambda p: (_d3_pos_order.get(p["pos"], 9), -float(p["xpts"]), p["name"]),
    )

    _d3_groups = {
        pos:[p for p in _d3_plan_starters if p["pos"] == pos]
        for pos in ("GK","DEF","MID","FWD")
    }
    _d3_ys = {"GK":13.5, "DEF":35.5, "MID":58.2, "FWD":82.0}
    for _pos, _arr in _d3_groups.items():
        _span = 0 if _pos == "GK" else 47 if _pos == "FWD" else 56
        for _i, _p in enumerate(_arr):
            _p["pitch_x"] = (
                50 if len(_arr) == 1
                else 50 - _span / 2 + _span * (_i / (len(_arr) - 1))
            )
            _p["pitch_y"] = _d3_ys[_pos]

    _d3_cap = next(p for p in _d3_plan_starters if p["id"] == _d3_cap_id)
    _d3_vice = next(p for p in _d3_plan_starters if p["id"] == _d3_vice_id)
    _d3_xi_xpts = sum(float(p["xpts"]) for p in _d3_plan_starters)
    _d3_projected_score = _d3_xi_xpts + float(_d3_cap["xpts"])
    _d3_bench_xpts = sum(float(p["xpts"]) for p in _d3_plan_bench)
    _d3_formation = "-".join(
        str(len(_d3_groups[pos])) for pos in ("DEF","MID","FWD")
    )
    _d3_ft = globals().get("PHASE11_FREE_TRANSFERS")
    _d3_ft_text = "—" if _d3_ft is None else str(int(_d3_ft))
    _d3_bank = _d3_plan_number(globals().get("PHASE11_BANK"), 0.0)
    _d3_state = str(globals().get("PHASE11_SQUAD_STATE_STATUS", "UNKNOWN"))

    def _d3_plan_spoken_fixture(p):
        fx = p.get("fixture") or {}
        opp = str(fx.get("opp") or "the next opponent")
        side = str(fx.get("ha") or "")
        return (
            f"{opp} at home" if side == "H"
            else f"{opp} away" if side == "A"
            else opp
        )

    def _d3_plan_player_text(p, bench=False, first_goalkeeper=False):
        name = vx_narration_player(int(p["id"]))
        if first_goalkeeper:
            return (
                f"{name}. I start him in goal. VORTEX projects {p['xpts']:.1f} points "
                f"from {p['xmins']:.0f} expected minutes against {_d3_plan_spoken_fixture(p)}. "
                "In Scenario A I roll the transfer, so he keeps the goalkeeper slot."
            )
        if bench:
            return (
                f"{name}. He stays in the fifteen but starts on my bench. VORTEX projects "
                f"{p['xpts']:.1f} points from {p['xmins']:.0f} expected minutes against "
                f"{_d3_plan_spoken_fixture(p)}. Rolling the transfer means I keep this squad depth, "
                "while the higher projected starters take the active places. He remains useful autosub cover."
            )
        captain_note = (
            " He is also my model captain, so his expected return is counted twice in the projected team score."
            if p["captain"] else
            " He is my vice captain, giving the plan a secure fallback."
            if p["vice"] else ""
        )
        return (
            f"{name}. He starts in my {p['pos']} line. The model projects {p['xpts']:.1f} expected points "
            f"from {p['xmins']:.0f} expected minutes against {_d3_plan_spoken_fixture(p)}. "
            "With no transfer used, this place is earned by the current squad's own expected value, "
            f"minutes security and fixture rather than by forcing a move.{captain_note}"
