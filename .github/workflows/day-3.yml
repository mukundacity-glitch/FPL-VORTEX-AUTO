                  raise SystemExit(f"Day 3_3 Slide 0 output is missing: {required_path}")

          narration = json.loads(narration_path.read_text(encoding="utf-8"))
          intro_script = str((narration.get("00_intro") or {}).get("script") or "")
          intro_script_lower = intro_script.lower()
          agenda_anchors = [
              "expected minutes",
