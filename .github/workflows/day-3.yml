                    pop.style.transform='translateX(0px) translateY(0px) scale('+(0.94+0.06*pin)+')';
                }else{
                    const fly=ease((t-w.move)/(w.settle-w.move));
                    pop.style.opacity=String(1-fly*0.12);
                    pop.style.transform='translateX('+(fly*w.dx)+'px) translateY('+(fly*w.dy)+'px) scale('+(1-0.63*fly)+')';
                }
            }
            if(slot){
                if(t<w.settle){
                    slot.style.opacity="0";
                    slot.style.transform="scale(.88)";
                }else{
                    const ps=ease((t-w.settle)/0.45);
                    slot.style.opacity=String(ps);
                    slot.style.transform='scale('+(0.88+0.12*ps)+')';
                }
            }
        });
    }

