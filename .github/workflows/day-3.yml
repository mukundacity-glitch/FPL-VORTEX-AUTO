name: Day 3_3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-vortex-day-3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_FILE: 1_final_day1.py
  DAY3_OUTPUT_ROOT: /content/drive/MyDrive/FPL_VORTEX/Day_3_3
  DAY3_DRIVE_PATH: FPL_VORTEX/Day_3_3
  DAY1_ASSET_FOLDER_ID: 1h3Loznr5RnsMyh-kUd-zMxEgOf98uFSt
  DAY1_ASSET_DIR: /content/drive/MyDrive/FPL_VORTEX/Assets
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  run-day-3:
    name: Run isolated Day 3 — exact Day 1 video clone
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Prepare isolated Day 3 runtime without changing Day 1 or Day 2
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            "${SOURCE_FILE}" \
            .github/workflows/day-1.yml \
            .github/workflows/day-2.yml \
            vortex/day1_media.py \
            vortex/youtube_studio_package.py \
            vortex/youtube_private_upload.py
          python - <<'PY'
          import ast
          import hashlib
          import os
          import re
          from pathlib import Path

          output_root = Path(os.environ["DAY3_OUTPUT_ROOT"]).resolve()
          expected_root = (
              Path("/content/drive/MyDrive") / os.environ["DAY3_DRIVE_PATH"]
          ).resolve()
          if output_root != expected_root:
              raise SystemExit(
                  f"Unsafe Day 3 output root: {output_root} != {expected_root}"
              )
          folder_name = output_root.name

          runtime_dir = Path(os.environ["RUNNER_TEMP"]) / "day3-runtime"
          runtime_dir.mkdir(parents=True, exist_ok=True)

          def replace_exact(text, old, new, expected_count, label):
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"{label}: expected {expected_count} occurrence(s) of "
                      f"{old!r}, found {actual_count}"
                  )
              return text.replace(old, new)

          source_path = Path(os.environ["SOURCE_FILE"]).resolve()
          source_text = source_path.read_text(encoding="utf-8")
          runtime_source_text = replace_exact(
              source_text,
              "FIRST VIDEO",
              folder_name,
              9,
              "Day 1 output-path isolation",
          )

          # ------------------------------------------------------------
          # DAY 3_3 ONLY — SLIDE 0 / INTRO AGENDA OVERRIDE
          # The repository Day 1 source remains read-only. All edits below
          # exist only inside the temporary Day 3 runtime clone.
          # ------------------------------------------------------------
          def _day3_cell_bounds(text, header):
              header_pos = text.find(header)
              if header_pos < 0:
                  raise SystemExit(f"Day 3 intro patch: missing cell header {header!r}")
              next_match = re.search(
                  r"(?m)^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b",
                  text[header_pos + len(header):],
              )
              end = (
                  header_pos + len(header) + next_match.start()
                  if next_match
                  else len(text)
              )
              return header_pos, end
          
          
          def _day3_replace_range_in_cell(
              text,
              header,
              start_marker,
              end_marker,
              replacement,
              label,
              *,
              end_through_line=False,
          ):
              start, end = _day3_cell_bounds(text, header)
              cell = text[start:end]
              start_count = cell.count(start_marker)
              end_count = cell.count(end_marker)
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"{label}: expected one start/end marker, found "
                      f"start={start_count}, end={end_count}"
                  )
              left = cell.index(start_marker)
              right_start = cell.index(end_marker, left)
              if end_through_line:
                  newline = cell.find("\n", right_start)
                  right = len(cell) if newline < 0 else newline + 1
              else:
                  right = right_start + len(end_marker)
              cell = cell[:left] + replacement + cell[right:]
              return text[:start] + cell + text[end:]
          
          
          _intro_cell = "# CELL 14A — INTRO + OUTRO • BROADCAST MASTER DESIGN"
          _narr_cell = "# CELL 18 — INTRO + FDR + GOALS + CS + OUTRO NARRATION"
