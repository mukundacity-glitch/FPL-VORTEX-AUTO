          )
          
          _new_validation = '''print("✅ Intro layout: Video 2 recap left → Video 3/3 agenda right")
          print("✅ OUTRO HTML:",OUTRO_HTML)
          
          # Day 3_3 Slide 0 contract: no stale Day 1 fixture-board/agenda markup.
          _on_disk_intro = INTRO_HTML.read_text(encoding="utf-8")
          _required_intro_markers = (
