              )
          if 'id="vxFixtureGrid"' in _on_disk_intro:
              raise RuntimeError("Stale Day 1 fixture-board markup survived in Day 3_3 Slide 0.")
          if "bottom:320px" not in _on_disk_intro:
              raise RuntimeError("Day 3_3 centre agenda lost protected clearance above the original bottom strip.")
          if "MY PREVIOUS GAMEWEEK SQUAD • PLAYER BY PLAYER" in _on_disk_intro:
              raise RuntimeError("Stale Day 1 agenda copy survived in Day 3_3 Slide 0.")
          print("✅ Verified Day 3_3 Slide 0 HTML: 5 recap + 7 Video 3/3 cards; original bottom review strip/footer preserved")'''
