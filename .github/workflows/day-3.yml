if not {"id", "code", "short_name", "name"}.issubset(teams.columns):
    raise RuntimeError("Day 3_3 DEFCON slide requires teams id/code/name/short_name")

_d3_team_code_map = (
    teams[["id", "code"]].dropna().assign(
        id=lambda x: pd.to_numeric(x["id"], errors="coerce"),
        code=lambda x: pd.to_numeric(x["code"], errors="coerce"),
    ).dropna().set_index("code")["id"].astype(int).to_dict()
)
_d3_pm["team_id"] = pd.to_numeric(_d3_pm["season_team_code"], errors="coerce").map(_d3_team_code_map)
_d3_pm = _d3_pm.dropna(subset=["team_id"]).copy()
_d3_pm["team_id"] = _d3_pm["team_id"].astype(int)
_d3_pm["dc"] = pd.to_numeric(_d3_pm["defensive_contributions"], errors="coerce").fillna(0.0)
_d3_pm["position"] = _d3_pm["historical_position"].astype(str).str.upper().replace({
    "GOALKEEPER":"GK","DEFENDER":"DEF","MIDFIELDER":"MID","FORWARD":"FWD"
})
_d3_thresholds = {"DEF":10.0, "MID":12.0, "FWD":12.0}
_d3_pm["threshold"] = _d3_pm["position"].map(_d3_thresholds)
_d3_pm["hit"] = (_d3_pm["threshold"].notna() & _d3_pm["dc"].ge(_d3_pm["threshold"])).astype(int)
if "match_date" in _d3_pm.columns:
    _d3_pm["match_date"] = pd.to_datetime(_d3_pm["match_date"], errors="coerce", utc=True)
else:
    _d3_pm["match_date"] = pd.NaT

_d3_team_match = (
    _d3_pm.groupby(["team_id", "match_id"], as_index=False)
    .agg(match_date=("match_date","max"), hits=("hit","sum"), dc=("dc","sum"))
)
_d3_team_match = _d3_team_match.sort_values(["team_id", "match_date", "match_id"])

