def vx_review_short_player_text(p, position_index=0, bench=False):
    name=str(p["name"])
    points=vx_review_points_phrase(p.get("points",0))
    opponent=vx_review_short_opp(p)
    state=str(p.get("review_state") or "FINAL").upper()
    verb="currently has" if state in {"LIVE","PENDING"} else "scored"

    if bench:
        if str(p.get("pos") or "").upper()=="GK":
            return f"Bench goalkeeper {name} {verb} {points} against {opponent}."
        lead="On the bench, " if position_index==0 else ""
        return f"{lead}{name} {verb} {points} against {opponent}."

    pos=str(p.get("pos") or "").upper()
    if pos=="GK":
        return f"In goal, {name} {verb} {points} against {opponent}."
    if pos=="DEF":
        lead="At the back, " if position_index==0 else ""
        return f"{lead}{name} returned {points} against {opponent}."
    if pos=="MID":
        lead="In midfield, " if position_index==0 else ""
        return f"{lead}{name} returned {points} against {opponent}."
    lead="Up front, " if position_index==0 else ""
    return f"{lead}{name} returned {points} against {opponent}."


