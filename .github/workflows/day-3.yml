_d3_short_missing = sorted(_D3_SHORT_REQUIRED - set(_d3_short_src.columns))
if _d3_short_missing:
    raise RuntimeError(
        f"Day 3_3 Final Shortlists missing Phase-10 fields: {_d3_short_missing}"
    )

_d3_short_src = _d3_short_src.loc[
    pd.to_numeric(_d3_short_src["gameweek"], errors="coerce").eq(int(NEXT_GW))
].copy()
if _d3_short_src.empty:
    raise RuntimeError(f"Day 3_3 Final Shortlists has no player rows for GW{int(NEXT_GW)}")

_d3_short_numeric = (
    "price", "expected_minutes", "appearance_probability", "appearance_points",
    "goal_points", "assist_points", "clean_sheet_points", "save_points",
    "penalty_save_points", "defcon_points", "bonus_points",
    "fixture_expected_points",
)
for _col in _d3_short_numeric:
    _d3_short_src[_col] = pd.to_numeric(_d3_short_src[_col], errors="coerce")

_d3_short_src = _d3_short_src.loc[
    _d3_short_src["calculation_status"].astype(str).eq("READY")
].dropna(subset=["player_id", "team_id", "position", "fixture_expected_points"]).copy()
if _d3_short_src.empty:
    raise RuntimeError("Day 3_3 Final Shortlists has no READY Phase-10 player rows")

_d3_short_agg = (
    _d3_short_src.groupby(
        ["player_id", "player_name", "team_id", "position"], as_index=False
    )
    .agg(
        price=("price", "max"),
        xmins=("expected_minutes", "sum"),
        appearance_probability=("appearance_probability", "max"),
        appearance_pts=("appearance_points", "sum"),
        goal_pts=("goal_points", "sum"),
        assist_pts=("assist_points", "sum"),
        clean_sheet_pts=("clean_sheet_points", "sum"),
        save_pts=("save_points", "sum"),
        penalty_save_pts=("penalty_save_points", "sum"),
        defcon_pts=("defcon_points", "sum"),
        bonus_pts=("bonus_points", "sum"),
        xpts=("fixture_expected_points", "sum"),
    )
)

_d3_avail = phase10_player_features[[
    "player_id", "availability_probability", "start_probability"
]].copy()
for _col in ("availability_probability", "start_probability"):
    _d3_avail[_col] = pd.to_numeric(_d3_avail[_col], errors="coerce")
_d3_avail = _d3_avail.drop_duplicates("player_id", keep="last")
_d3_short_agg = _d3_short_agg.merge(
    _d3_avail, on="player_id", how="left", validate="one_to_one"
)
_d3_short_agg["availability_probability"] = (
    _d3_short_agg["availability_probability"].fillna(
        _d3_short_agg["appearance_probability"]
    ).clip(0.0, 1.0)
)
_d3_short_agg["start_probability"] = (
    _d3_short_agg["start_probability"].fillna(0.0).clip(0.0, 1.0)
)
_d3_short_agg["attack_pts"] = (
    _d3_short_agg["goal_pts"].fillna(0.0)
    + _d3_short_agg["assist_pts"].fillna(0.0)
)
_d3_short_agg["defence_pts"] = (
    _d3_short_agg["clean_sheet_pts"].fillna(0.0)
    + _d3_short_agg["save_pts"].fillna(0.0)
    + _d3_short_agg["penalty_save_pts"].fillna(0.0)
    + _d3_short_agg["defcon_pts"].fillna(0.0)
)
_d3_short_agg["value"] = np.where(
    pd.to_numeric(_d3_short_agg["price"], errors="coerce").gt(0),
    _d3_short_agg["xpts"] / _d3_short_agg["price"],
    np.nan,
)

DAY3_SHORTLIST_MIN_XMINS = float(
    globals().get("DAY3_SHORTLIST_MIN_XMINS", 45.0)
)
DAY3_SHORTLIST_PER_POSITION = int(
    globals().get("DAY3_SHORTLIST_PER_POSITION", 8)
)
if DAY3_SHORTLIST_MIN_XMINS < 0 or DAY3_SHORTLIST_PER_POSITION < 1:
    raise RuntimeError("Day 3_3 shortlist policy is invalid")

_d3_short_valid = _d3_short_agg.loc[
    pd.to_numeric(_d3_short_agg["xmins"], errors="coerce").ge(
        DAY3_SHORTLIST_MIN_XMINS
    )
].copy()
if _d3_short_valid.empty:
    raise RuntimeError(
        f"Day 3_3 Final Shortlists has no players at xMins >= {DAY3_SHORTLIST_MIN_XMINS:g}"
    )

_d3_pos_order = ("GK", "DEF", "MID", "FWD")
DAY3_SHORTLISTS = {}
for _pos in _d3_pos_order:
    _pool = _d3_short_valid.loc[
        _d3_short_valid["position"].astype(str).str.upper().eq(_pos)
    ].copy()
    _pool = _pool.sort_values(
        ["xpts", "value", "xmins", "player_name"],
        ascending=[False, False, False, True],
        na_position="last",
    ).reset_index(drop=True)
    if _pool.empty:
        raise RuntimeError(f"Day 3_3 Final Shortlists has no validated {_pos} players")
    DAY3_SHORTLISTS[_pos] = _pool.head(DAY3_SHORTLIST_PER_POSITION).copy()

_d3_short_ids = [
    int(pid)
    for _frame in DAY3_SHORTLISTS.values()
    for pid in _frame["player_id"].tolist()
]
if len(_d3_short_ids) != len(set(_d3_short_ids)):
    raise RuntimeError("Day 3_3 Final Shortlists contains duplicate players across positions")

def _d3_short_team(team_id):
    _tid = int(team_id)
    if _tid in _d3_proj_by_id.index:
        return str(_d3_proj_by_id.loc[_tid]["team_short"]).upper()
    return str(_tid)

def _d3_short_rows(frame):
    _rows = []
    for _rank, (_, _row) in enumerate(frame.iterrows(), 1):
        _team = _d3_short_team(_row["team_id"])
        _avail = 100.0 * float(_row["availability_probability"])
        _value = float(_row["value"]) if np.isfinite(_row["value"]) else 0.0
        _rows.append(
            f'<div class="d3ShortRow{" d3Elite" if _rank <= 3 else ""}">'
            f'<span class="d3ShortRank">{_rank:02d}</span>'
            '<div class="d3ShortPlayer">'
            f'<strong>{_d3_escape(str(_row["player_name"]))}</strong>'
            f'<small>{_d3_escape(_team)} • {_avail:.0f}% AVAILABLE</small>'
            '</div>'
            f'<span>£{float(_row["price"]):.1f}</span>'
            f'<span>{float(_row["xmins"]):.0f}</span>'
            f'<strong class="d3XPts">{float(_row["xpts"]):.1f}</strong>'
            f'<span>{_value:.2f}</span>'
            '</div>'
        )
    return "".join(_rows)

_d3_short_columns = []
for _pos in _d3_pos_order:
    _d3_short_columns.append(
        '<section class="d3ShortPos">'
        f'<div class="d3ShortPosHead">{_pos}</div>'
        '<div class="d3ShortCols"><span>PLAYER</span><span>£</span>'
        '<span>xMINS</span><span>xPTS</span><span>VAL</span></div>'
        f'{_d3_short_rows(DAY3_SHORTLISTS[_pos])}'
        '</section>'
    )

_d3_short_panel = (
    '<section class="board d3ShortBoard">'
    '<div class="d3Formula">'
    '<strong>PLAYER xPTS</strong>'
    '<span>xPTS ≈ PLAYING PROBABILITY × (ATTACK + DEFENCE + APPEARANCE + BONUS)</span>'
    '</div>'
    '<div class="d3Criteria">'
    f'<span>xMINS ≥ {DAY3_SHORTLIST_MIN_XMINS:g}</span>'
    '<span>OFFICIAL AVAILABILITY</span>'
    '<span>ATTACK + DEFENCE + DEFCON</span>'
