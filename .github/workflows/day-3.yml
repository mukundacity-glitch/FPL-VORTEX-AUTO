        pd.to_numeric(fixtures_raw["event"], errors="coerce").eq(int(NEXT_GW))
    ].copy()

    def _d3_plan_fixture(team_id):
        team_id = int(team_id)
        rows = _d3_next_fixtures.loc[
            _d3_next_fixtures["team_h"].eq(team_id)
            | _d3_next_fixtures["team_a"].eq(team_id)
        ]
        if rows.empty:
            return {"opp":"BLANK", "ha":"", "score":"", "state":"PENDING"}
        row = rows.iloc[0]
        home = int(row["team_h"]) == team_id
        opp_id = int(row["team_a"] if home else row["team_h"])
        opp = str((_d3_boot_teams.get(opp_id) or {}).get("short_name", "TBD"))
        return {
            "opp": opp,
            "ha": "H" if home else "A",
            "score": "",
            "state": "PENDING",
        }

    def _d3_plan_number(value, default=0.0):
        value = pd.to_numeric(value, errors="coerce")
        return float(value) if pd.notna(value) else float(default)

    def _d3_plan_player(pid, *, bench, bench_order=0):
        pid = int(pid)
        if pid not in _d3_pool_by_id.index:
            raise RuntimeError(f"MY PLAN 5A player {pid} is missing Phase-11 data")
        if pid not in _d3_boot_elements:
