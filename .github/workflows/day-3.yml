        for _pos in _sequence:
            _generated = {}
            _grp = _rebuild_candidates[_pos]
            for _state in _beam:
                for _rank,_row in _grp.iterrows():
                    _rank = int(_rank)
                    if _rank <= int(_state["last"][_pos]):
                        continue
                    _pid = int(_row["player_id"])
                    if _pid in _state["ids"]:
                        continue
                    _tid = int(_row["team_id"])
                    if int(_state["clubs"].get(_tid,0)) >= 3:
                        continue
                    _cost = float(_state["cost"]) + float(_row["price"])
                    if _cost > float(_d3_rebuild_budget) + 1e-8:
                        continue
                    _clubs = dict(_state["clubs"])
                    _clubs[_tid] = int(_clubs.get(_tid,0)) + 1
                    _last = dict(_state["last"])
                    _last[_pos] = _rank
                    _ids = tuple(sorted(_state["ids"] + (_pid,)))
                    _next = {
                        "ids":_ids,
                        "rows":_state["rows"]+[_row.copy()],
                        "cost":_cost,
                        "utility":float(_state["utility"])+float(_row["_plan_utility"]),
                        "clubs":_clubs,
                        "last":_last,
                    }
                    _old = _generated.get(_ids)
                    if _old is None or _next["utility"] > _old["utility"]:
                        _generated[_ids] = _next
            if not _generated:
                raise RuntimeError(
                    f"MY PLAN rebuild search exhausted while selecting {_pos}"
                )
            _beam = sorted(
                _generated.values(),
                key=lambda state:(state["utility"],-state["cost"]),
