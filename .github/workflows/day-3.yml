              root / "SLIDE" / "defcon_scene_4k.png",
              root / "MP4" / "02_fdr.mp4",
              root / "MP4" / "03_projected_goals.mp4",
          )
          for section_file in section_files:
              if not section_file.is_file() or section_file.stat().st_size <= 0:
                  raise SystemExit(f"Day 3_3 two-slide section output is missing: {section_file}")

          duplicate_legacy_slides = (
              root / "SLIDE" / "projected_goals_scene_4k.png",
              root / "SLIDE" / "clean_sheet_scene_4k.png",
          )
          survivors = [str(path) for path in duplicate_legacy_slides if path.exists()]
          if survivors:
