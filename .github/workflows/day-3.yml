def _d3_chip_uri(path):
    path = Path(path)
    with _D3ChipImage.open(path) as _im:
        _fmt = str(_im.format or "").upper()
    _mime = {
        "JPEG": "image/jpeg",
        "JPG": "image/jpeg",
        "PNG": "image/png",
        "WEBP": "image/webp",
    }.get(_fmt)
    if not _mime:
        raise RuntimeError(f"Unsupported Slide 7 chip image format: {path} -> {_fmt}")
    return f"data:{_mime};base64," + _d3_chip_b64.b64encode(path.read_bytes()).decode("ascii")

_d3_chip_uris = {
    key: _d3_chip_uri(path)
    for key, path in _d3_chip_asset_paths.items()
}

_D3_CHIP_META = {
    "bboost": {"key": "bench_boost", "label": "BENCH BOOST", "short": "BB"},
    "3xc": {"key": "triple_captain", "label": "TRIPLE CAPTAIN", "short": "TC"},
    "wildcard": {"key": "wildcard", "label": "WILDCARD", "short": "WC"},
    "freehit": {"key": "free_hit", "label": "FREE HIT", "short": "FH"},
}
_D3_CHIP_ORDER = ("bboost", "3xc", "wildcard", "freehit")

def _d3_chip_plays(value):
    if isinstance(value, list):
        return value
    if isinstance(value, tuple):
        return list(value)
    if value is None:
        return []
    try:
        if pd.isna(value):
            return []
    except Exception:
        pass
    if isinstance(value, str):
        _txt = value.strip()
        if not _txt:
            return []
        try:
            _parsed = ast.literal_eval(_txt)
        except Exception:
            return []
        return list(_parsed) if isinstance(_parsed, (list, tuple)) else []
    return []

_d3_bootstrap = data.get("bootstrap") if isinstance(data, dict) else None
if not isinstance(_d3_bootstrap, dict):
    raise RuntimeError("Slide 7 requires the canonical official FPL bootstrap snapshot")
_d3_total_entries = int(_d3_bootstrap.get("total_players") or 0)
if _d3_total_entries <= 0:
    raise RuntimeError("Slide 7 official FPL active-manager total is unavailable")

_d3_usage_counts = {code: 0 for code in _D3_CHIP_ORDER}
_d3_usage_gws = {code: [] for code in _D3_CHIP_ORDER}
for _, _event in events.iterrows():
    _event_id_value = pd.to_numeric(_event.get("id"), errors="coerce")
    _event_id = int(_event_id_value) if pd.notna(_event_id_value) else 0
    if _event_id <= 0 or _event_id >= int(NEXT_GW):
        continue
    for _play in _d3_chip_plays(_event.get("chip_plays")):
        _code = str((_play or {}).get("chip_name") or "").strip().lower()
        if _code not in _d3_usage_counts:
            continue
        _played_value = pd.to_numeric((_play or {}).get("num_played"), errors="coerce")
        _played = int(_played_value) if pd.notna(_played_value) else 0
        if _played < 0:
            raise RuntimeError(f"Slide 7 received negative chip usage for {_code}")
        _d3_usage_counts[_code] += _played
        if _played:
            _d3_usage_gws[_code].append({"gw": _event_id, "managers": _played})

_d3_usage = []
for _code in _D3_CHIP_ORDER:
    _meta = _D3_CHIP_META[_code]
    _count = int(_d3_usage_counts[_code])
    _pct = 100.0 * _count / float(_d3_total_entries)
    _d3_usage.append({
        "code": _code,
        "key": _meta["key"],
        "label": _meta["label"],
        "short": _meta["short"],
        "managers": _count,
        "percentage": float(_pct),
        "gameweeks": list(_d3_usage_gws[_code]),
        "asset_file": _D3_CHIP_FILES[_meta["key"]],
        "asset_drive_id": _D3_CHIP_ASSET_IDS[_meta["key"]],
    })

# Official 2026/27 rule: one of each chip in each half; the set refreshes after GW19.
_d3_chip_period_start = 1 if int(NEXT_GW) <= 19 else 20
_d3_chip_period_end = 19 if int(NEXT_GW) <= 19 else 38
_d3_entry_id = int(
    globals().get("FPL_TEAM_ID")
    or globals().get("TEAM_ID")
    or globals().get("ENTRY_ID")
    or 0
)
if _d3_entry_id <= 0:
    raise RuntimeError("Slide 7 requires the current FPL entry ID")

_d3_entry_history = None
if isinstance(globals().get("GW_REVIEW"), dict):
    _candidate_history = globals()["GW_REVIEW"].get("history")
    if isinstance(_candidate_history, dict):
        _d3_entry_history = _candidate_history

_d3_fpl_session = None
if _d3_entry_history is None:
    if "_fpl_module" not in globals():
        raise RuntimeError("Slide 7 requires the canonical fpl_data module")
    _d3_fpl_session = _fpl_module._vx_http_session()
    _d3_entry_history = _fpl_module._vx_get_json(
        _d3_fpl_session,
        f"/entry/{_d3_entry_id}/history/",
    )
if not isinstance(_d3_entry_history, dict):
    raise RuntimeError("Slide 7 could not resolve the current entry chip history")

_d3_used_period = set()
_d3_used_rows = []
for _row in list(_d3_entry_history.get("chips") or []):
    _code = str((_row or {}).get("name") or "").strip().lower()
    _gw_value = pd.to_numeric((_row or {}).get("event"), errors="coerce")
    _gw = int(_gw_value) if pd.notna(_gw_value) else 0
    if _code in _D3_CHIP_META and _d3_chip_period_start <= _gw <= _d3_chip_period_end:
        _d3_used_period.add(_code)
        _d3_used_rows.append({"code": _code, "gw": _gw})

_d3_remaining_codes = [code for code in _D3_CHIP_ORDER if code not in _d3_used_period]
_d3_remaining_labels = [_D3_CHIP_META[code]["label"] for code in _d3_remaining_codes]

# Highest score that can be verified from an official weekly overall winner whose active chip is exposed.
_d3_highest_chip = None
_d3_review_ready = {int(gw) for gw in (data.get("review_ready_gws") or [])}
_d3_winner_candidates = []
for _, _event in events.iterrows():
    _gw_value = pd.to_numeric(_event.get("id"), errors="coerce")
    _entry_value = pd.to_numeric(_event.get("highest_scoring_entry"), errors="coerce")
    _score_value = pd.to_numeric(_event.get("highest_score"), errors="coerce")
    _gw = int(_gw_value) if pd.notna(_gw_value) else 0
    _entry = int(_entry_value) if pd.notna(_entry_value) else 0
    _score = int(_score_value) if pd.notna(_score_value) else 0
    if _gw in _d3_review_ready and _gw < int(NEXT_GW) and _entry > 0 and _score > 0:
        _d3_winner_candidates.append((_score, _gw, _entry))
_d3_winner_candidates.sort(reverse=True)

if "_fpl_module" in globals() and _d3_winner_candidates:
    if _d3_fpl_session is None:
        _d3_fpl_session = _fpl_module._vx_http_session()
    for _score, _gw, _entry in _d3_winner_candidates:
        try:
            _picks = _fpl_module._vx_get_json(
                _d3_fpl_session,
                f"/entry/{int(_entry)}/event/{int(_gw)}/picks/",
            )
            _active = str((_picks or {}).get("active_chip") or "").strip().lower()
        except Exception as _chip_winner_exc:
            print(f"⚠️ Slide 7 weekly-winner chip verification skipped GW{_gw}: {_chip_winner_exc}")
            continue
        if _active in _D3_CHIP_META:
            _d3_highest_chip = {
                "points": int(_score),
                "gw": int(_gw),
                "code": _active,
                "label": _D3_CHIP_META[_active]["label"],
                "entry_id": int(_entry),
                "source": "OFFICIAL_FPL_WEEKLY_HIGHEST_SCORING_ENTRY_ACTIVE_CHIP",
            }
            break

if "phase11_current_squad_state" not in globals() or len(phase11_current_squad_state) != 15:
    raise RuntimeError("Slide 7 requires the validated Phase-11 current 15-player squad")
_d3_squad = phase11_current_squad_state.copy()
_d3_squad["player_id"] = pd.to_numeric(_d3_squad["player_id"], errors="coerce").astype("Int64")
_d3_squad["team_id"] = pd.to_numeric(_d3_squad["team_id"], errors="coerce").astype("Int64")
if _d3_squad["player_id"].isna().any() or _d3_squad["team_id"].isna().any():
    raise RuntimeError("Slide 7 current squad contains missing official IDs")

_d3_chip_horizon = list(range(int(NEXT_GW), min(38, int(NEXT_GW) + 9) + 1))
_d3_fixture_pressure = []
for _gw in _d3_chip_horizon:
    _gw_fx = fixtures_raw.loc[
        pd.to_numeric(fixtures_raw["event"], errors="coerce").eq(int(_gw))
    ].copy()
    _team_counts = {}
    for _team_id in _d3_squad["team_id"].astype(int).unique().tolist():
        _team_counts[int(_team_id)] = int(
            (
                pd.to_numeric(_gw_fx["team_h"], errors="coerce").eq(int(_team_id))
                | pd.to_numeric(_gw_fx["team_a"], errors="coerce").eq(int(_team_id))
            ).sum()
        )
    _blank_players = int(sum(_team_counts[int(tid)] == 0 for tid in _d3_squad["team_id"].astype(int)))
    _double_players = int(sum(_team_counts[int(tid)] >= 2 for tid in _d3_squad["team_id"].astype(int)))
    _d3_fixture_pressure.append({
        "gw": int(_gw),
        "blank_players": _blank_players,
        "double_players": _double_players,
    })

_d3_current_pressure = next(row for row in _d3_fixture_pressure if int(row["gw"]) == int(NEXT_GW))
_d3_fh_target = max(_d3_fixture_pressure, key=lambda row: (int(row["blank_players"]), -int(row["gw"])))
_d3_bb_target = max(
    _d3_fixture_pressure,
    key=lambda row: (int(row["double_players"]) - int(row["blank_players"]), -int(row["gw"])),
)

_d3_tc_target = None
if "phase10_player_fixture_expected_points" in globals():
    _tc = phase10_player_fixture_expected_points.copy()
    _tc["gameweek"] = pd.to_numeric(_tc["gameweek"], errors="coerce")
    _tc["player_id"] = pd.to_numeric(_tc["player_id"], errors="coerce")
    _tc["fixture_expected_points"] = pd.to_numeric(_tc["fixture_expected_points"], errors="coerce")
    if "calculation_status" in _tc.columns:
        _tc = _tc.loc[_tc["calculation_status"].astype(str).eq("READY")]
    _tc = _tc.loc[
        _tc["gameweek"].isin(_d3_chip_horizon)
        & _tc["player_id"].notna()
        & _tc["fixture_expected_points"].notna()
    ]
    if not _tc.empty:
        _agg = {"xpts": ("fixture_expected_points", "sum")}
        _agg["fixtures"] = ("fixture_id", "nunique") if "fixture_id" in _tc.columns else ("fixture_expected_points", "size")
        _tc_rank = (
            _tc.groupby(["gameweek", "player_id"], as_index=False)
            .agg(**_agg)
            .sort_values(["xpts", "fixtures", "gameweek"], ascending=[False, False, True])
            .reset_index(drop=True)
        )
        _tc_top = _tc_rank.iloc[0]
        _tc_pid = int(_tc_top["player_id"])
        _player_rows = players.loc[pd.to_numeric(players["id"], errors="coerce").eq(_tc_pid)]
        _tc_name = (
            str(_player_rows.iloc[0].get("web_name") or _player_rows.iloc[0].get("second_name") or _tc_pid)
            if not _player_rows.empty else str(_tc_pid)
        )
        _d3_tc_target = {
            "gw": int(_tc_top["gameweek"]),
            "player_id": _tc_pid,
            "player_name": _tc_name,
            "xpts": float(_tc_top["xpts"]),
            "fixtures": int(_tc_top["fixtures"]),
        }

_d3_wc_candidates = [
    row for row in _d3_fixture_pressure
    if max(int(NEXT_GW), 6, _d3_chip_period_start) <= int(row["gw"]) <= min(12, _d3_chip_period_end)
]
_d3_wc_target = (
    max(_d3_wc_candidates, key=lambda row: (
        int(row["blank_players"]) + int(row["double_players"]), -int(row["gw"])
    ))
    if _d3_wc_candidates else None
)

_d3_low_availability = 0
for _availability_col in ("availability", "current_gw_availability", "availability_probability"):
    if _availability_col in _d3_squad.columns:
        _vals = pd.to_numeric(_d3_squad[_availability_col], errors="coerce")
        if _vals.notna().any():
            _d3_low_availability = int((_vals.fillna(1.0) < 0.70).sum())
            break

_d3_recommendation = "NO CHIP"
_d3_recommendation_reason = "The current squad has no strong blank, double or availability trigger."
if "freehit" in _d3_remaining_codes and int(NEXT_GW) > 1 and int(_d3_current_pressure["blank_players"]) >= 4:
    _d3_recommendation = "FREE HIT"
    _d3_recommendation_reason = f"{int(_d3_current_pressure['blank_players'])} current-squad players have no fixture."
elif "bboost" in _d3_remaining_codes and int(_d3_current_pressure["blank_players"]) == 0 and int(_d3_current_pressure["double_players"]) >= 4:
    _d3_recommendation = "BENCH BOOST"
    _d3_recommendation_reason = f"{int(_d3_current_pressure['double_players'])} current-squad players have multiple fixtures."
elif "3xc" in _d3_remaining_codes and _d3_tc_target is not None and int(_d3_tc_target["gw"]) == int(NEXT_GW) and int(_d3_tc_target["fixtures"]) >= 2:
    _d3_recommendation = "TRIPLE CAPTAIN"
    _d3_recommendation_reason = (
        f"{_d3_tc_target['player_name']} leads the horizon at {float(_d3_tc_target['xpts']):.1f} xPts with multiple fixtures."
    )
elif "wildcard" in _d3_remaining_codes and 6 <= int(NEXT_GW) <= 12 and int(_d3_low_availability) >= 4:
    _d3_recommendation = "WILDCARD"
    _d3_recommendation_reason = f"{int(_d3_low_availability)} current-squad players are below the availability threshold."

def _d3_chip_total_text(value):
    _v = float(value)
    return f"{_v/1_000_000:.1f} million" if _v >= 1_000_000 else f"{int(_v):,}"

_d3_usage_cards = []
for _i, _row in enumerate(_d3_usage):
    _asset_key = _row["key"]
    _d3_usage_cards.append(f'''
      <article class="d3ChipUsageCard {_asset_key}" data-chip-card="{_i}" data-target-pct="{float(_row['percentage']):.4f}">
        <div class="d3ChipTop">
          <div class="d3ChipIconWrap"><img class="d3ChipIcon" src="{_d3_chip_uris[_asset_key]}" alt="{escape(_row['label'])}"/></div>
          <div><div class="d3ChipName">{escape(_row['label'])}</div><div class="d3ChipShort">{escape(_row['short'])}</div></div>
        </div>
        <div class="d3ChipCounter"><span class="d3ChipPct" data-target="{float(_row['percentage']):.4f}">{float(_row['percentage']):.1f}%</span><small>USED SO FAR</small></div>
        <div class="d3ChipManagers">{int(_row['managers']):,} <span>manager activations</span></div>
        <div class="d3ChipProgress"><div class="d3ChipProgressFill" style="--target:{min(100.0,float(_row['percentage']))/100.0:.6f}"></div></div>
      </article>
    ''')

_d3_left_panel = f'''
<section class="table-panel d3ChipPanel d3ChipUsagePanel">
  <div class="d3ChipPanelHead"><span>SEASON CHIP USAGE</span><b>OFFICIAL FPL</b></div>
  <div class="d3ChipUsageGrid">{''.join(_d3_usage_cards)}</div>
  <div class="d3ChipPopulation">OUT OF ~{_d3_chip_total_text(_d3_total_entries)} ACTIVE MANAGERS</div>
</section>
'''

_d3_highest_points = str(int(_d3_highest_chip["points"])) if _d3_highest_chip else "—"
_d3_highest_sub = (
    f"GW{int(_d3_highest_chip['gw'])} • {escape(_d3_highest_chip['label'])}"
    if _d3_highest_chip else "NO VERIFIED WEEKLY-WINNER CHIP SCORE YET"
)
_d3_highest_note = (
    "OFFICIAL WEEKLY OVERALL WINNER • ACTIVE CHIP VERIFIED"
    if _d3_highest_chip else "WILL UPDATE WHEN OFFICIAL WINNER + ACTIVE CHIP CAN BE VERIFIED"
)

_d3_remaining_cards = []
for _code in _D3_CHIP_ORDER:
    _meta = _D3_CHIP_META[_code]
    _is_remaining = _code in _d3_remaining_codes
    _asset_key = _meta["key"]
    _state = "AVAILABLE" if _is_remaining else "USED"
    _d3_remaining_cards.append(f'''
      <div class="d3ChipRemainCard {'available' if _is_remaining else 'used'}">
        <img src="{_d3_chip_uris[_asset_key]}" alt="{escape(_meta['label'])}"/>
        <strong>{escape(_meta['short'])}</strong><span>{_state}</span>
      </div>
    ''')

_d3_tc_target_text = (
    f"GW{int(_d3_tc_target['gw'])} • {escape(_d3_tc_target['player_name'])} • {float(_d3_tc_target['xpts']):.1f} xPTS"
    if _d3_tc_target else "BEST VERIFIED HAUL WINDOW"
)
_d3_fh_target_text = (
    f"GW{int(_d3_fh_target['gw'])} • {int(_d3_fh_target['blank_players'])} SQUAD BLANKS"
    if int(_d3_fh_target["blank_players"]) > 0 else "NEXT MAJOR BLANK WINDOW"
)
_d3_bb_target_text = (
    f"GW{int(_d3_bb_target['gw'])} • {int(_d3_bb_target['double_players'])} SQUAD DOUBLES"
    if int(_d3_bb_target["double_players"]) > 0 else "NEXT STRONG DOUBLE WINDOW"
)
_d3_wc_target_text = (
    f"GW{int(_d3_wc_target['gw'])} • DATA-RANKED INSIDE GW6–12"
    if _d3_wc_target else "GW6–12 • LONG-TERM SQUAD RESET"
)

_d3_right_panel = f'''
<section class="table-panel d3ChipPanel d3ChipStrategyPanel">
  <div class="d3ChipHighest">
    <div class="d3ChipEyebrow">HIGHEST CHIP SCORE SO FAR</div>
    <div class="d3ChipHighestNumber" data-target-score="{_d3_highest_points}">{_d3_highest_points}<small>PTS</small></div>
    <div class="d3ChipHighestSub">{_d3_highest_sub}</div><div class="d3ChipHighestNote">{_d3_highest_note}</div>
  </div>
  <div class="d3ChipRemaining">
    <div class="d3ChipSectionTitle">MY REMAINING CHIPS <span>GW{_d3_chip_period_start}–{_d3_chip_period_end} SET</span></div>
    <div class="d3ChipRemainGrid">{''.join(_d3_remaining_cards)}</div>
  </div>
  <div class="d3ChipRecommendation">
    <div class="d3ChipSectionTitle">STRATEGY RECOMMENDATION</div>
    <div class="d3ChipThisWeek">THIS WEEK <span>{escape(_d3_recommendation)}</span></div>
    <div class="d3ChipRecReason">{escape(_d3_recommendation_reason)}</div>
    <div class="d3ChipTargets">
      <div class="d3ChipRecLine"><b>WC</b><span>{_d3_wc_target_text}</span><i class="d3ChipUnderline"></i></div>
      <div class="d3ChipRecLine"><b>TC</b><span>{_d3_tc_target_text}</span><i class="d3ChipUnderline"></i></div>
      <div class="d3ChipRecLine"><b>FH</b><span>{_d3_fh_target_text}</span><i class="d3ChipUnderline"></i></div>
      <div class="d3ChipRecLine"><b>BB</b><span>{_d3_bb_target_text}</span><i class="d3ChipUnderline"></i></div>
    </div>
  </div>
  <div class="d3ChipClose">THAT'S THE CHIP STRATEGY FOR <b>GAMEWEEK {int(NEXT_GW)}</b></div>
</section>
'''

_d3_chip_css = r'''
