# One current-GW player anchor per team from the existing Phase-10 xPts pipeline.
_d3_player_next = player_fixture_xpts_df.copy() if isinstance(player_fixture_xpts_df, pd.DataFrame) else pd.DataFrame()
_d3_player_by_team = {}
if not _d3_player_next.empty and {"gw", "team_id", "player_id", "player_name", "xpts"}.issubset(_d3_player_next.columns):
    _d3_player_next = _d3_player_next.loc[
