          if not root.is_dir():
              raise SystemExit(f"Output root is missing: {root}")
          actual_dirs = {path.name for path in root.iterdir() if path.is_dir()}
          root_files = [path.name for path in root.iterdir() if path.is_file()]
          if actual_dirs != expected_dirs or root_files:
              raise SystemExit(
                  f"Day 3 output structure invalid: dirs={sorted(actual_dirs)}, "
                  f"root_files={root_files}"
              )
          for name in sorted(expected_dirs):
              folder = root / name
              if not any(path.is_file() for path in folder.rglob("*")):
                  raise SystemExit(f"Expected output directory is empty: {folder}")

          qa_path = root / "DATA" / "final_video_qa.json"
          if not qa_path.is_file():
              raise SystemExit(f"Final QA file is missing: {qa_path}")
          qa = json.loads(qa_path.read_text(encoding="utf-8"))
          if (
              qa.get("passed") is not True
              or qa.get("output_contract", {}).get("passed") is not True
          ):
              raise SystemExit("Final video QA did not pass")


          intro_slide = root / "SLIDE" / "intro_scene_4k.png"
          intro_mp4 = root / "MP4" / "00_intro.mp4"
          narration_path = root / "DATA" / "other_scenes_narration.json"
          for required_path in (intro_slide, intro_mp4, narration_path):
              if not required_path.is_file() or required_path.stat().st_size <= 0:
                  raise SystemExit(f"Day 3_3 Slide 0 output is missing: {required_path}")

          narration = json.loads(narration_path.read_text(encoding="utf-8"))
          intro_script = str((narration.get("00_intro") or {}).get("script") or "")
          intro_script_lower = intro_script.lower()
          agenda_anchors = [
              "expected minutes",
              "ownership pressure",
              "rank gain or loss",
              "differentials",
              "player traps",
              "video 3 of 3",
              "projected goals plus clean sheet odds",
              "final shortlists",
              "transfer decision desk",
              "my gameweek plan",
              "benching dilemma",
              "chip strategy",
              "vortex captain",
          ]
          anchor_positions = []
          for agenda_anchor in agenda_anchors:
              if intro_script_lower.count(agenda_anchor) != 1:
                  raise SystemExit(
                      f"Day 3_3 intro narration must contain {agenda_anchor!r} exactly once"
                  )
              anchor_positions.append(intro_script_lower.index(agenda_anchor))
          if anchor_positions != sorted(anchor_positions):
              raise SystemExit(
                  f"Day 3_3 intro narration agenda order is wrong: {anchor_positions}"
              )
          legacy_intro_phrases = (
              "my previous gameweek squad",
              "six-gameweek runs that could create",
              "clear transfer priorities for gameweek",
          )
          if any(phrase in intro_script_lower for phrase in legacy_intro_phrases):
              raise SystemExit("Stale Day 1 intro narration survived in Day 3_3")
          print("Day 3_3 Slide 0 PNG/MP4/Ryan narration contract: PASS")

          final_mp4s = [
              path for path in (root / "MP4").glob("*COMBINED*.mp4")
              if path.is_file()
          ]
          final_mp3s = [
              path for path in (root / "MP3").glob("*COMBINED*.mp3")
              if path.is_file()
          ]
          if len(final_mp4s) != 1 or len(final_mp3s) != 1:
              raise SystemExit(
                  "Expected exactly one combined final MP4 and MP3; "
                  f"found MP4={len(final_mp4s)}, MP3={len(final_mp3s)}"
              )

          package_path = root / "DATA" / "youtube_video_3_of_3_package.json"
          if not package_path.is_file():
              raise SystemExit(f"Video 3/3 package is missing: {package_path}")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if (
              package.get("manual_upload_only") is not False
              or package.get("youtube_api_upload_enabled") is not True
              or package.get("automatic_publication_enabled") is not False
          ):
              raise SystemExit(
