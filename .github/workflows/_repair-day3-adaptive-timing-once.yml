name: Repair Day 3 adaptive timing once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_repair-day3-adaptive-timing-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify protected files and patch Day 3 only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          test "$(git hash-object vortex/day1_media.py)" = "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"
          test "$(git hash-object .github/workflows/day-3.yml)" = "64e57f96a9c994dbd64975396ede83f21f4ace7b"
          test "$(git hash-object 3_final_day3.py)" = "0d30e8fab93d58314e2300b909c13f9804fca2af"

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent
          import ast
          import collections
          import re

          path = Path("3_final_day3.py")
          source = path.read_text(encoding="utf-8")

          old = indent(dedent('''\
          elif is_first_player:
              name_time = float(segment.get("name_time") or 0.0)
              start = float(timing["first_player_at"]) - name_time
              if start < cursor - 1e-6:
                  raise RuntimeError(
                      "Headline narration overlaps the fixed 0:08 goalkeeper reveal. "
                      f"Headline ends at {cursor:.3f}s; goalkeeper audio must begin "
                      f"at {start:.3f}s. Shorten the headline or adjust the override."
                  )
              first_player_seen = True
          '''), "        ")
          new = indent(dedent('''\
          elif is_first_player:
              name_time = float(segment.get("name_time") or 0.0)
              start = float(timing["first_player_at"]) - name_time
              if start < cursor - 1e-6:
                  delay = cursor - start
                  timing["first_player_at"] = float(timing["first_player_at"]) + delay
                  timing["goalkeeper_card_out"] = float(timing["goalkeeper_card_out"]) + delay
                  start = cursor
              first_player_seen = True
          '''), "        ")

          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one Day 3 rigid goalkeeper timing block, found {source.count(old)}")
          if source.count('timing["first_player_at"] = float(timing["first_player_at"]) + delay') != 0:
              raise SystemExit("Adaptive Day 3 timing repair already exists; refusing duplicate code")

          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          tree = ast.parse(source, filename=str(path))
          compile(source, str(path), "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT, dont_inherit=True)

          definitions = collections.defaultdict(list)
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  definitions[node.name].append(node.lineno)
              if isinstance(node, ast.Dict):
                  keys = [
                      key.value for key in node.keys
                      if isinstance(key, ast.Constant)
                      and isinstance(key.value, (str, int, float, bytes))
                  ]
                  dupes = [key for key, count in collections.Counter(keys).items() if count > 1]
                  if dupes:
                      raise SystemExit(f"Duplicate literal dictionary keys near line {node.lineno}: {dupes}")
          duplicate_definitions = {name: locs for name, locs in definitions.items() if len(locs) > 1}
          if duplicate_definitions:
              raise SystemExit("Duplicate Day 3 definitions: " + repr(duplicate_definitions))

          marker = re.compile(r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)")
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(f"Expected 33 standalone Day 3 cell blocks, found {len(cells)}")
          for index, cell in enumerate(cells, 1):
              compile(cell, f"{path.name}::cell-{index}", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT, dont_inherit=True)

          # Generic timing regression: a long dynamic headline moves both beats equally.
          timing = {"first_player_at": 8.0, "goalkeeper_card_out": 23.0}
          cursor = 8.088
          name_time = 0.100
          start = timing["first_player_at"] - name_time
          if start < cursor - 1e-6:
              delay = cursor - start
              timing["first_player_at"] += delay
              timing["goalkeeper_card_out"] += delay
              start = cursor
          reveal = start + name_time
          assert abs(reveal - timing["first_player_at"]) < 1e-9
          assert abs((timing["goalkeeper_card_out"] - timing["first_player_at"]) - 15.0) < 1e-9
          assert start >= cursor - 1e-9

          print("Day 3 adaptive dynamic narration timing: PASS")
          print("Day 3 AST/cell/duplicate validation: PASS")
          PY

          git diff --check -- 3_final_day3.py
          test "$(git diff --name-only | tr -d '\r')" = "3_final_day3.py"
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          echo "Locked Day 1/Day 2 files unchanged: PASS"

      - name: Commit only the Day 3 source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 3_final_day3.py
          test "$(git diff --cached --name-only | tr -d '\r')" = "3_final_day3.py"
          git commit -m "Make Day 3 review timing adapt to narration"
          git push origin HEAD:main
