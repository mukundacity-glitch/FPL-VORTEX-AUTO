name: One-time Day 3 workflow history cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_clear-day3-history-once.yml

permissions:
  actions: write
  contents: write

jobs:
  clear-day3-history:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete completed Day 3 workflow runs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/day-3.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id'
          )

          echo "Completed Day 3 runs found: ${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            echo "Deleting Day 3 run ${run_id}"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

          remaining="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/day-3.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "completed")] | length' \
            | awk '{sum += $1} END {print sum + 0}'
          )"

          test "$remaining" = "0"
          echo "Completed Day 3 workflow history: CLEARED"

      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/_clear-day3-history-once.yml
          git commit -m "Remove one-time Day 3 history cleanup"
          git push origin HEAD:main
