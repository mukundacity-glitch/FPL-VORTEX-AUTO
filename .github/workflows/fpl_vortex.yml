name: FPL VORTEX

on:
  workflow_dispatch:
    inputs:
      render_quality:
        description: Video render quality
        required: true
        default: FINAL
        type: choice
        options:
          - DRAFT
          - FINAL

permissions:
  contents: read

concurrency:
  group: fpl-vortex-weekly
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FPL_VORTEX_LOCAL_ROOT: ${{ github.workspace }}/output
  FPL_VORTEX_MP4_QUALITY: ${{ inputs.render_quality }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  run-fpl-vortex:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Normalize Google OAuth secrets
        shell: bash
        run: |
          python - <<'PY'
          import os

          names = (
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
          )

          cleaned = {}
          for name in names:
              value = (os.environ.get(name) or "").strip()
              if not value:
                  raise SystemExit(f"Missing or empty GitHub secret: {name}")
              cleaned[name] = value

          if not cleaned["GOOGLE_OAUTH_CLIENT_ID"].endswith(".apps.googleusercontent.com"):
              raise SystemExit(
                  "GOOGLE_OAUTH_CLIENT_ID does not look like a Google OAuth client ID. "
                  "Use the active OAuth client ID that issued the refresh token."
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for name, value in cleaned.items():
                  marker = f"FPL_VORTEX_{name}_EOF"
                  handle.write(f"{name}<<{marker}\n{value}\n{marker}\n")

          print("Google OAuth secrets normalized without exposing their values.")
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install system rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Verify notebook compatibility
        run: python run_weekly_github.py preflight

      - name: Restore persistent Google Drive state
        run: python run_weekly_github.py restore

      - name: Execute FPL VORTEX
        run: python run_weekly_github.py execute

      - name: Verify generated outputs
        run: python run_weekly_github.py validate

      - name: Upload outputs and persistent state to Google Drive
        run: python run_weekly_github.py publish
