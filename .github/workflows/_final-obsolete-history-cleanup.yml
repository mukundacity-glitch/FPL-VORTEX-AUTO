name: Final obsolete workflow history cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_final-obsolete-history-cleanup.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify permanent source and workflows are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          test "$(git hash-object .github/workflows/day-3.yml)" = "64e57f96a9c994dbd64975396ede83f21f4ace7b"
          test "$(git hash-object 3_final_day3.py)" = "0d30e8fab93d58314e2300b909c13f9804fca2af"

      - name: Delete obsolete flattened-export workflow history only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(.status == "completed")
                | select(.path == ".github/workflows/day3-flatten-export-temp.yml" or ((.name // "") | ascii_downcase | contains("flattened export temp")))
                | .id'
          )
          echo "Obsolete flattened-export completed runs found: ${#ids[@]}"
          for id in "${ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
          done
          remaining="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '[.workflow_runs[]
                | select(.status == "completed")
                | select(.path == ".github/workflows/day3-flatten-export-temp.yml" or ((.name // "") | ascii_downcase | contains("flattened export temp")))] | length' \
              | awk '{n += $1} END {print n + 0}'
          )"
          test "$remaining" = "0"
          echo "Obsolete flattened-export workflow history: CLEARED"

      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/_final-obsolete-history-cleanup.yml
          git commit -m "Remove final obsolete workflow history cleanup"
          git push origin HEAD:main