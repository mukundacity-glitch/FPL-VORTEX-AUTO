name: One-time Day 3 narration source fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_fix-day3-narration-once.yml

permissions:
  contents: write

jobs:
  patch-day3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch and validate Day 3 only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import collections
          import re
          from pathlib import Path

          path = Path("3_final_day3.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          functions = [
              node for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "vx_full_word_narration"
          ]
          if len(functions) != 1:
              raise SystemExit(
                  f"Expected exactly one vx_full_word_narration definition, found {len(functions)}"
              )

          normalizer = functions[0]
          lines = source.splitlines(keepends=True)
          target = 'value = _vx_re.sub(r"\\bGK\\b", "goalkeeper", value)'
          replacement = 'value = _vx_re.sub(r"\\bFPL\\b", "Fantasy Premier League", value)'

          function_lines = lines[normalizer.lineno - 1 : normalizer.end_lineno]
          existing = [line for line in function_lines if line.strip() == replacement]
          if existing:
              raise SystemExit("Standalone FPL narration normalization already exists; no patch needed")

          matches = [
              normalizer.lineno - 1 + index
              for index, line in enumerate(function_lines)
              if line.strip() == target
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one goalkeeper normalization anchor in Day 3 narration, found {len(matches)}"
              )

          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index, indent + replacement + "\n")
          updated = "".join(lines)

          updated_tree = ast.parse(updated, filename=str(path))
          compile(
              updated,
              str(path),
              "exec",
              flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
              dont_inherit=True,
          )

          definitions = collections.defaultdict(list)
          for node in ast.walk(updated_tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  definitions[node.name].append(node.lineno)
              if isinstance(node, ast.Dict):
                  keys = [
                      key.value
                      for key in node.keys
                      if isinstance(key, ast.Constant)
                      and isinstance(key.value, (str, int, float, bytes))
                  ]
                  duplicates = [
                      key for key, count in collections.Counter(keys).items()
                      if count > 1
                  ]
                  if duplicates:
                      raise SystemExit(
                          f"Duplicate literal dictionary keys near line {node.lineno}: {duplicates}"
                      )

          duplicate_definitions = {
              name: locations
              for name, locations in definitions.items()
              if len(locations) > 1
          }
          if duplicate_definitions:
              raise SystemExit(
                  "Duplicate Day 3 definitions after patch: " + repr(duplicate_definitions)
              )

          if updated.count(replacement) != 1:
              raise SystemExit("Day 3 must contain exactly one standalone FPL narration normalization")

          banned_re = re.compile(r"(?<![A-Za-z])[A-Z]{2,6}(?![A-Za-z])")
          sample = re.sub(
              r"\bFPL\b",
              "Fantasy Premier League",
              "FPL rank is trending upward",
          )
          if banned_re.findall(sample):
              raise SystemExit("Standalone FPL normalization self-test failed")

          path.write_text(updated, encoding="utf-8")
          print("Day 3 standalone FPL narration normalization: PASS")
          print("Day 3 AST/compile/duplicate validation: PASS")
          PY

          git diff --check
          test "$(git diff --name-only)" = "3_final_day3.py"

          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          test "$(git hash-object vortex/day1_media.py)" = "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"
          echo "Locked Day 1/Day 2 files unchanged: PASS"

      - name: Commit Day 3 source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 3_final_day3.py
          test "$(git diff --cached --name-only)" = "3_final_day3.py"
          git commit -m "Fix Day 3 narration full-word normalization"
          git push origin HEAD:main
