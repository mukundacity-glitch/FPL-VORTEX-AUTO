name: Day 3 Python 3.12 smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/day3-smoke-trigger"

permissions:
  contents: read

jobs:
  check-cell-22:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download production Day 3 notebook and compile cell 22
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DAY3_NOTEBOOK_ID: "1zKWruOYPPstyyr42y6q-MKwE3-6qTh0s"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          import os
          import urllib.parse
          import urllib.request

          body = urllib.parse.urlencode({
              "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
              "refresh_token": os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
              "grant_type": "refresh_token",
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              access_token = json.loads(response.read().decode("utf-8"))["access_token"]

          req = urllib.request.Request(
              "https://www.googleapis.com/drive/v3/files/"
              + os.environ["DAY3_NOTEBOOK_ID"]
              + "?alt=media",
              headers={"Authorization": f"Bearer {access_token}"},
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              notebook = json.loads(response.read().decode("utf-8"))

          cell = notebook["cells"][22]
          source = "".join(cell.get("source", [])) if isinstance(cell.get("source"), list) else str(cell.get("source", ""))
          compile(source, "<day3-cell-22>", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
          print("PASS: production Drive notebook cell 22 compiles under Python 3.12")
          PY
