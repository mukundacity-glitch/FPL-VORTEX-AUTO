name: Day 3_3 narration hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/day3-3-narration-hotfix.yml

permissions:
  contents: write

concurrency:
  group: fpl-vortex-day-3-narration-hotfix
  cancel-in-progress: false

jobs:
  patch-day3-only:
    if: ${{ github.event.head_commit.message == 'Run Day 3_3 DEF narration hotfix' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch and validate Day 3_3 only
        shell: bash
        run: |
          set -euo pipefail

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "LOCK FAILED: $path changed ($actual != $expected)" >&2
              exit 1
            fi
          }

          # Hard lock: Day 1 and Day 2 must remain byte-for-byte unchanged.
          verify_blob "1_final_day1.py" "27ced793bb6934faada3a098815378512bac11c0"
          verify_blob ".github/workflows/day-1.yml" "240ba9024f11f894e98fad2f3199db041083a904"
          verify_blob ".github/workflows/day-2.yml" "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          verify_blob "vortex/day1_media.py" "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"

          python - <<'PY'
          import ast
          import collections
          import re
          from pathlib import Path

          path = Path("3_final_day3.py")
          source = path.read_text(encoding="utf-8")

          anchor = '    value = _vx_re.sub(r"\\bVORTEX\\b", "Vortex", value)'
          def_normalizer = '    value = _vx_re.sub(r"\\bDEF\\b", "defender", value)'
          replacement = anchor + "\n" + def_normalizer

          if source.count(anchor) != 1:
              raise SystemExit(
                  f"Day 3 narration anchor must occur exactly once; found {source.count(anchor)}"
              )
          if source.count(def_normalizer) > 1:
              raise SystemExit(
                  f"Duplicate Day 3 DEF narration normalizer; found {source.count(def_normalizer)}"
              )

          if def_normalizer not in source:
              source = source.replace(anchor, replacement, 1)
              path.write_text(source, encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          if updated.count(anchor) != 1 or updated.count(def_normalizer) != 1:
              raise SystemExit("Day 3 narration normalizer insertion failed")
          if replacement not in updated:
              raise SystemExit("DEF normalizer is not immediately after the VORTEX normalizer")

          # The exact failed token must now become a full spoken word.
          if re.sub(r"\bDEF\b", "defender", "DEF") != "defender":
              raise SystemExit("DEF -> defender narration regression check failed")

          tree = ast.parse(updated, filename=str(path))
          compile(
              updated,
              str(path),
              "exec",
              flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
              dont_inherit=True,
          )

          definitions = collections.defaultdict(list)
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  definitions[node.name].append(node.lineno)
              if isinstance(node, ast.Dict):
                  keys = [
                      key.value
                      for key in node.keys
                      if isinstance(key, ast.Constant)
                      and isinstance(key.value, (str, int, float, bytes))
                  ]
                  duplicates = [
                      key
                      for key, count in collections.Counter(keys).items()
                      if count > 1
                  ]
                  if duplicates:
                      raise SystemExit(
                          f"Duplicate literal dictionary keys near line {node.lineno}: {duplicates}"
                      )

          duplicate_definitions = {
              name: locations
              for name, locations in definitions.items()
              if len(locations) > 1
          }
          if duplicate_definitions:
              raise SystemExit(
                  "Duplicate Day 3 definitions: " + repr(duplicate_definitions)
              )

          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(updated) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(
                  f"Expected 33 standalone Day 3 cell blocks, found {len(cells)}"
              )
          for index, cell in enumerate(cells, 1):
              compile(
                  cell,
                  f"{path.name}::cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  dont_inherit=True,
              )

          print("PASS: Day 3 DEF narration normalizer inserted exactly once")
          print("PASS: all 33 Day 3 cell blocks compile")
          print("PASS: no duplicate definitions or literal dictionary keys")
          PY

          # Only the Day 3 source is allowed to differ before self-cleanup.
          changed_before="$(git diff --name-only)"
          if [[ "$changed_before" != "3_final_day3.py" ]]; then
            echo "Unexpected file changes before cleanup:" >&2
            printf '%s\n' "$changed_before" >&2
            exit 1
          fi

          git diff --check

          # Remove this one-use workflow from the resulting repository state.
          git rm .github/workflows/day3-3-narration-hotfix.yml

          # Compare both staged and unstaged changes against HEAD.
          changed_after="$(git diff HEAD --name-only | sort)"
          expected_after="$(printf '%s\n' '.github/workflows/day3-3-narration-hotfix.yml' '3_final_day3.py' | sort)"
          if [[ "$changed_after" != "$expected_after" ]]; then
            echo "Unexpected final hotfix change set:" >&2
            printf '%s\n' "$changed_after" >&2
            exit 1
          fi

          # Re-check the Day 1 / Day 2 locks after the patch.
          verify_blob "1_final_day1.py" "27ced793bb6934faada3a098815378512bac11c0"
          verify_blob ".github/workflows/day-1.yml" "240ba9024f11f894e98fad2f3199db041083a904"
          verify_blob ".github/workflows/day-2.yml" "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          verify_blob "vortex/day1_media.py" "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3_final_day3.py
          git commit -m "Fix Day 3_3 DEF narration [skip ci]"
          git push origin HEAD:main
