name: Apply Day 1 GW Review Timing Fix

on:
  push:
    paths:
      - .github/workflows/apply-day1-gw-review-timing-fix.yml

permissions:
  contents: write

jobs:
  patch-day1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch and validate Day 1
        env:
          PATCHER_B64: " "
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["PATCHER_B64"]), "<day1-patcher>", "exec"))'

      - name: Commit Day 1 source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 1_final_day1.py; then
            echo "No Day 1 source change required."
            exit 0
          fi
          git config user.name "FPL VORTEX"
          git config user.email "mukundacity@gmail.com"
          git add -- 1_final_day1.py
          git commit -m "Fix Day 1 GW review narration timing"
          git push origin HEAD:main
