name: One-time Day 2 Cell 3 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-day2-cell3-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'One-time patch Day 2 Cell 3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DRIVE_NOTEBOOK_ID: 1ppxncDctgzzcB378uDZERXPrfb3MWso0
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch Cell 3 in the live Colab notebook
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          file_id = os.environ["DRIVE_NOTEBOOK_ID"].strip()
          client_id = os.environ["GOOGLE_OAUTH_CLIENT_ID"].strip()
          client_secret = os.environ["GOOGLE_OAUTH_CLIENT_SECRET"].strip()
          refresh_token = os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"].strip()
          if not all((file_id, client_id, client_secret, refresh_token)):
              raise SystemExit("Missing Drive notebook ID or Google OAuth secret(s).")

          token_data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token",
          }).encode("utf-8")
          token_request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=token_data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(token_request, timeout=30) as response:
              token_payload = json.loads(response.read().decode("utf-8"))
          access_token = token_payload["access_token"]

          headers = {"Authorization": f"Bearer {access_token}"}
          media_url = f"https://www.googleapis.com/drive/v3/files/{file_id}?alt=media"
          meta_url = (
              f"https://www.googleapis.com/drive/v3/files/{file_id}"
              "?fields=id,name,mimeType,modifiedTime,md5Checksum,version,size"
          )

          def get_bytes():
              req = urllib.request.Request(media_url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          def get_meta():
              req = urllib.request.Request(meta_url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          before_meta = get_meta()
          raw = get_bytes()
          before_sha256 = hashlib.sha256(raw).hexdigest()
          notebook = json.loads(raw.decode("utf-8"))

          target_marker = "# CELL 3: DATA + AUDIO"
          target_cells = [
              cell for cell in notebook.get("cells", [])
              if cell.get("cell_type") == "code"
              and target_marker in "".join(cell.get("source", []))
          ]
          if len(target_cells) != 1:
              raise SystemExit(
                  f"Expected exactly one Cell 3 target, found {len(target_cells)}."
              )
          cell = target_cells[0]
          source = "".join(cell.get("source", []))

          old_block = """for _index, (_lead, _row) in enumerate(zip(_s2_leads, s2_compared_4), 1):
              scene2_triggers[f"player_{_index}"] = round(vx_phrase_time(
                  scene2_words,
                  f"{_lead} {_row['full_name']}",
                  required=True,
                  context=f"Day 2 Scene 2 player {_index}",
              ), 2)
          """

          new_block = """for _index, (_lead, _row) in enumerate(zip(_s2_leads, s2_compared_4), 1):
              # IMPORTANT: use the same canonical full-word transform as the Ryan TTS input.
              # Dynamic full names can be normalised to the FPL web/spoken name before TTS
              # (for example, "Dominik Szoboszlai" -> "Szoboszlai"). Matching the raw
              # display full_name therefore creates false exact-sync failures.
              _s2_sync_phrase = vxn_full_word_narration(
                  f"{_lead} {_row['full_name']}",
                  context=f"Day 2 Scene 2 player {_index} sync phrase",
              )
              scene2_triggers[f"player_{_index}"] = round(vx_phrase_time(
                  scene2_words,
                  _s2_sync_phrase,
                  required=True,
                  context=f"Day 2 Scene 2 player {_index}",
              ), 2)
          """

          already_fixed = new_block in source and old_block not in source
          if not already_fixed:
              old_count = source.count(old_block)
              if old_count != 1:
                  raise SystemExit(
                      "Refusing to patch: expected exactly one old Scene 2 trigger block "
                      f"inside Cell 3, found {old_count}."
                  )
              source = source.replace(old_block, new_block, 1)
              cell["source"] = source.splitlines(keepends=True)
              cell["outputs"] = []
              cell["execution_count"] = None

          seen = {}
          duplicates = []
          for index, code_cell in enumerate(notebook.get("cells", [])):
              if code_cell.get("cell_type") != "code":
                  continue
              code = "".join(code_cell.get("source", []))
              compile(
                  code,
                  f"notebook-cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  dont_inherit=True,
              )
              normalized = code.strip()
              if not normalized:
                  continue
              digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
              if digest in seen:
                  duplicates.append((seen[digest], index))
              else:
                  seen[digest] = index
          if duplicates:
              raise SystemExit(f"Exact duplicate code cells found: {duplicates}")

          after_bytes = json.dumps(
              notebook,
              ensure_ascii=False,
              indent=1,
          ).encode("utf-8")
          after_sha256 = hashlib.sha256(after_bytes).hexdigest()

          if not already_fixed:
              upload_url = (
                  f"https://www.googleapis.com/upload/drive/v3/files/{file_id}"
                  "?uploadType=media"
              )
              upload_headers = {
                  **headers,
                  "Content-Type": "application/vnd.google.colaboratory",
                  "Content-Length": str(len(after_bytes)),
              }
              upload_request = urllib.request.Request(
                  upload_url,
                  data=after_bytes,
                  headers=upload_headers,
                  method="PATCH",
              )
              with urllib.request.urlopen(upload_request, timeout=90) as response:
                  response.read()

          verify_raw = get_bytes()
          verify_notebook = json.loads(verify_raw.decode("utf-8"))
          verify_cells = [
              c for c in verify_notebook.get("cells", [])
              if c.get("cell_type") == "code"
              and target_marker in "".join(c.get("source", []))
          ]
          if len(verify_cells) != 1:
              raise SystemExit("Post-upload verification could not locate Cell 3 exactly once.")
          verify_source = "".join(verify_cells[0].get("source", []))
          if new_block not in verify_source or old_block in verify_source:
              raise SystemExit("Post-upload verification failed: corrected trigger block not live.")

          after_meta = get_meta()
          status = {
              "status": "PASS",
              "drive_notebook_id": file_id,
              "drive_name": after_meta.get("name"),
              "already_fixed": bool(already_fixed),
              "patched": not already_fixed,
              "verified_live": True,
              "before_sha256": before_sha256,
              "intended_after_sha256": after_sha256,
              "live_after_sha256": hashlib.sha256(verify_raw).hexdigest(),
              "before_modifiedTime": before_meta.get("modifiedTime"),
              "after_modifiedTime": after_meta.get("modifiedTime"),
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "fix": (
                  "Scene 2 player reveal sync now canonicalises each trigger phrase "
                  "with the same vxn_full_word_narration transform used before Ryan TTS."
              ),
          }
          Path("PATCH_DAY2_CELL3_STATUS.json").write_text(
              json.dumps(status, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Record verified patch status
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PATCH_DAY2_CELL3_STATUS.json
          git commit -m "Record Day 2 Cell 3 patch status"
          git push
