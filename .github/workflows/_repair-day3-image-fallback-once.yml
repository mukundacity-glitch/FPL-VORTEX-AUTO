name: Install authored Inter from Day 3 runtime once

on:
  push:
    branches:
      - __day3-image-fallback-fix
    paths:
      - .github/workflows/_repair-day3-image-fallback-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard and patch Day 3 source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 3_final_day3.py)" = "1e73f49a997eeebfba1a7f1ede305b89e1226bc1"
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          test "$(git hash-object .github/workflows/day-3.yml)" = "64e57f96a9c994dbd64975396ede83f21f4ace7b"
          test "$(git hash-object vortex/day1_media.py)" = "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"

          python - <<'PY'
          from pathlib import Path
          import ast, base64, collections, re

          path = Path('3_final_day3.py')
          source = path.read_text(encoding='utf-8')
          anchor = 'FORCE_IMAGE_FALLBACK_PLAYERS = ""  # @param {type:"string"}\n'
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Day 3 fallback control anchor, found {source.count(anchor)}')
          if 'def vx_ensure_inter_font()' in source:
              raise SystemExit('Day 3 Inter runtime helper already exists')

          helper = base64.b64decode(' hfZW5zdXJlX2ludGVyX2ZvbnQoKQo='.replace('dn hf','dnhf')).decode('utf-8')
          source = source.replace(anchor, anchor + helper, 1)

          if source.count('def vx_ensure_inter_font()') != 1:
              raise SystemExit('Day 3 Inter helper is not unique')
          if source.count('vx_ensure_inter_font()') != 2:
              raise SystemExit('Day 3 Inter helper must have one definition and one startup call')
          if source.count('fonts-inter') != 2:
              raise SystemExit('Unexpected Day 3 fonts-inter marker count')

          tree = ast.parse(source, filename=str(path))
          compile(source, str(path), 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT, dont_inherit=True)
          definitions = collections.defaultdict(list)
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  definitions[node.name].append(node.lineno)
              if isinstance(node, ast.Dict):
                  keys = [key.value for key in node.keys if isinstance(key, ast.Constant) and isinstance(key.value, (str, int, float, bytes))]
                  duplicate_keys = [key for key, count in collections.Counter(keys).items() if count > 1]
                  if duplicate_keys:
                      raise SystemExit(f'Duplicate literal dictionary keys near line {node.lineno}: {duplicate_keys}')
          duplicate_defs = {name: lines for name, lines in definitions.items() if len(lines) > 1}
          if duplicate_defs:
              raise SystemExit('Duplicate Day 3 definitions: ' + repr(duplicate_defs))

          marker = re.compile(r'(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)')
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(f'Expected 33 standalone Day 3 cells, found {len(cells)}')
          for index, cell in enumerate(cells, 1):
              compile(cell, f'{path.name}::cell-{index}', 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT, dont_inherit=True)

          path.write_text(source, encoding='utf-8')
          print('Day 3 deterministic Inter runtime setup: PASS')
          print('Day 3 AST/33-cell/duplicate validation: PASS')
          PY

          git diff --check -- 3_final_day3.py
          test "$(git diff --name-only | tr -d '\r')" = "3_final_day3.py"
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
          test "$(git hash-object .github/workflows/day-3.yml)" = "64e57f96a9c994dbd64975396ede83f21f4ace7b"
          test "$(git hash-object vortex/day1_media.py)" = "6bb0a541b3f9fb7164afaa7e683d41e14c2a6fb0"
          echo "Locked Day 1/Day 2 files unchanged: PASS"

      - name: Prove Day 3 font helper on this runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('3_final_day3.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          wanted = {'_vx_inter_font_available', 'vx_ensure_inter_font'}
          nodes = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted]
          if {node.name for node in nodes} != wanted:
              raise SystemExit('Unable to isolate Day 3 font helper definitions')
          module = ast.Module(body=nodes, type_ignores=[])
          ns = {}
          exec(compile(module, '<day3-font-helper>', 'exec'), ns, ns)
          ns['vx_ensure_inter_font']()
          if not ns['_vx_inter_font_available']():
              raise SystemExit('Inter did not resolve after Day 3 helper ran')
          print('Day 3 authored Inter runtime verification: PASS')
          PY

      - name: Commit only Day 3 source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 3_final_day3.py
          test "$(git diff --cached --name-only | tr -d '\r')" = "3_final_day3.py"
          git commit -m "Ensure authored Inter font for Day 3 renders"
          git push origin HEAD:__day3-image-fallback-fix
