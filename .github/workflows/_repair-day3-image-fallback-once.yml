name: Verify Day 3 Inter package

on:
  push:
    branches:
      - __day3-image-fallback-fix
    paths:
      - .github/workflows/_repair-day3-image-fallback-once.yml

permissions:
  contents: read

jobs:
  font-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify locked files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 3_final_day3.py)" = "1e73f49a997eeebfba1a7f1ede305b89e1226bc1"
          test "$(git hash-object 1_final_day1.py)" = "27ced793bb6934faada3a098815378512bac11c0"
          test "$(git hash-object .github/workflows/day-1.yml)" = "240ba9024f11f894e98fad2f3199db041083a904"
          test "$(git hash-object .github/workflows/day-2.yml)" = "6ee1ae8869984d9fd178d5d0a61bdc77ea05c998"
      - name: Prove fonts-inter installs the authored Day 3 font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          apt-cache policy fonts-inter
          sudo apt-get install --yes fonts-inter
          fc-cache -f
          actual="$(fc-match -f '%{family}\n' Inter | head -n1)"
          echo "Inter resolves to: ${actual}"
          printf '%s\n' "${actual}" | grep -Eiq '(^|,)Inter([ ,:]|$)'
          fc-list : family | grep -Ei '(^|,)Inter([ ,:]|$)' | head -n 5
          echo "Ubuntu fonts-inter package: PASS"
