name: FPL VORTEX Weekly Review Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "run_weekly_review_cloud.py"
      - ".github/workflows/weekly_review.yml"

permissions:
  contents: read

concurrency:
  group: fpl-vortex-weekly-review
  cancel-in-progress: true

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout FPL VORTEX AUTO
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "scipy>=1.13,<2" "pillow>=10,<13" "matplotlib>=3.8,<4" \
                      "mutagen>=1.47,<2" "edge-tts>=7,<8" "playwright>=1.50,<2" \
                      "ipython>=8,<10"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Validate Google Drive credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo "::error::GOOGLE_OAUTH_CLIENT_ID is missing or blank"; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET" || { echo "::error::GOOGLE_OAUTH_CLIENT_SECRET is missing or blank"; exit 1; }
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN" || { echo "::error::GOOGLE_OAUTH_REFRESH_TOKEN is missing or blank"; exit 1; }
          echo "FPL VORTEX Google Drive credentials are configured."

      - name: Run latest Drive weekly notebook
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_weekly_review_cloud.py

      - name: Keep cloud-run diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-weekly-review-${{ github.run_id }}
          path: |
            .cloud_run/weekly_cloud_run_report.json
            /content/drive/MyDrive/FPL_VORTEX/First Day Video/DATA/*.json
          if-no-files-found: warn
          retention-days: 7
