name: Day 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-vortex-day-2
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DAY2_OUTPUT_ROOT: /content/drive/MyDrive/FPL_VORTEX/Day_2
  DAY2_ASSET_DIR: /tmp/day2-assets
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

jobs:
  day2:
    name: Run isolated Day 2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove Day 1 is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(\.github/workflows/day-2\.yml|day2/|README\.md)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected non-Day-2 changes:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          for file in \
            .github/workflows/day-1.yml \
            .github/workflows/gameweek-state-watcher.yml \
            1_final_day1.py \
            vortex/day1_media.py \
            vortex/youtube_private_upload.py \
            vortex/youtube_studio_package.py; do
            [[ "$(git rev-parse HEAD:${file})" == "$(git rev-parse origin/main:${file})" ]] || {
              echo "Protected Day 1 file changed: ${file}" >&2; exit 1;
            }
          done
          echo "[DAY 2] Day 1 protected files: byte-identical to main"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Day 2 media tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Configure private Google Drive connection
        shell: bash
        run: python -m day2.drive_io configure

      - name: Restore isolated Day 2 inputs and shared media
        shell: bash
        run: |
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content
          python -m day2.drive_io restore

      - name: Install fresh Day 2 render dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" "pandas>=2.2,<3" "numpy>=2.0,<3" \
            "Pillow>=10.4,<12" "scipy>=1.14,<2" "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" "nest-asyncio>=1.6,<2" "playwright>=1.46,<2" \
            "edge-tts>=6.1,<8"
          python -m playwright install --with-deps chromium

      - name: Execute fresh Day 2 notebook
        shell: bash
        run: |
          set -o pipefail
          python -m day2.run_notebook \
            --notebook /content/drive/MyDrive/Colab\ Notebooks/DAY2_FINAL.ipynb \
            --quality FINAL \
            2>&1 | tee "${RUNNER_TEMP}/day2.log"

      - name: Mix shared opening background and outro into Day 2
        shell: bash
        run: python -m day2.media --output-root "${DAY2_OUTPUT_ROOT}" --asset-dir "${DAY2_ASSET_DIR}"

      - name: Build and validate private Day 2 metadata
        shell: bash
        run: |
          python -m day2.youtube build \
            --output-root "${DAY2_OUTPUT_ROOT}" \
            --config day2/metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["DAY2_OUTPUT_ROOT"]).resolve()
          expected = Path("/content/drive/MyDrive/FPL_VORTEX/Day_2")
          if root != expected:
              raise SystemExit(f"Unsafe output root: {root}")
          media = json.loads((root / "Data/day2_media_qa.json").read_text())
          package = json.loads((root / "Data/day2_youtube_package.json").read_text())
          policy = {
              "privacy_status": "private", "notify_subscribers": False,
              "automatic_publish": False, "automatic_schedule": False,
              "manual_publication_required": True,
          }
          if media.get("passed") is not True:
              raise SystemExit("Day 2 media QA did not pass")
          mix = media.get("mix") or {}
          expected = {
              "mode": "voice_anchored_dynamic_ducking",
              "narration_target_lufs": -18.0,
              "music_base_target_lufs": -27.5,
              "music_nominal_speech_target_lufs": -33.0,
              "nominal_duck_db": 5.5,
              "attack_ms": 30.0,
              "release_ms": 350.0,
              "presence_dip_db": -2.0,
              "final_true_peak_ceiling_dbtp": -1.0,
          }
          for key, value in expected.items():
              if mix.get(key) != value:
                  raise SystemExit(
                      f"Day 2 voice-first mix contract mismatch: {key}={mix.get(key)!r}"
                  )
          narration = media.get("program", {}).get("narration_loudness", {})
          music = media.get("background_music", {}).get("loudness", {})
          final_audio = media.get("final", {}).get("loudness", {})
          if abs(float(narration.get("normalized_lufs") or 0) - (-18.0)) > 0.8:
              raise SystemExit("Day 2 Ryan narration missed the -18 LUFS target")
          if abs(float(music.get("normalized_lufs") or 0) - (-27.5)) > 1.5:
              raise SystemExit("Day 2 background music missed its base loudness target")
          if float(final_audio.get("true_peak_dbtp") or 99) > -1.0:
              raise SystemExit("Day 2 final master exceeds -1 dBTP")
          if float(media.get("outro_music", {}).get("excerpt_duration") or 0) != 6.0:
              raise SystemExit("Day 2 outro is not the six-second contract")
          if package.get("upload_policy") != policy:
              raise SystemExit("Day 2 YouTube policy is not locked to private")
          print(f"[DAY 2] Output saved at: {root}")
          print("[DAY 2] Private-only metadata + measured voice-first ducking: PASS")
          PY

      - name: Install YouTube dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"

      - name: Upload fresh Day 2 privately to YouTube
        shell: bash
        run: |
          python -m day2.youtube upload --output-root "${DAY2_OUTPUT_ROOT}"
          echo "[DAY 2] Fresh YouTube upload completed and verified as Private"

      - name: Require a new verified Private YouTube video
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["DAY2_OUTPUT_ROOT"])
          report = json.loads((root / "Data/day2_youtube_private_upload.json").read_text())
          if report.get("status") != "private_upload_complete":
              raise SystemExit(f"Day 2 YouTube upload did not complete: {report.get('status')}")
          youtube = report.get("youtube") or {}
          if youtube.get("privacy_status") != "private" or not youtube.get("video_id"):
              raise SystemExit("Day 2 YouTube upload is missing a verified Private video ID")
          print(f"[DAY 2] Verified new Private YouTube video: {youtube['video_id']}")
          PY

      - name: Publish Day 2 outputs to Google Drive
        if: always()
        shell: bash
        run: python -m day2.drive_io publish

      - name: Upload Day 2 build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day2-video-output-${{ github.run_number }}
          path: /content/drive/MyDrive/FPL_VORTEX/Day_2
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload Day 2 execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day2-video-log-${{ github.run_number }}
          path: ${{ runner.temp }}/day2.log
          if-no-files-found: warn
          retention-days: 14
