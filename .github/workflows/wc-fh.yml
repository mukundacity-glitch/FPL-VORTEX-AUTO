permissions:
  contents: read

concurrency:
  group: fpl-vortex-wc-fh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  WC_FH_TASK: ${{ inputs.task }}
  WC_FH_CHIP: ${{ inputs.chip }}
  WC_FH_SELECTION: ${{ inputs.selection }}
  WC_FH_INPUTS: ${{ toJSON(inputs) }}
  WC_FH_NOTEBOOK_PATH: /tmp/fpl-vortex-wc-fh.ipynb
  WC_FH_OUTPUT_ROOT: /content/drive/MyDrive/FPL_VORTEX/WC_FH_GITHUB/runs/${{ github.run_id }}_${{ github.run_attempt }}
  FPL_MEDIA_ASSET_DIR: /tmp/wc-fh-assets
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

jobs:
  wc-fh:
    name: ${{ inputs.chip }} / ${{ inputs.selection }} / Final 4K
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate manual controls
        run: python -m wc_fh.controls

      - name: Install system media tools
        run: |
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Set up Node for existing Remotion scenes
        if: inputs.task == 'Render and upload'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install isolated WC- FH dependencies
        run: python -m pip install -r wc_fh/requirements.txt

      - name: Run WC- FH regression checks
        run: python -m unittest discover -s wc_fh -p 'test_*.py' -v

      - name: Install Chromium runtime
        if: inputs.task == 'Render and upload'
        run: python -m playwright install --with-deps chromium

      - name: Configure existing private Drive connection
        id: configure_drive
        run: python -m wc_fh.drive_io configure

      - name: Restore current notebook, model cache and original media
        id: restore
        run: python -m wc_fh.drive_io restore

      - name: Validate every production notebook cell
        run: python -m wc_fh.run_notebook "$WC_FH_NOTEBOOK_PATH" --validate-only

      - name: Generate the selected Final video or refresh the player picker
        id: render
        shell: bash
        run: |
          set -o pipefail
          python -m wc_fh.run_notebook "$WC_FH_NOTEBOOK_PATH" 2>&1 | tee "$WC_FH_OUTPUT_ROOT/execution.log"

      - name: Save private YouTube draft with description, SEO tags, hashtags and thumbnail
        if: inputs.task == 'Render and upload'
        run: python -m wc_fh.publish_private --output-root "$WC_FH_OUTPUT_ROOT"

      - name: Save only WC- FH output to Drive
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: python -m wc_fh.drive_io publish

      - name: Downloadable live-cost squad picker and player list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wc-fh-squad-picker-${{ github.run_number }}
          path: ${{ env.WC_FH_OUTPUT_ROOT }}/picker
          if-no-files-found: warn
          retention-days: 30

      - name: Downloadable Final video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wc-fh-final-${{ github.run_number }}
          path: ${{ env.WC_FH_OUTPUT_ROOT }}/mp4/*/final/*Combined*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Metadata, squad cost and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wc-fh-reports-${{ github.run_number }}
          path: |
            ${{ env.WC_FH_OUTPUT_ROOT }}/data/selection.*
            ${{ env.WC_FH_OUTPUT_ROOT }}/youtube
            ${{ env.WC_FH_OUTPUT_ROOT }}/source.json
            ${{ env.WC_FH_OUTPUT_ROOT }}/delivery_manifest.json
            ${{ env.WC_FH_OUTPUT_ROOT }}/analysis/*media_audit.json
            ${{ env.WC_FH_OUTPUT_ROOT }}/runtime_error.txt
            ${{ env.WC_FH_OUTPUT_ROOT }}/execution.log
          if-no-files-found: warn
          retention-days: 14
