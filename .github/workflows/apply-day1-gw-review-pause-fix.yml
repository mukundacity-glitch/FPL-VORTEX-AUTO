name: Apply Day 1 GW Review Pause Fix

on:
  push:
    paths:
      - .github/workflows/apply-day1-gw-review-pause-fix.yml

permissions:
  contents: write

jobs:
  patch-day1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch and validate Day 1 pause control
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/day1_pause_fix.py

      - name: Commit Day 1 pause fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 1_final_day1.py; then
            echo "No Day 1 source change required."
            exit 0
          fi
          git config user.name "FPL VORTEX"
          git config user.email "mukundacity@gmail.com"
          git add -- 1_final_day1.py
          git commit -m "Fix Day 1 GW review narration pauses"
          git push origin HEAD:main
